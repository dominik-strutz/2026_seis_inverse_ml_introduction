# Install once with `make hooks`.
repos:
  - repo: local
    hooks:
      - id: snapshots
        # the molab previews of the published parts must be regenerated (`make
        # snapshots`) whenever a notebook or the ml_seis code it uses changes
        name: molab snapshots are up to date
        entry: uv run python scripts/snapshots.py check
        language: system
        pass_filenames: false
        # Checking hashes is quick.  Run it on every commit so an already stale
        # preview cannot slip through together with an unrelated change.
        always_run: true
      - id: layouts
        # molab and a downloaded notebook see one file, so the slide layout must
        # be embedded in it (`make layouts`), not only in lectures/layouts/
        name: slide layouts are embedded in the notebooks
        entry: uv run python scripts/embed_layouts.py check
        language: system
        pass_filenames: false
        # As above, validate every commit instead of relying on the staged-file
        # filter to notice an older, stale notebook.
        always_run: true
