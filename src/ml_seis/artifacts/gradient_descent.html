<!doctype html>
<!-- Artifact: gradient descent on the misfit map. S(m) as in misfit.html (centred data, fixed
     picks from torch.manual_seed(0), true source (55, 45)). Click or drag the map to choose a
     start; step or run applies m <- m - eta grad S, with grad S = G^T C r. Right: the update
     rule, step size eta in km^2/s^2, S against step. Shared ml_seis style. Fonts are embedded
     by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x440">
<title>Gradient descent</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00; --c3: #009e73; --edge: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d; --c3: #3ddc97; --edge: #0b0e14;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px;
    transform-origin: 0 0; }
  #heat { position: absolute; left: 80px; top: 20px; width: 360px; height: 360px; }
  #map { position: absolute; left: 0; top: 0; user-select: none; touch-action: none; }
  svg text { fill: var(--ink); font-size: 11.5px; }
  svg .axis, svg .note { font-size: 13px; }
  svg .lab { font-size: 13px; }
  .m, svg .m { font-family: "Latin Modern Roman", "STIXGeneral", "Times New Roman", serif;
    font-style: italic; font-size: 1.2em; }
  math { font-family: "Latin Modern Math", "Latin Modern Math", "Cambria Math", math;
    math-style: normal; font-size: 21px; white-space: nowrap; }
  .bv { font-style: normal; font-weight: 700; }
  .cD { color: var(--ink2); } .cF { color: var(--c3); } .cR { color: var(--c2); }

  #side { position: absolute; left: 556px; top: 20px; width: 520px; height: 400px;
    display: flex; flex-direction: column; }
  .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink); margin: 0 0 6px 2px; }
  .eq { height: 58px; display: flex; align-items: center; justify-content: center; }
  #ctl { display: flex; align-items: center; gap: 12px; margin: 10px 2px 0; white-space: nowrap;
    color: var(--ink2); font-size: 12px; }
  #ctl .nm { color: var(--ink); font-size: 13px; }
  input[type=range] { width: 170px; accent-color: var(--c2); }
  #etav { color: var(--ink); font-family: "DejaVu Sans Mono", ui-monospace, monospace;
    font-size: 15px; width: 36px; text-align: right; font-variant-numeric: tabular-nums; }
  button { font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--ink2); border-radius: 3px; padding: 4px 11px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  #chart { display: block; flex: none; margin-top: 8px; }
  #read { margin: 6px 2px 0; display: flex; gap: 22px; white-space: nowrap;
    font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 15px;
    font-variant-numeric: tabular-nums; }
  #read .u { color: var(--ink2); font-family: "DejaVu Sans", sans-serif; font-size: 12px; }
  #cost { margin: 10px 2px 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 16px;
    white-space: nowrap; }
  #cost .nm { color: var(--ink); font-size: 13px; }
  #cost .v { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 15px;
    font-variant-numeric: tabular-nums; }
  #cost .v sup { font-size: 11px; }
  #cost .u { color: var(--ink2); font-family: "DejaVu Sans", sans-serif; font-size: 12px; }
  #hint { margin-top: auto; color: var(--ink2); font-size: 12px; }
  #plot { cursor: crosshair; }
  #path, #nxt { pointer-events: none; }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<canvas id="heat" width="720" height="720"></canvas>
<svg id="map" width="540" height="440" viewBox="0 0 540 440" role="img"
     aria-label="Misfit map with the gradient descent path from a chosen start">
  <g id="stations"></g>
  <g id="path"></g>
  <g id="nxt"></g>
  <rect id="plot" x="80" y="20" width="360" height="360" fill="none" stroke="var(--ink2)" stroke-width="1"
        pointer-events="all"/>
  <g id="ticks" stroke="var(--ink2)"></g>
  <g id="ticklabels"></g>
  <g id="cbar"></g>
  <text class="axis" x="260" y="424" text-anchor="middle">East <tspan class="m">x</tspan> (km)</text>
  <text class="axis" transform="translate(26 200) rotate(-90)" text-anchor="middle">North <tspan class="m">y</tspan> (km)</text>
  <text class="axis" x="458" y="12"><tspan class="m">S</tspan> (s²)</text>
</svg>

<div id="side">
  <div class="cap">Follow the gradient downhill</div>
  <div class="eq">
    <math><msub><mi class="bv cM">m</mi><mrow><mi>k</mi><mo>+</mo><mn>1</mn></mrow></msub><mo>=</mo>
      <msub><mi class="bv cM">m</mi><mi>k</mi></msub><mo>−</mo><mi>η</mi><mo>∇</mo><mi>S</mi><mo stretchy="false">(</mo><msub><mi class="bv cM">m</mi><mi>k</mi></msub><mo stretchy="false">)</mo></math>
  </div>
  <div id="ctl">
    <span class="nm">step size <span class="m">η</span></span>
    <input type="range" id="eta" min="2" max="80" step="1" value="20">
    <span id="etav"></span><span>km²/s²</span>
    <span style="flex:1"></span>
    <button id="step">step</button><button id="run">run</button><button id="reset">reset</button>
  </div>
  <svg id="chart" width="520" height="122" viewBox="0 0 520 122"></svg>
  <div id="cost"></div>
</div>
</div>

<script>
  const V = 6;
  const ST = [
    { i: 1, x: 10, y: 20, dy: 28 },
    { i: 2, x: 90, y: 30, dy: 28 },
    { i: 3, x: 40, y: 85, dy: -18 },
  ];
  const D_C = [1.4161, -1.0005, -0.4156];     // d~_obs: centred picks, torch.manual_seed(0)
  const START = { x: 85, y: 80 };
  const KMAX = 30;
  let path = [{ ...START }];

  const ns = "http://www.w3.org/2000/svg";
  const px = x => 80 + 3.6 * x, py = y => 380 - 3.6 * y;
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const $ = id => document.getElementById(id);
  const halo = { "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": 3, "stroke-linejoin": "round" };
  const centred = F => { const mu = F.reduce((a, b) => a + b) / F.length; return F.map(f => f - mu); };
  const Fc = (x, y) => centred(ST.map(s => Math.hypot(x - s.x, y - s.y) / V));
  const resid = p => Fc(p.x, p.y).map((f, i) => f - D_C[i]);
  const misfit = p => 0.5 * resid(p).reduce((a, r) => a + r * r, 0);
  // grad S = G^T C r; r is already centred, so C r = r
  function grad(p) {
    const r = resid(p), g = { x: 0, y: 0 };
    ST.forEach((s, i) => {
      const D = Math.hypot(p.x - s.x, p.y - s.y) || 1e-9;
      g.x += r[i] * (p.x - s.x) / (V * D);
      g.y += r[i] * (p.y - s.y) / (V * D);
    });
    // C G: remove the station mean of each column of G
    const Gm = { x: 0, y: 0 };
    ST.forEach(s => {
      const D = Math.hypot(p.x - s.x, p.y - s.y) || 1e-9;
      Gm.x += (p.x - s.x) / (V * D) / ST.length;
      Gm.y += (p.y - s.y) / (V * D) / ST.length;
    });
    const rs = r.reduce((a, b) => a + b, 0);       // sum of a centred r is 0: kept for clarity
    g.x -= Gm.x * rs; g.y -= Gm.y * rs;
    return g;
  }
  const eta = () => +$("eta").value;
  const clampKm = v => Math.min(100, Math.max(0, v));

  // ---- map furniture
  for (let k = 0; k <= 100; k += 10) {
    const major = k % 20 === 0, len = major ? 6 : 3, w = major ? 0.8 : 0.4;
    const tk = (x1, y1, x2, y2) => el($("ticks"), "line", { x1, y1, x2, y2, "stroke-width": w });
    tk(px(k), py(0), px(k), py(0) - len);
    tk(px(k), py(100), px(k), py(100) + len);
    tk(px(0), py(k), px(0) + len, py(k));
    tk(px(100), py(k), px(100) - len, py(k));
    if (major) {
      el($("ticklabels"), "text", { x: px(k), y: py(0) + 18, "text-anchor": "middle" }, k);
      el($("ticklabels"), "text", { x: px(0) - 8, y: py(k) + 4, "text-anchor": "end" }, k);
    }
  }
  ST.forEach(s => {
    const cx = px(s.x), cy = py(s.y);
    el($("stations"), "polygon", { points: `${cx},${cy - 12} ${cx - 11},${cy + 8} ${cx + 11},${cy + 8}`,
      fill: "var(--c1)", stroke: "var(--edge)", "stroke-width": 0.8, "stroke-linejoin": "round" });
    const t = el($("stations"), "text", Object.assign({ class: "lab", x: cx, y: cy + s.dy, "text-anchor": "middle" }, halo));
    el(t, "tspan", { class: "m" }, "ξ");
    el(t, "tspan", { class: "m", dy: 3, "font-size": 10 }, s.i);
  });

  // ---- S(m) as log-banded colour, as in misfit.html
  const LO = -3, HI = 1.8, NB = 12, STEP = (HI - LO) / NB;
  const band = S => Math.max(0, Math.min(NB - 1, Math.floor((Math.log10(Math.max(S, 1e-9)) - LO) / STEP)));
  const N = 720, bands = new Uint8Array(N * N);
  for (let j = 0; j < N; j++) for (let i = 0; i < N; i++)
    bands[j * N + i] = band(misfit({ x: (i + 0.5) / N * 100, y: (1 - (j + 0.5) / N) * 100 }));
  const hex = v => { v = v.trim().replace("#", ""); return [0, 2, 4].map(k => parseInt(v.slice(k, k + 2), 16)); };
  const css = n => hex(getComputedStyle(document.documentElement).getPropertyValue(n));
  const shade = (b, c1, bg) => { const t = 0.9 * Math.pow(b / (NB - 1), 1.7);
    return c1.map((c, k) => Math.round(c * (1 - t) + bg[k] * t)); };
  const CB = { x: 458, y0: 20, w: 12, h: 360 };
  const cbY = S => CB.y0 + CB.h * (1 - (Math.log10(Math.max(S, 1e-9)) - LO) / (HI - LO));

  function paint() {
    const c1 = css("--c1"), bg = css("--bg");
    const cols = Array.from({ length: NB }, (_, b) => shade(b, c1, bg));
    const ctx = $("heat").getContext("2d"), img = ctx.createImageData(N, N);
    for (let p = 0; p < N * N; p++) {
      const c = cols[bands[p]]; img.data[4 * p] = c[0]; img.data[4 * p + 1] = c[1];
      img.data[4 * p + 2] = c[2]; img.data[4 * p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    const g = $("cbar"); g.innerHTML = "";
    const h = CB.h / NB;
    for (let b = 0; b < NB; b++)
      el(g, "rect", { x: CB.x, y: CB.y0 + (NB - 1 - b) * h + 0.2, width: CB.w, height: h - 0.1,
        fill: `rgb(${cols[b].join(",")})` });
    el(g, "rect", { x: CB.x, y: CB.y0, width: CB.w, height: CB.h, fill: "none", stroke: "var(--ink2)" });
    for (let e = LO + 1; e <= 1; e++) {
      const y = cbY(Math.pow(10, e));
      el(g, "line", { x1: CB.x, x2: CB.x + 5, y1: y, y2: y, stroke: "var(--ink2)" });
      const t = el(g, "text", { x: CB.x + 18, y: y + 4 }, "10");
      el(t, "tspan", { dy: -5, "font-size": 9 }, e === 0 ? "0" : String(e).replace("-", "−"));
    }
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(paint, 0));

  // ---- path, next step, S(k) chart, read-out
  const star = (r1, r2) => {
    const p = [];
    for (let k = 0; k < 10; k++) {
      const rad = k % 2 ? r2 : r1, a = -Math.PI / 2 + k * Math.PI / 5;
      p.push(`${rad * Math.cos(a)},${rad * Math.sin(a)}`);
    }
    return p.join(" ");
  };
  const nextPoint = p => {
    const g = grad(p), e = eta();
    return { x: clampKm(p.x - e * g.x), y: clampKm(p.y - e * g.y), g };
  };
  const sg = v => v.toFixed(v < 1 ? 3 : 2);
  function draw() {
    const gp = $("path"), gn = $("nxt"); gp.innerHTML = ""; gn.innerHTML = "";
    const P = path;
    el(gp, "polyline", { points: P.map(p => `${px(p.x)},${py(p.y)}`).join(" "), fill: "none",
      stroke: "var(--ink)", "stroke-width": 3.4, "stroke-linejoin": "round", opacity: 0.9 });
    el(gp, "polyline", { points: P.map(p => `${px(p.x)},${py(p.y)}`).join(" "), fill: "none",
      stroke: "var(--c2)", "stroke-width": 1.8, "stroke-linejoin": "round" });
    P.forEach((p, k) => el(gp, "circle", { cx: px(p.x), cy: py(p.y), r: k === P.length - 1 ? 6 : 3.2,
      fill: k === P.length - 1 ? "var(--c2)" : "var(--bg)", stroke: "var(--ink)", "stroke-width": 1 }));
    const cur = P[P.length - 1], nx = nextPoint(cur);
    const dx = px(nx.x) - px(cur.x), dy = py(nx.y) - py(cur.y), L = Math.hypot(dx, dy);
    if (L > 3) {
      const ux = dx / L, uy = dy / L;
      el(gn, "line", { x1: px(cur.x), y1: py(cur.y), x2: px(nx.x), y2: py(nx.y),
        stroke: "var(--c2)", "stroke-width": 1.6, "stroke-dasharray": "4 3" });
      el(gn, "polygon", { points: `${px(nx.x)},${py(nx.y)} ${px(nx.x) - 9 * ux + 4.5 * uy},${py(nx.y) - 9 * uy - 4.5 * ux} ${px(nx.x) - 9 * ux - 4.5 * uy},${py(nx.y) - 9 * uy + 4.5 * ux}`,
        fill: "var(--c2)" });
    }
    const t = el(gn, "text", Object.assign({ x: px(P[0].x) + 12, y: py(P[0].y) - 10 }, halo), "start");
    // chart of S against step
    const c = $("chart"); c.innerHTML = "";
    const Ss = P.map(misfit), top = Math.max(Ss[0], 0.5) * 1.05;
    const X0 = 58, X1 = 500, Y0 = 102, Y1 = 8;
    const xv = k => X0 + (X1 - X0) * k / KMAX, yv = s => Y0 - (Y0 - Y1) * s / top;
    el(c, "line", { x1: X0, x2: X0, y1: Y1, y2: Y0, stroke: "var(--ink2)" });
    el(c, "line", { x1: X0, x2: X1, y1: Y0, y2: Y0, stroke: "var(--ink2)" });
    for (let k = 0; k <= KMAX; k += 5) {
      el(c, "line", { x1: xv(k), x2: xv(k), y1: Y0, y2: Y0 - 4, stroke: "var(--ink2)" });
      el(c, "text", { x: xv(k), y: Y0 + 14, "text-anchor": "middle" }, k);
    }
    const yt = top > 4 ? 2 : top > 1.5 ? 1 : 0.5;
    for (let s = 0; s <= top; s += yt) {
      el(c, "line", { x1: X0, x2: X0 + 4, y1: yv(s), y2: yv(s), stroke: "var(--ink2)" });
      el(c, "text", { x: X0 - 8, y: yv(s) + 4, "text-anchor": "end" }, s);
    }
    el(c, "text", { x: X1, y: Y0 + 14, "text-anchor": "end", dx: 18 }, "");
    const tx = el(c, "text", { x: X1 - 40, y: Y0 - 8, "text-anchor": "end" });
    tx.innerHTML = '<tspan class="m">k</tspan> (steps)';
    const ty = el(c, "text", { x: 6, y: 12 }); ty.innerHTML = '<tspan class="m">S</tspan> (s²)';
    el(c, "polyline", { points: Ss.map((s, k) => `${xv(k)},${yv(s)}`).join(" "), fill: "none",
      stroke: "var(--c2)", "stroke-width": 1.8 });
    Ss.forEach((s, k) => el(c, "circle", { cx: xv(k), cy: yv(s), r: 3, fill: "var(--c2)" }));
    $("etav").textContent = eta();
    const k = P.length - 1;
    $("cost").innerHTML =
      '<span class="nm">gradient descent</span><span class="v" style="color:var(--c2)">' + k +
      ' <span class="u">gradients</span></span>';
  }

  function stepOnce() {
    if (path.length > KMAX) return false;
    const cur = path[path.length - 1], nx = nextPoint(cur);
    path.push({ x: nx.x, y: nx.y }); draw();
    return Math.hypot(nx.x - cur.x, nx.y - cur.y) > 0.02;
  }
  let timer = null;
  const stop = () => { clearInterval(timer); timer = null; $("run").textContent = "run"; };
  $("step").addEventListener("click", () => { stop(); stepOnce(); });
  $("run").addEventListener("click", () => {
    if (timer) return stop();
    $("run").textContent = "pause";
    timer = setInterval(() => { if (!stepOnce()) stop(); }, 350);
  });
  const restart = p => { stop(); path = [{ ...p }]; draw(); };
  $("reset").addEventListener("click", () => restart(path[0]));
  $("eta").addEventListener("input", draw);

  // click or drag on the map to choose the start
  const svg = $("map");
  const toKm = ev => {
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: clampKm((p.x - 80) / 3.6), y: clampKm((380 - p.y) / 3.6) };
  };
  $("plot").addEventListener("pointerdown", ev => {
    $("plot").setPointerCapture(ev.pointerId); restart(toKm(ev));
    const mv = e => restart(toKm(e));
    const up = () => { $("plot").removeEventListener("pointermove", mv); $("plot").removeEventListener("pointerup", up); };
    $("plot").addEventListener("pointermove", mv); $("plot").addEventListener("pointerup", up);
  });

  paint(); draw();
</script>
</body>
</html>
