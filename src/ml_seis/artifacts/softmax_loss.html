<!doctype html>
<!-- Artifact: from logits to a loss. Drag the logits a of the four Llaima
     classes; softmax turns them into probabilities p that add to one, and the loss of one
     record is -log of the probability the network gives the labelled class (the
     cross-entropy, written out with the numbers in the box at the bottom right). Switch
     to one logit (volcano-related against tectonic) to see the sigmoid. Pure
     illustration, no Llaima data. Shared ml_seis style (src/ml_seis/styles/README.md), Okabe-Ito tokens,
     DejaVu Sans 13 px. Fonts are embedded by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x440">
<title>Logits, probabilities and loss</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px;
    transform-origin: 0 0; }
  svg { display: block; user-select: none; touch-action: none; position: absolute; left: 0; top: 44px; }
  svg text { fill: var(--ink); font-size: 12px; }
  svg .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; }
  svg .dim { fill: var(--ink2); }
  svg .num { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 12px;
    font-variant-numeric: tabular-nums; }
  .m, svg .m { font-family: "Latin Modern Roman", "Times New Roman", serif; font-style: italic;
    font-size: 1.2em; }
  math { font-family: "Latin Modern Math", "Cambria Math", math; math-style: normal;
    font-size: 20px; white-space: nowrap; }

  #ctl { position: absolute; left: 20px; top: 12px; display: flex; align-items: center;
    gap: 26px; color: var(--ink2); font-size: 12px; }
  #ctl .grp { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; }
  .seg { display: inline-flex; }
  .seg button { font: 12px "DejaVu Sans", sans-serif; color: var(--ink); background: transparent;
    border: 1px solid var(--ink2); padding: 3px 10px; margin-left: -1px; cursor: pointer; }
  .seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button:hover { border-color: var(--ink); z-index: 1; position: relative; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }

  #panel { position: absolute; left: 20px; top: 338px; width: 1060px; height: 84px;
    display: grid; grid-template-columns: 1.1fr 1fr; gap: 18px; }
  .bx { position: relative; border: 1px solid var(--ink2); border-radius: 4px;
    padding: 16px 16px 6px; box-sizing: border-box; }
  .bx .bcap { position: absolute; top: 0; left: 10px; transform: translateY(-50%); padding: 0 6px;
    background: var(--bg); font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; color: var(--ink); }
  #eq { display: flex; align-items: center; justify-content: center; gap: 36px; height: 100%; }
  #ce { display: flex; align-items: center; justify-content: center; height: 100%; }
  #ce math { font-size: 22px; }
  #ce .vp { color: var(--c1); }
  #ce .vs { color: var(--c2); }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>
</head>
<body>
<div id="stage">
<div id="ctl">
  <span class="grp">outputs <span class="seg" id="seg-mode"></span></span>
  <span class="grp">label <span class="seg" id="seg-label"></span></span>
  <span>drag the bars of the logits</span>
</div>

<svg id="fig" width="1100" height="290" viewBox="0 0 1100 290" role="img"
     aria-label="Logits, probabilities and the loss of one record"></svg>

<div id="panel">
  <div class="bx"><span class="bcap" id="cap-eq">Softmax</span><div id="eq"></div></div>
  <div class="bx"><span class="bcap">Cross-entropy</span><div id="ce"></div></div>
</div>
</div>

<script>
  const $ = id => document.getElementById(id);
  const NS = "http://www.w3.org/2000/svg";
  const NAMES = { 4: ["LP", "TR", "VT", "TC"], 1: ["volcano", "tectonic"] };
  let mode = 4, label = 0;
  let a = { 4: [1.5, 0.5, -0.5, 0.0], 1: [0.8] };

  // plot frames (logical px inside the svg)
  const A = { x: 70, w: 290, y0: 46, y1: 226, lim: 4 };      // logits, zero line in the middle
  const Bp = { x: 450, w: 250, y0: 46, y1: 226 };            // probabilities 0 .. 1
  const C = { x: 800, w: 260, y0: 46, y1: 226, ymax: 4.6 };  // loss against p

  const softmax = v => { const m = Math.max(...v), e = v.map(x => Math.exp(x - m)),
    s = e.reduce((p, q) => p + q, 0); return e.map(x => x / s); };
  const probs = () => mode === 4 ? softmax(a[4]) : [1 / (1 + Math.exp(-a[1][0])), 1 - 1 / (1 + Math.exp(-a[1][0]))];
  const zeroY = () => (A.y0 + A.y1) / 2;
  const yA = v => zeroY() - v * (A.y1 - A.y0) / (2 * A.lim);
  const yB = p => Bp.y1 - p * (Bp.y1 - Bp.y0);
  const xC = p => C.x + p * C.w;
  const yC = l => C.y1 - Math.min(l, C.ymax) / C.ymax * (C.y1 - C.y0);

  function el(tag, attrs, parent, text) {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    (parent || $("fig")).appendChild(e);
    return e;
  }

  function axes(x, y0, y1, w, ticks, yOf, zeroAxis) {
    el("line", { x1: x, x2: x, y1: y0, y2: y1, stroke: "var(--ink2)" });
    el("line", { x1: x, x2: x + w, y1: zeroAxis ? yOf(0) : y1, y2: zeroAxis ? yOf(0) : y1, stroke: "var(--ink2)" });
    for (const [v, t] of ticks) {
      el("line", { x1: x, x2: x + 4, y1: yOf(v), y2: yOf(v), stroke: "var(--ink2)" });
      el("text", { class: "dim num", x: x - 7, y: yOf(v) + 4, "text-anchor": "end" }, null, t);
    }
  }

  function draw() {
    const svg = $("fig");
    svg.textContent = "";
    const n = a[mode].length, names = NAMES[mode], p = probs(), nP = p.length;
    const pTrue = p[label], loss = -Math.log(Math.max(pTrue, 1e-12));
    // the numbers of the formula and of the marker come from the rounded probability
    const pShown = pTrue.toPrecision(2), lossShown = -Math.log(Number(pShown));

    // logits
    el("text", { class: "cap", x: A.x, y: 22 }, null, "Logits");
    axes(A.x, A.y0, A.y1, A.w, [-4, -2, 0, 2, 4].map(v => [v, v]), yA, true);
    const slotA = A.w / n;
    for (let k = 0; k < n; k++) {
      const cx = A.x + slotA * (k + 0.5), bw = Math.min(46, slotA * 0.6), v = a[mode][k];
      const top = Math.min(yA(v), yA(0)), h = Math.abs(yA(v) - yA(0));
      el("rect", { x: cx - bw / 2, y: top, width: bw, height: Math.max(h, 1), fill: "var(--c2)", "fill-opacity": 0.85 });
      el("text", { class: "num", x: cx, y: v >= 0 ? top - 5 : top + h + 14, "text-anchor": "middle" }, null, v.toFixed(1));
      el("text", { x: cx, y: A.y1 + 22, "text-anchor": "middle", "font-weight": k === label && mode === 4 ? 700 : 400 }, null, names[k]);
      const hit = el("rect", { x: cx - slotA / 2, y: A.y0 - 6, width: slotA, height: A.y1 - A.y0 + 12, fill: "transparent", style: "cursor:ns-resize" });
      hit.dataset.k = k;
    }

    // probabilities
    el("text", { class: "cap", x: Bp.x, y: 22 }, null, "Probabilities");
    axes(Bp.x, Bp.y0, Bp.y1, Bp.w, [[0, "0"], [0.5, "0.5"], [1, "1"]], yB, false);
    const slotB = Bp.w / nP;
    for (let k = 0; k < nP; k++) {
      const cx = Bp.x + slotB * (k + 0.5), bw = Math.min(46, slotB * 0.6);
      el("rect", { x: cx - bw / 2, y: yB(p[k]), width: bw, height: Math.max(Bp.y1 - yB(p[k]), 1),
        fill: "var(--c1)", "fill-opacity": k === label ? 0.95 : 0.3 });
      el("text", { class: "num", x: cx, y: yB(p[k]) - 5, "text-anchor": "middle" }, null, p[k].toFixed(2));
      el("text", { x: cx, y: Bp.y1 + 22, "text-anchor": "middle", "font-weight": k === label ? 700 : 400 }, null, names[k]);
    }
    el("text", { class: "dim", x: Bp.x + Bp.w / 2, y: Bp.y1 + 40, "text-anchor": "middle" }, null, "bold: the label");

    // loss against p
    el("text", { class: "cap", x: C.x, y: 22 }, null, "Loss of this record");
    axes(C.x, C.y0, C.y1, C.w, [[0, "0"], [2, "2"], [4, "4"]], l => yC(l), false);
    for (const t of [0, 0.5, 1]) {
      el("line", { x1: xC(t), x2: xC(t), y1: C.y1, y2: C.y1 - 4, stroke: "var(--ink2)" });
      el("text", { class: "dim num", x: xC(t), y: C.y1 + 16, "text-anchor": "middle" }, null, t === 0 ? "0" : t);
    }
    el("text", { x: C.x + C.w / 2, y: C.y1 + 34, "text-anchor": "middle" }, null, "probability of the labelled class");
    let d = "";
    for (let i = 0; i <= 200; i++) { const q = 0.01 + i * 0.99 / 200; d += (i ? "L" : "M") + xC(q).toFixed(1) + " " + yC(-Math.log(q)).toFixed(1); }
    el("path", { d, fill: "none", stroke: "var(--ink)", "stroke-width": 1.4 });
    el("circle", { cx: xC(pTrue), cy: yC(loss), r: 5.5, fill: "var(--c2)" });
    el("text", { class: "num", x: xC(pTrue) + (pTrue > 0.6 ? -10 : 10), y: yC(loss) - 8, "text-anchor": pTrue > 0.6 ? "end" : "start", fill: "var(--c2)" }, null, lossShown.toFixed(2));

    // maths: the logits to probabilities, and the loss of this record with its numbers
    $("cap-eq").textContent = mode === 4 ? "Softmax" : "Sigmoid";
    $("eq").innerHTML = mode === 4
      ? `<math><msub><mi>p</mi><mi>c</mi></msub><mo>=</mo><mfrac><msup><mi>e</mi><msub><mi>a</mi><mi>c</mi></msub></msup><mrow><munder><mo>∑</mo><mi>j</mi></munder><msup><mi>e</mi><msub><mi>a</mi><mi>j</mi></msub></msup></mrow></mfrac></math>`
      : `<math><mi>p</mi><mo>=</mo><mfrac><mn>1</mn><mrow><mn>1</mn><mo>+</mo><msup><mi>e</mi><mrow><mo>−</mo><mi>a</mi></mrow></msup></mrow></mfrac></math>`;
    $("ce").innerHTML = `<math><mi>S</mi><mo>=</mo><mo>−</mo><mi>log</mi><mspace width="0.2em"/><msub><mi>p</mi><mtext>${names[label]}</mtext></msub><mo>=</mo><mo>−</mo><mi>log</mi><mspace width="0.3em"/><mn class="vp">${pShown}</mn><mo>=</mo><mn class="vs">${lossShown.toFixed(2)}</mn></math>`;
  }

  function segment(id, items, current, on) {
    const box = $(id);
    box.textContent = "";
    items.forEach((t, i) => {
      const b = document.createElement("button");
      b.textContent = t;
      if (i === current) b.className = "on";
      b.onclick = () => on(i);
      box.appendChild(b);
    });
  }
  const controls = () => {
    segment("seg-mode", ["4 logits", "1 logit"], mode === 4 ? 0 : 1, i => { mode = i === 0 ? 4 : 1; label = 0; controls(); draw(); });
    segment("seg-label", NAMES[mode], label, i => { label = i; controls(); draw(); });
  };

  // drag a bar: the value follows the pointer, clipped to the axis
  let drag = null;
  const valueAt = ev => {
    const svg = $("fig"), pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return Math.max(-A.lim, Math.min(A.lim, (zeroY() - pt.y) * 2 * A.lim / (A.y1 - A.y0)));
  };
  $("fig").addEventListener("pointerdown", ev => {
    const k = ev.target.dataset && ev.target.dataset.k;
    if (k === undefined) return;
    drag = +k; $("fig").setPointerCapture(ev.pointerId);
    a[mode][drag] = Math.round(valueAt(ev) * 10) / 10; draw();
  });
  $("fig").addEventListener("pointermove", ev => {
    if (drag === null) return;
    a[mode][drag] = Math.round(valueAt(ev) * 10) / 10; draw();
  });
  const stop = () => { drag = null; };
  $("fig").addEventListener("pointerup", stop);
  $("fig").addEventListener("pointercancel", stop);

  controls();
  draw();
</script>
</body>
</html>
