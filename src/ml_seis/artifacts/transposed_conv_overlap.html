<!doctype html>
<!-- Artifact: a transposed convolution (nn.ConvTranspose1d), the mirror of strided_conv.html. A
     made-up latent vector of 8 units and a filter of K weights (3, 4 or 7). Every input unit writes
     a copy of the filter, scaled by its value, into the output; each copy starts s samples (1, 2
     or 4) after the one before, so with K > s neighbouring copies overlap and their values add,
     with K < s gaps stay at zero. The output has s(8 - 1) + K samples. PhaseNet: K = 7, s = 4
     (it then cuts the first 1 and last 2). Hover a unit (or press left and right).
     window.ARTIFACT {kernel, stride} (defaults 4 and 4) sets the first setting. Numbers are made
     up. Shared ml_seis style (src/ml_seis/styles/README.md, STYLE.md). Fonts are embedded by
     scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>
</head>
<body>
<div id="stage">
<svg id="fig" width="810" height="440" viewBox="0 0 810 440" role="img" tabindex="0"
     aria-label="A transposed convolution: every input unit writes a scaled copy of the filter, copies that overlap add"></svg>
<div id="side">
  <div class="cap">Transposed convolution</div>
  <div class="row"><span>kernel <span class="m">K</span></span><span class="seg" id="seg-k"></span></div>
  <div class="row"><span>stride <span class="m">s</span></span><span class="seg" id="seg-s"></span></div>
  <svg id="filt" width="250" height="56" viewBox="0 0 250 56"></svg>
  <p class="read" id="r1"></p>
  <p class="read" id="r2"></p>
</div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const P = window.ARTIFACT || {};
  const PITCH = 20, X0 = 70;                                 // column pitch, left edge
  const KERNELS = { 3: [0.25, 0.5, 0.25], 4: [0.2, 0.4, 0.3, 0.1], 7: [-0.05, 0.1, 0.25, 0.4, 0.25, 0.1, -0.05] };   // made-up filters
  const STRIDES = [1, 2, 4];
  const LATENT = [0.3, 0.9, 0.55, -0.2, 0.7, 0.15, -0.45, 0.35];   // a made-up latent vector
  const L = LATENT.length;
  const state = { i: 3, K: KERNELS[P.kernel] ? P.kernel : 4, S: STRIDES.includes(P.stride) ? P.stride : 4 };
  const svg = $("fig");
  const xc = t => X0 + (t + 0.5) * PITCH;                   // the centre of sample column t
  const IN = { cap: 24, z: 90, h: 44 }, OUT = { cap: 196, z: 300, h: 140 };

  function axes(p, top, bottom, tick, r) {
    const l = X0 - 8;
    el(svg, "path", { d: `M${l},${top}V${bottom}`, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
    el(svg, "path", { d: `M${l},${p.z}H${r}`, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
    el(svg, "text", { x: l - 6, y: p.z + 4, class: "dim end" }, "0");
    el(svg, "text", { x: l - 6, y: p.z - tick * p.h + 4, class: "dim end" }, String(tick));
    el(svg, "path", { d: `M${l},${p.z - tick * p.h}h4`, stroke: "var(--ink2)", "stroke-width": 1 });
  }
  function bar(p, x, w, v, attrs) {
    el(svg, "rect", { x, y: v >= 0 ? p.z - v * p.h : p.z, width: w, height: Math.max(Math.abs(v) * p.h, 1), ...attrs });
  }
  function hit(x, y, w, h, fn) {
    const r = el(svg, "rect", { x, y, width: w, height: h, fill: "transparent", style: "cursor:pointer" });
    r.addEventListener("pointerenter", fn);
    r.addEventListener("pointerdown", fn);
  }

  function draw() {
    svg.replaceChildren();
    const { K, S } = state, W = KERNELS[K];
    const M = (L - 1) * S + K;                              // output samples
    const out = Array.from({ length: M }, (_, t) =>
      LATENT.reduce((a, c, i) => (t - S * i >= 0 && t - S * i < K ? a + c * W[t - S * i] : a), 0));
    const i = state.i, s0 = S * i;                          // the chosen unit writes samples s0 .. s0 + K - 1
    const R = X0 + 35 * PITCH + 4;                         // the longest output, for every setting

    el(svg, "text", { x: X0, y: IN.cap, class: "cap" }, "INPUT");
    el(svg, "text", { x: R, y: IN.cap, class: "dim end" }, `${L} units`);
    el(svg, "text", { x: X0, y: OUT.cap, class: "cap" }, "OUTPUT");
    el(svg, "text", { x: R, y: OUT.cap, class: "dim end" }, `${M} samples`);
    axes(IN, IN.cap + 8, IN.z + 34, 1, R);
    axes(OUT, OUT.cap + 10, OUT.z + 34, 0.4, R);

    // input units, each as wide as the S samples between two copies
    LATENT.forEach((v, k) => {
      const hot = k === i;
      bar(IN, xc(S * k) - PITCH / 2 + 3, S * PITCH - 6, v, { fill: hot ? "var(--c2)" : "none",
        stroke: hot ? "var(--c2)" : "var(--c1)", "stroke-width": 1, opacity: hot ? 0.9 : 0.7 });
    });
    // where the chosen copy overlaps its neighbours
    const ov = [];
    if (K > S && i > 0) ov.push([s0, s0 + K - S - 1]);
    if (K > S && i < L - 1) ov.push([s0 + S, s0 + K - 1]);
    ov.forEach(([a, b]) => el(svg, "rect", { x: xc(a) - PITCH / 2, y: OUT.cap + 14, width: (b - a + 1) * PITCH,
      height: OUT.z + 20 - OUT.cap - 14, fill: "var(--c2)", opacity: 0.1 }));
    // the sum, with the chosen copy on top
    out.forEach((v, t) => bar(OUT, xc(t) - PITCH / 2 + 3, PITCH - 6, v, { fill: "var(--c1)", opacity: 0.55 }));
    W.forEach((w, tau) => bar(OUT, xc(s0 + tau) - PITCH / 2 + 3, PITCH - 6, LATENT[i] * w, { fill: "var(--c2)", opacity: 0.9 }));
    // labels under the axis
    const xa = xc(s0) - PITCH / 2, xb = xc(s0 + K - 1) + PITCH / 2, yb = OUT.z + 26;
    el(svg, "path", { d: `M${xa},${yb - 4}V${yb}H${xb}V${yb - 4}`, fill: "none", stroke: "var(--c2)", "stroke-width": 1 });
    el(svg, "text", { x: (xa + xb) / 2, y: yb + 15, class: "mid", fill: "var(--c2)" }, `copy of unit ${i}`);
    if (ov.length) el(svg, "text", { x: (xa + xb) / 2, y: yb + 33, class: "dim mid" }, "shaded: copies overlap, values add");
    el(svg, "path", { d: `M${xc(S * i + (S - 1) / 2)},${IN.z + 36}V${OUT.cap + 16}`, fill: "none", stroke: "var(--c2)",
      "stroke-width": 1, "stroke-dasharray": "3 3" });
    for (let k = 0; k < L; k++) hit(xc(S * k) - PITCH / 2, IN.cap + 8, S * PITCH, 40 + IN.z - IN.cap, () => { if (state.i !== k) { state.i = k; draw(); } });

    $("r1").innerHTML = `unit <b>${i}</b> writes samples <b>${s0}</b> to <b>${s0 + K - 1}</b>`;
    $("r2").innerHTML = `${L} units become <b>${M}</b> samples`;
    drawFilter();
  }

  function drawFilter() {
    const f = $("filt"), K = state.K, W = KERNELS[K];
    f.replaceChildren();
    const x0 = 20, pitch = Math.min(30, 200 / K), base = 30, scale = 44;
    el(f, "path", { d: `M${x0 - 6},8V${base}H${x0 + K * pitch - 6}`, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
    W.forEach((w, t) => {
      const y = base - w * scale;
      el(f, "rect", { x: x0 + t * pitch, y: Math.min(y, base), width: pitch - 8, height: Math.max(Math.abs(base - y), 1),
        fill: "var(--c2)", opacity: 0.9 });
    });
    el(f, "text", { x: x0 - 6, y: 52 }, `filter, ${K} weights (learned)`);
  }
  function seg(id, items, get, set) {
    const root = $(id);
    items.forEach(v => {
      const b = document.createElement("button");
      b.textContent = v; b.dataset.v = v;
      b.onclick = () => { set(v); sync(); };
      root.appendChild(b);
    });
    return () => root.querySelectorAll("button").forEach(b => b.classList.toggle("on", b.dataset.v === String(get())));
  }
  const syncK = seg("seg-k", Object.keys(KERNELS).map(Number), () => state.K, v => { state.K = v; });
  const syncS = seg("seg-s", STRIDES, () => state.S, v => { state.S = v; });
  function sync() { syncK(); syncS(); draw(); }
  svg.addEventListener("keydown", e => {
    if (e.key === "ArrowRight") state.i = Math.min(state.i + 1, L - 1);
    else if (e.key === "ArrowLeft") state.i = Math.max(state.i - 1, 0);
    else return;
    e.preventDefault(); draw();
  });
  sync();
</script>
</body>
