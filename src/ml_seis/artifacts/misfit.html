<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<canvas id="heat" width="720" height="720"></canvas>
<svg id="map" width="540" height="440" viewBox="0 0 540 440" role="img"
     aria-label="Misfit S over the map with a draggable trial source">
  <!-- axes: 3.6 px per km, origin at px (80, 380) -->
  <g id="zr"></g>
  <g id="stations"></g>
  <g id="tru"></g>
  <g id="src"></g>
  <rect id="plot" x="80" y="20" width="360" height="360" fill="none" stroke="var(--ink2)" stroke-width="1"
        pointer-events="all"/>
  <g id="ticks" stroke="var(--ink2)"></g>
  <g id="ticklabels"></g>
  <g id="cbar"></g>
  <text class="axis" x="260" y="424" text-anchor="middle">East <tspan class="m">x</tspan> (km)</text>
  <text class="axis" transform="translate(26 200) rotate(-90)" text-anchor="middle">North <tspan class="m">y</tspan> (km)</text>
  <text class="axis" x="458" y="12"><tspan class="m">S</tspan> (s²)</text>
</svg>

<div id="side">
  <div class="cap">Residual and misfit</div>
  <div class="eq">
    <math><mi class="bv cR">r</mi><mo stretchy="false">(</mo><mi class="bv">m</mi><mo stretchy="false">)</mo>
      <mo>=</mo><mover class="cF"><mi class="bv">F</mi><mo>~</mo></mover><mo stretchy="false">(</mo><mi class="bv">m</mi><mo stretchy="false">)</mo>
      <mo>−</mo><msub class="cD"><mover><mi class="bv">d</mi><mo>~</mo></mover><mi mathvariant="normal">obs</mi></msub></math>
    <math><mi>S</mi><mo stretchy="false">(</mo><mi class="bv">m</mi><mo stretchy="false">)</mo><mo>=</mo><mfrac><mn>1</mn><mn>2</mn></mfrac>
      <munderover><mo>∑</mo><mrow><mi>i</mi><mo>=</mo><mn>1</mn></mrow><mi>N</mi></munderover><msubsup class="cR"><mi>r</mi><mi>i</mi><mn>2</mn></msubsup></math>
  </div>
  <div class="legend">
    <span><i style="background:var(--ink2)"></i><span class="m">d̃</span><sub class="m">i</sub> observed</span>
    <span><i style="background:var(--c3)"></i><span class="m">F̃</span><sub class="m">i</sub>(<span class="m">m</span>) model</span>
    <span><i style="background:var(--c2)"></i><span class="m">r</span><sub class="m">i</sub> = <span class="m">F̃</span><sub class="m">i</sub> − <span class="m">d̃</span><sub class="m">i</sub> residual</span>
  </div>
  <svg id="chart" width="520" height="200" viewBox="0 0 520 200"></svg>
  <div id="sum"></div>
  <div id="foot">
    <span class="sp"></span>
    <label><input type="checkbox" id="showzero"> zero-residual curves</label>
    <label><input type="checkbox" id="showtrue"> show the true source</label>
  </div>
</div>
</div>

<script>
  // Geometry and data shared with the notebook (km, s).
  const V = 6;
  const ST = [
    { i: 1, x: 10, y: 20, dy: 28 },
    { i: 2, x: 90, y: 30, dy: 28 },
    { i: 3, x: 40, y: 85, dy: -18 },
  ];
  let TRUE = { x: 55, y: 45 };
  const D0 = [1.4161, -1.0005, -0.4156];     // d~_obs: centred picks, torch.manual_seed(0)
  let m = { x: 68, y: 58 };

  const ns = "http://www.w3.org/2000/svg";
  const px = x => 80 + 3.6 * x, py = y => 380 - 3.6 * y;
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const $ = id => document.getElementById(id);
  const halo = { "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": 3, "stroke-linejoin": "round" };
  const centred = F => { const mu = F.reduce((a, b) => a + b) / F.length; return F.map(f => f - mu); };
  const Fc = (x, y) => centred(ST.map(s => Math.hypot(x - s.x, y - s.y) / V));
  // moving the true source keeps the noise realisation and regenerates the data: d~ = F~(true) + noise
  const NOISE = D0.map((d, i) => d - Fc(TRUE.x, TRUE.y)[i]);
  let D_C = D0.slice();
  const misfit = (x, y) => { const F = Fc(x, y); return 0.5 * F.reduce((a, f, i) => a + (f - D_C[i]) ** 2, 0); };

  // ---- map furniture: boxed look, inward ticks, minor every 10 km, major every 20 km
  for (let k = 0; k <= 100; k += 10) {
    const major = k % 20 === 0, len = major ? 6 : 3, w = major ? 0.8 : 0.4;
    const tk = (x1, y1, x2, y2) => el($("ticks"), "line", { x1, y1, x2, y2, "stroke-width": w });
    tk(px(k), py(0), px(k), py(0) - len);
    tk(px(k), py(100), px(k), py(100) + len);
    tk(px(0), py(k), px(0) + len, py(k));
    tk(px(100), py(k), px(100) - len, py(k));
    if (major) {
      el($("ticklabels"), "text", { x: px(k), y: py(0) + 18, "text-anchor": "middle" }, k);
      el($("ticklabels"), "text", { x: px(0) - 8, y: py(k) + 4, "text-anchor": "end" }, k);
    }
  }
  ST.forEach(s => {
    const cx = px(s.x), cy = py(s.y);
    el($("stations"), "polygon", { points: `${cx},${cy - 12} ${cx - 11},${cy + 8} ${cx + 11},${cy + 8}`,
      fill: "var(--c1)", stroke: "var(--edge)", "stroke-width": 0.8, "stroke-linejoin": "round" });
    const t = el($("stations"), "text", Object.assign({ class: "lab", x: cx, y: cy + s.dy, "text-anchor": "middle" }, halo));
    el(t, "tspan", { class: "m" }, "ξ");
    el(t, "tspan", { class: "m", dy: 3, "font-size": 10 }, s.i);
  });
  const star = (r1, r2) => {
    const p = [];
    for (let k = 0; k < 10; k++) {
      const rad = k % 2 ? r2 : r1, a = -Math.PI / 2 + k * Math.PI / 5;
      p.push(`${rad * Math.cos(a)},${rad * Math.sin(a)}`);
    }
    return p.join(" ");
  };
  el($("src"), "polygon", { points: star(16, 6.4), fill: "var(--c2)", stroke: "var(--edge)",
    "stroke-width": 0.8, "stroke-linejoin": "round" });
  const sl = el($("src"), "text", Object.assign({ class: "note", x: 20, y: -12 }, halo), "trial ");
  el(sl, "tspan", { class: "m", "font-weight": "700" }, "m");
  el($("tru"), "polygon", { points: star(16, 6.4), fill: "none", stroke: "var(--ink)",
    "stroke-width": 1.4, "stroke-linejoin": "round", "stroke-dasharray": "3 2" });
  el($("tru"), "text", Object.assign({ class: "note", x: 20, y: 22 }, halo), "true");
  $("tru").setAttribute("transform", `translate(${px(TRUE.x)} ${py(TRUE.y)})`);
  $("tru").style.display = "none";

  // ---- S(m) as log-banded colour: strong blue at small S, fading towards the background
  const LO = -3, HI = 1.8, NB = 12, STEP = (HI - LO) / NB;
  const band = S => Math.max(0, Math.min(NB - 1, Math.floor((Math.log10(Math.max(S, 1e-9)) - LO) / STEP)));
  const N = 720, bands = new Uint8Array(N * N);
  function bandMap() {
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++)
      bands[j * N + i] = band(misfit((i + 0.5) / N * 100, (1 - (j + 0.5) / N) * 100));
  }
  bandMap();
  const hex = v => { v = v.trim().replace("#", ""); return [0, 2, 4].map(k => parseInt(v.slice(k, k + 2), 16)); };
  const css = n => hex(getComputedStyle(document.documentElement).getPropertyValue(n));
  const shade = (b, c1, bg) => { const t = 0.9 * Math.pow(b / (NB - 1), 1.7);
    return c1.map((c, k) => Math.round(c * (1 - t) + bg[k] * t)); };
  const CB = { x: 458, y0: 20, w: 12, h: 360 };
  const cbY = S => CB.y0 + CB.h * (1 - (Math.log10(Math.max(S, 1e-9)) - LO) / (HI - LO));

  function paint() {
    const c1 = css("--c1"), bg = css("--bg");
    const cols = Array.from({ length: NB }, (_, b) => shade(b, c1, bg));
    const ctx = $("heat").getContext("2d"), img = ctx.createImageData(N, N);
    for (let p = 0; p < N * N; p++) {
      const c = cols[bands[p]]; img.data[4 * p] = c[0]; img.data[4 * p + 1] = c[1];
      img.data[4 * p + 2] = c[2]; img.data[4 * p + 3] = 255;
    }
    ctx.putImageData(img, 0, 0);
    // colour bar: bands from large S (top) to small S (bottom), ticks at decades
    const g = $("cbar"); g.innerHTML = "";
    const h = CB.h / NB;
    for (let b = 0; b < NB; b++)
      el(g, "rect", { x: CB.x, y: CB.y0 + (NB - 1 - b) * h + 0.2, width: CB.w, height: h - 0.1,
        fill: `rgb(${cols[b].join(",")})` });
    el(g, "rect", { x: CB.x, y: CB.y0, width: CB.w, height: CB.h, fill: "none", stroke: "var(--ink2)" });
    for (let e = LO + 1; e <= 1; e++) {
      const y = cbY(Math.pow(10, e));
      el(g, "line", { x1: CB.x, x2: CB.x + 5, y1: y, y2: y, stroke: "var(--ink2)" });
      const t = el(g, "text", { x: CB.x + 18, y: y + 4 }, "10");
      el(t, "tspan", { dy: -5, "font-size": 9 }, e === 0 ? "0" : String(e).replace("-", "−"));
    }
    el(g, "polygon", { id: "cbmark", points: "-9,-5 0,0 -9,5", fill: "var(--c2)", stroke: "var(--edge)",
      "stroke-width": 0.6, "stroke-linejoin": "round" });
    drawZero(); update();
  }
  matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => setTimeout(paint, 0));

  // ---- zero-residual curves r_i(m) = 0, one per station (marching squares on a 1 km grid)
  const DASH = ["", "6 3", "2 3"];
  function drawZero() {
    const g = $("zr"); g.innerHTML = "";
    if (!$("showzero").checked) return;
    const n = 100, f = Array.from({ length: n + 1 }, (_, j) =>
      Array.from({ length: n + 1 }, (_, i) => Fc(i, j)));
    ST.forEach((s, k) => {
      const v = (i, j) => f[j][i][k] - D_C[k], segs = [];
      const cross = (i1, j1, i2, j2) => {
        const a = v(i1, j1), b = v(i2, j2), t = a / (a - b);
        return [px(i1 + t * (i2 - i1)), py(j1 + t * (j2 - j1))];
      };
      for (let j = 0; j < n; j++) for (let i = 0; i < n; i++) {
        const e = [];
        if ((v(i, j) < 0) !== (v(i + 1, j) < 0)) e.push(cross(i, j, i + 1, j));
        if ((v(i + 1, j) < 0) !== (v(i + 1, j + 1) < 0)) e.push(cross(i + 1, j, i + 1, j + 1));
        if ((v(i, j + 1) < 0) !== (v(i + 1, j + 1) < 0)) e.push(cross(i, j + 1, i + 1, j + 1));
        if ((v(i, j) < 0) !== (v(i, j + 1) < 0)) e.push(cross(i, j, i, j + 1));
        for (let q = 0; q + 1 < e.length; q += 2) segs.push([e[q], e[q + 1]]);
      }
      el(g, "path", { d: segs.map(([a, b]) => `M${a[0].toFixed(1)} ${a[1].toFixed(1)}L${b[0].toFixed(1)} ${b[1].toFixed(1)}`).join(""),
        fill: "none", stroke: "var(--c2)", "stroke-width": 1.6, "stroke-dasharray": DASH[k], "stroke-linecap": "round" });
      if (segs.length) {
        const [a, b] = segs[Math.floor(segs.length / 2)];
        const t = el(g, "text", Object.assign({ x: (a[0] + b[0]) / 2 + 6, y: (a[1] + b[1]) / 2 - 6 }, halo));
        t.style.fill = "var(--c2)";
        t.innerHTML = `<tspan class="m">r</tspan><tspan class="m" dy="3" font-size="9">${s.i}</tspan><tspan dy="-3"> = 0</tspan>`;
      }
    });
  }
  $("showzero").addEventListener("change", drawZero);

  // ---- right panel: centred data vs model, residuals, sum of squares
  const sg = x => (Math.abs(x) < 0.05 ? "" : x < 0 ? "−" : "+") + Math.abs(x).toFixed(1);
  const fS = x => x.toFixed(x < 1 ? 2 : 1);               // one decimal, two when S is below 1
  const CH = { x0: 58, zero: 96, k: 19 };      // 19 px per s, +-4 s visible
  function chart(F) {
    const c = $("chart"); c.innerHTML = "";
    const yv = v => CH.zero - CH.k * v, bw = 34;
    el(c, "defs").innerHTML = `<clipPath id="cc"><rect x="${CH.x0}" y="${yv(4)}" width="470" height="${CH.k * 8}"/></clipPath>`;
    // spines: the y axis on the left and the x axis through zero
    el(c, "line", { x1: CH.x0, x2: CH.x0, y1: yv(4), y2: yv(-4), stroke: "var(--ink2)" });
    el(c, "line", { x1: CH.x0, x2: 520, y1: yv(0), y2: yv(0), stroke: "var(--ink2)" });
    for (const v of [-3, 0, 3]) {
      el(c, "line", { x1: CH.x0 - 4, x2: CH.x0, y1: yv(v), y2: yv(v), stroke: "var(--ink2)" });
      el(c, "text", { x: CH.x0 - 8, y: yv(v) + 4, "text-anchor": "end" }, v < 0 ? "−" + -v : v);
    }
    el(c, "text", { x: 12, y: yv(0) + 4 }, "s");
    const g = el(c, "g", { "clip-path": "url(#cc)" });
    ST.forEach((s, i) => {
      const cx = CH.x0 + 66 + i * 138, r = F[i] - D_C[i];
      const bar = (x, v, col) => {
        el(g, "rect", { x, y: Math.min(yv(0), yv(v)), width: bw, height: Math.max(1, Math.abs(CH.k * v)), fill: col });
        el(c, "text", { x: x + bw / 2, y: v >= 0 ? yv(v) - 4 : yv(v) + 12, "text-anchor": "middle",
          "font-size": 10.5, fill: "var(--ink2)" }, sg(v)).style.fill = "var(--ink2)";
      };
      bar(cx - bw - 2, D_C[i], "var(--ink2)");
      bar(cx + 2, F[i], "var(--c3)");
      // residual bracket from d~ to F~, right of the pair
      const xr = cx + bw + 16;
      el(g, "line", { x1: xr, x2: xr, y1: yv(D_C[i]), y2: yv(F[i]), stroke: "var(--c2)", "stroke-width": 2.4 });
      for (const v of [D_C[i], F[i]]) el(g, "line", { x1: xr - 4, x2: xr + 4, y1: yv(v), y2: yv(v),
        stroke: "var(--c2)", "stroke-width": 1.6 });
      const t = el(c, "text", { x: xr + 9, y: yv((D_C[i] + F[i]) / 2) + 4, "font-size": 12 });
      t.style.fill = "var(--c2)";
      t.innerHTML = `<tspan class="m">r</tspan><tspan class="m" dy="3" font-size="9">${s.i}</tspan><tspan dy="-3"> ${sg(r)}</tspan>`;
      el(c, "text", { class: "lab", x: cx, y: 192, "text-anchor": "middle" }, s.i);
    });
    el(c, "text", { x: 12, y: 192 }, "station");
  }

  function update() {
    $("src").setAttribute("transform", `translate(${px(m.x)} ${py(m.y)})`);
    const F = Fc(m.x, m.y), r = F.map((f, i) => f - D_C[i]);
    chart(F);
    const S = 0.5 * r.reduce((a, b) => a + b * b, 0);
    const mk = $("cbmark");
    if (mk) mk.setAttribute("transform", `translate(${CB.x - 1} ${Math.max(CB.y0, Math.min(CB.y0 + CB.h, cbY(S)))})`);
    $("sum").innerHTML =
      `<span class="m" style="font-size:18px">S</span><span class="p">=</span><span class="p">½ (</span>` +
      r.map(v => `<span class="t">${fS(v * v)}</span>`).join('<span class="p">+</span>') +
      `<span class="p">) =</span><span class="big">${fS(S)}</span><span class="u">s²</span>`;
  }

  // ---- drag or click anywhere on the map to move the trial source
  const svg = $("map");
  // with the true source shown, it can be dragged too: the picks (and so the misfit map) follow it
  const showTrue = () => $("showtrue").checked;
  const toKm = ev => {
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    return { x: Math.min(100, Math.max(0, (p.x - 80) / 3.6)), y: Math.min(100, Math.max(0, (380 - p.y) / 3.6)) };
  };
  const nearTrue = ev => {
    const q = toKm(ev), s = svg.getScreenCTM().a;
    return showTrue() && Math.hypot(q.x - TRUE.x, q.y - TRUE.y) * 3.6 < 16 &&
      Math.hypot(q.x - TRUE.x, q.y - TRUE.y) <= Math.hypot(q.x - m.x, q.y - m.y);
  };
  let drag = null, queued = false;
  function setTrue(q) {
    TRUE = q;
    const F = Fc(TRUE.x, TRUE.y);
    D_C = F.map((f, i) => f + NOISE[i]);
    $("tru").setAttribute("transform", `translate(${px(TRUE.x)} ${py(TRUE.y)})`);
    if (!queued) { queued = true; requestAnimationFrame(() => { queued = false; bandMap(); paint(); }); }
  }
  function move(ev) {
    const q = toKm(ev);
    if (drag === "true") setTrue(q); else { m = q; update(); }
  }
  $("plot").addEventListener("pointerdown", ev => {
    drag = nearTrue(ev) ? "true" : "trial";
    $("plot").setPointerCapture(ev.pointerId); move(ev);
    const up = () => { drag = null; $("plot").removeEventListener("pointermove", move); $("plot").removeEventListener("pointerup", up); };
    $("plot").addEventListener("pointermove", move); $("plot").addEventListener("pointerup", up);
  });
  $("plot").addEventListener("pointermove", ev => {
    if (!drag) $("plot").style.cursor = nearTrue(ev) ? "grab" : "crosshair";
  });
  $("showtrue").addEventListener("change", e => { $("tru").style.display = e.target.checked ? "" : "none"; });

  paint();
</script>
</body>
</html>
