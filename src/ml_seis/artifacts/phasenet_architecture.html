<!doctype html>
<!-- Artifact: PhaseNet (Zhu and Beroza 2019, as in SeisBench), drawn like the U-Net figures of the
     literature (Ronneberger et al. 2015). One slab is one feature map: its height is the number of
     samples (log scale), the number above it the number of channels, the number of samples is
     written at the left (encoder) and the right (decoder) of its row. The encoder goes down the left
     side (a conv block, then a stride-4 convolution that makes the record 4 times shorter), the code
     is at the bottom (128 channels, 12 steps), the decoder goes up the right side (a transposed
     convolution that makes it 4 times longer, the copy of the encoder output of the same length
     laid next to it, a conv block), and a 1x1 convolution gives P, S and neither at every sample.
     Skip connections are the horizontal arrows; the switch removes them (the slabs lose their
     copied half, the merge blocks need half the weights). Hover a slab or an arrow (or press left
     and right): the step turns vermillion and the box above says what it does, its PyTorch line and
     its weights. The count of weights is computed here from the shapes and compared with
     window.ARTIFACT {params, params_no_skips} of the model in the notebook (the check).
     window.ARTIFACT.stage builds the figure up for the slides: 1 the encoder (left half) with the
     target as an empty ghost, 2 plus the decoder (right half, no skips), 3 everything (default). The record and the
     curves are made up. Shared ml_seis style (src/ml_seis/styles/README.md, STYLE.md): Okabe-Ito tokens,
     DejaVu Sans 13 px. Fonts are embedded by scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="860" height="560" viewBox="0 0 860 560" role="img" tabindex="0"
     aria-label="PhaseNet drawn as a U: encoder, code, decoder, skip connections, one answer per sample"></svg>

<div id="explain">
  <div class="titlerow"><span class="cap" id="e-title"></span><span class="hint">hover a slab or an arrow</span></div>
  <div id="e-text"></div>
  <div class="code" id="e-code" hidden></div>
  <div class="code" id="e-params"></div>
</div>

<div id="side">
  <div class="cap skiprow">Skip connections</div>
  <div class="row skiprow"><span>copy and concatenate</span><span class="seg" id="seg-skips"></span></div>
  <div class="cap">Arrows</div>
  <div id="legend"></div>
  <div class="cap" style="margin-top:22px">Learned weights</div>
  <div id="total"></div>
  <div id="check"></div>
</div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const fmt = n => n.toLocaleString("en-US");
  const P = window.ARTIFACT || {};
  const LENGTH = P.length || 3072, RATE = P.rate || 100, STRIDE = 4, KERNEL = 7;
  const CH = [8, 16, 32, 64, 128];                       // channels of level 0 to 4
  const LEV = k => Math.round(LENGTH / STRIDE ** k);     // samples of level k
  const STAGE = [1, 2, 3].includes(P.stage) ? P.stage : 3;   // 1: encoder, 2: plus decoder, 3: plus skips
  const FIRST = { 1: "down0", 2: "up3", 3: "skip3" }[STAGE];  // the arrow that is new at this stage
  const state = { skips: STAGE < 3 ? false : (P.skips === undefined ? true : P.skips), sel: FIRST };
  const X0 = 84, PITCH = 36, TOP = 196, DY = 80;        // column 0, column pitch, row of level 0, row pitch
  const cx = col => X0 + PITCH * col;
  const cy = k => TOP + DY * k;
  const slabH = L => 12 + 56 * Math.log(L / 12) / Math.log(256);
  const slabW = ch => 5 + 0.14 * ch;
  const svg = $("fig");

  // ---- the network, step by step -------------------------------------------------------------
  const convW = (cin, cout, bias = false) => cin * cout * KERNEL + (bias ? cout : 0) + 2 * cout;   // weights (+ bias) and BatchNorm scale, shift
  const upW = (cin, cout) => cin * cout * KERNEL + 2 * cout;
  const secs = L => (L / RATE).toFixed(2).replace(/\.?0+$/, "");

  function build() {
    const skips = state.skips;
    const slabs = {}, ops = {};
    const slab = (id, col, level, ch, extra = {}) => (slabs[id] = { id, col, level, ch, L: LEV(level), ...extra });
    const op = (o) => (ops[o.id] = o);
    slab("in", 0, 0, 3, { io: "in" });
    slab("inc", 1, 0, CH[0]);
    slab("enc0", 2, 0, CH[0]);
    for (let k = 0; k < 4; k++) {
      slab(`down${k}`, 2 * k + 3, k + 1, CH[k]);
      slab(`enc${k + 1}`, 2 * k + 4, k + 1, CH[k + 1]);
    }
    for (let k = 3; k >= 0; k--) {
      slab(`cat${k}`, 18 - 2 * k, k, skips ? 2 * CH[k] : CH[k], { cat: skips ? CH[k] : 0 });
      slab(`dec${k}`, 19 - 2 * k, k, CH[k]);
    }
    slab("out", 20, 0, 3, { io: "out" });

    op({ id: "inc", kind: "conv", from: "in", to: "inc", title: "input convolution",
      text: `A first conv block turns the 3 components into 8 channels at every one of the ${LENGTH} samples.`,
      code: `inc = conv_block(3, 8, 7)`, w: convW(3, 8, true) });
    op({ id: "enc0", kind: "conv", from: "inc", to: "enc0", title: "conv block, level 0",
      text: `Convolution (kernel 7 samples), BatchNorm and ReLU, as in Parts 2a and 2b.${STAGE > 2 ? " The result is kept for the skip connection." : ""}`,
      code: `enc0 = conv_block(8, 8, 7)`, w: convW(8, 8) });
    for (let k = 0; k < 4; k++) {
      const c = CH[k], c2 = CH[k + 1];
      op({ id: `down${k}`, kind: "down", from: `enc${k}`, to: `down${k}`, title: `stride-4 convolution ${k + 1} of 4`,
        text: `A convolution that moves 4 samples at a time: ${LEV(k)} samples become ${LEV(k + 1)}. One unit now stands for ${4 ** (k + 1)} samples (${secs(4 ** (k + 1))} s). The weights of the filter are learned.`,
        code: `down${k} = conv_block(${c}, ${c}, 7, stride=4)`, w: convW(c, c) });
      op({ id: `enc${k + 1}`, kind: "conv", from: `down${k}`, to: `enc${k + 1}`, title: k === 3 ? "conv block: the code" : `conv block, level ${k + 1}`,
        text: k === 3 ? `The bottom of the U: ${c2} channels at ${LEV(4)} steps of ${secs(4 ** 4)} s, ${fmt(c2 * LEV(4))} numbers. The whole window is squeezed into these numbers.`
          : `The number of channels doubles.${STAGE > 2 ? " The result is kept for the skip connection." : ""}`,
        code: `enc${k + 1} = conv_block(${c}, ${c2}, 7)`, w: convW(c, c2) });
    }
    for (let k = 3; k >= 0; k--) {
      const w = CH[k], below = CH[k + 1], src = k === 3 ? "enc4" : `dec${k + 1}`;
      op({ id: `up${k}`, kind: "up", from: src, to: `cat${k}`, title: `transposed convolution ${4 - k} of 4`,
        text: `The mirror of a stride: each unit writes a copy of the filter 4 samples apart, so ${LEV(k + 1)} samples become ${LEV(k)}. The output has 3 extra samples; the code cuts the first 1 and the last 2.${skips ? ` The ${w} channels are put next to the ${w} copied from level ${k}: ${2 * w}.` : ""}`,
        code: `x = up${k}(x)[:, :, 1:-2]` + (skips ? `;  x = torch.cat([skip${k}, x], dim=1)` : ""), w: upW(below, w) });
      if (skips) op({ id: `skip${k}`, kind: "skip", from: `enc${k}`, to: `cat${k}`, title: `skip connection ${4 - k}`,
        text: `The output of conv block ${k} (${LEV(k)} samples, ${w} channels) is copied across the U and laid next to the upsampled map of the same length. The decoder sees where things were, at full resolution.`,
        code: `skip${k} = enc${k}(...)   # kept, then torch.cat`, w: 0 });
      op({ id: `dec${k}`, kind: "conv", from: `cat${k}`, to: `dec${k}`, title: `conv block, decoder level ${k}`,
        text: skips ? `Convolution over the ${2 * w} concatenated channels, back to ${w}.` : `Convolution over the ${w} channels.`,
        code: `dec${k} = conv_block(${skips ? 2 * w : w}, ${w}, 7)`, w: convW(skips ? 2 * w : w, w) });
    }
    op({ id: "out", kind: "out", from: "dec0", to: "out", title: "1x1 convolution: one answer per sample",
      text: `At every one of the ${LENGTH} samples, 8 channels become 3 scores: P, S and neither. A softmax (inside the loss) makes them probabilities that add to one.`,
      code: `out = nn.Conv1d(8, 3, 1)`, w: 8 * 3 + 3 });
    if (STAGE < 2) {                 // encoder only: the target is drawn as an empty ghost
      const left = id => /^(in|inc|enc\d|down\d)$/.test(id);
      for (const id of Object.keys(slabs)) if (!left(id) && id !== "out") delete slabs[id];
      for (const id of Object.keys(ops)) if (!left(id)) delete ops[id];
      slabs.out.ghost = true;
    }
    return { slabs, ops };
  }

  const KINDS = {
    conv: { colour: "var(--c1)", name: "conv block", note: "Conv1d (K = 7), BatchNorm, ReLU", tag: "2a, 2b" },
    down: { colour: "var(--c2)", name: "stride-4 conv block", note: "makes the record 4 times shorter", tag: "new", isNew: true },
    up: { colour: "var(--c3)", name: "transposed conv block", note: "makes it 4 times longer", tag: "new", isNew: true },
    skip: { colour: "var(--ink2)", name: "copy and concatenate", note: "the skip connection", tag: "new", isNew: true, dash: true },
    out: { colour: "var(--c5)", name: "1x1 convolution", note: "8 channels to P, S, neither", tag: "2b" },
  };

  // ---- drawing ----------------------------------------------------------------------------------
  // a block arrow (filled shaft and head with a dark edge, as in the figure of the paper)
  function arrowPath(x1, y1, x2, y2, shaft = 5, head = 12, hl = 10) {
    const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, ux = dx / L, uy = dy / L, nx = -uy, ny = ux;
    const hl2 = Math.min(hl, L * 0.6), bx = x2 - ux * hl2, by = y2 - uy * hl2, a = shaft / 2, b = head / 2;
    const p = [[x1 + nx * a, y1 + ny * a], [bx + nx * a, by + ny * a], [bx + nx * b, by + ny * b], [x2, y2],
      [bx - nx * b, by - ny * b], [bx - nx * a, by - ny * a], [x1 - nx * a, y1 - ny * a]];
    return "M" + p.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join("L") + "z";
  }

  // an arrow of right-angled bends through points pts (axis-aligned), filled block with dark edge
  function elbowPath(pts, shaft = 5, head = 12, hl = 10) {
    const n = pts.length, u = [], nm = [];
    for (let i = 0; i < n - 1; i++) {
      const dx = pts[i + 1][0] - pts[i][0], dy = pts[i + 1][1] - pts[i][1], L = Math.hypot(dx, dy) || 1;
      u.push([dx / L, dy / L]); nm.push([-dy / L, dx / L]);
    }
    const a = shaft / 2, b = head / 2, last = n - 2;
    const E = pts[n - 1], B = [E[0] - u[last][0] * hl, E[1] - u[last][1] * hl];
    const lf = [], rt = [];
    lf.push([pts[0][0] + nm[0][0] * a, pts[0][1] + nm[0][1] * a]);
    rt.push([pts[0][0] - nm[0][0] * a, pts[0][1] - nm[0][1] * a]);
    for (let i = 1; i < n - 1; i++) {
      const sx = nm[i - 1][0] + nm[i][0], sy = nm[i - 1][1] + nm[i][1];
      lf.push([pts[i][0] + a * sx, pts[i][1] + a * sy]); rt.push([pts[i][0] - a * sx, pts[i][1] - a * sy]);
    }
    const nl = nm[last];
    lf.push([B[0] + nl[0] * a, B[1] + nl[1] * a], [B[0] + nl[0] * b, B[1] + nl[1] * b]);
    rt.push([B[0] - nl[0] * a, B[1] - nl[1] * a]);
    const poly = [...lf, E, [B[0] - nl[0] * b, B[1] - nl[1] * b], ...rt.reverse()];
    return "M" + poly.map(q => q[0].toFixed(1) + "," + q[1].toFixed(1)).join("L") + "z";
  }

  function geom(s) {
    // a merged slab is two encoder-width halves, so every slab of a level has the same width
    // per channel block (cat = 2 halves of the encoder slab, decoder conv = one half)
    const w = s.io ? 40 : s.cat ? 2 * slabW(s.cat) : slabW(s.ch), h = s.io ? slabH(LENGTH) : slabH(s.L);
    return { x: cx(s.col) - w / 2, y: cy(s.level) - h / 2, w, h };
  }
  // where an arrow leaves a slab and arrives at the next
  function ends(o, S) {
    const a = geom(S[o.from]), b = geom(S[o.to]);
    if (o.kind === "skip") return [[a.x + a.w, a.y + a.h / 2], [b.x - 4, b.y + b.h / 2]];
    // down: straight down out of the slab, then across into the next; up: across, then straight up
    if (o.kind === "down") { const x = a.x + a.w / 2, y = b.y + b.h / 2; return [[x, a.y + a.h + 3], [x, y], [b.x - 3, y]]; }
    if (o.kind === "up") { const x = b.x + b.w / 2, y = a.y + a.h / 2; return [[a.x + a.w + 3, y], [x, y], [x, b.y + b.h + 3]]; }
    return [[a.x + a.w + 2, a.y + a.h / 2], [b.x - 4, b.y + b.h / 2]];
  }

  let ops, slabs;
  function draw() {
    ({ slabs, ops } = build());
    const sel = ops[state.sel] ? state.sel : (ops[FIRST] ? FIRST : Object.keys(ops)[0]);   // the switch can remove the selected skip
    state.sel = sel;
    const hotOp = ops[sel];
    const hotSlabs = new Set([hotOp.to]);
    svg.replaceChildren();

    // sample counts of each level, at both sides
    for (let k = 0; k < 5; k++) {
      el(svg, "text", { x: 6, y: cy(k) + 4, class: "mono dim" }, `${fmt(LEV(k))}`);
      if (k) el(svg, "path", { d: `M44,${cy(k)}H${cx(2 * k + 1) - 18}`, stroke: "var(--grid)", "stroke-width": 1, "stroke-dasharray": "1 4" });
    }
    el(svg, "text", { x: 6, y: cy(0) - 44, class: "dim" }, "samples");

    // arrows first, slabs on top
    Object.values(ops).forEach(o => {
      const kind = KINDS[o.kind], hot = o.id === sel;
      const pts = ends(o, slabs), [x1, y1] = pts[0], [x2, y2] = pts[pts.length - 1];
      const bent = pts.length > 2, shaft = bent ? 6 : 5, head = bent ? 14 : 12;
      el(svg, "path", { d: bent ? elbowPath(pts, shaft, head, 10) : arrowPath(x1, y1, x2, y2, shaft, head), fill: kind.colour, "fill-opacity": kind.dash ? 0.35 : 0.8, stroke: hot ? "var(--ink)" : "var(--ink2)",
        "stroke-width": hot ? 2 : 1, "stroke-dasharray": kind.dash ? "4 3" : "none", "stroke-linejoin": "round" });
      const h = el(svg, "path", { d: "M" + pts.map(q => q.join(",")).join("L"), fill: "none", stroke: "transparent", "stroke-width": 16, style: "cursor:pointer" });
      h.addEventListener("pointerenter", () => select(o.id));
      h.addEventListener("pointerdown", () => select(o.id));
    });

    // slabs
    Object.values(slabs).forEach(s => {
      const g = geom(s), hot = hotSlabs.has(s.id);
      const stroke = hot ? "var(--c2)" : "var(--ink)";
      if (s.ghost) {
        el(svg, "rect", { x: g.x, y: g.y, width: g.w, height: g.h, fill: "none", stroke: "var(--ink2)", "stroke-width": 1.2, "stroke-dasharray": "4 3" });
        el(svg, "text", { x: g.x + g.w / 2, y: g.y + g.h / 2 + 4, class: "dim mid" }, "?");
      }
      else if (s.io === "in") record(g, hot);
      else if (s.io === "out") curves(g, hot);
      else {
        el(svg, "rect", { x: g.x, y: g.y, width: g.w, height: g.h, fill: "none", stroke, "stroke-width": hot ? 2 : 1.2 });
        if (s.cat) {          // the copied half, drawn hatched by an inner line and a lighter fill
          el(svg, "rect", { x: g.x, y: g.y, width: g.w / 2, height: g.h, fill: "var(--ink2)", opacity: 0.22 });
          el(svg, "path", { d: `M${g.x + g.w / 2},${g.y}v${g.h}`, stroke, "stroke-width": 1 });
        }
      }
      el(svg, "text", { x: g.x + g.w / 2, y: g.y - 5, class: "mono mid", style: hot ? "fill:var(--c2)" : "" }, s.cat ? `${s.cat}+${s.cat}` : String(s.ch));
      const r = el(svg, "rect", { x: g.x - 8, y: g.y - 12, width: g.w + 16, height: g.h + 24, fill: "transparent", style: "cursor:pointer" });
      const producing = Object.values(ops).find(o => o.to === s.id && o.kind !== "skip");
      if (producing) {
        r.addEventListener("pointerenter", () => select(producing.id));
        r.addEventListener("pointerdown", () => select(producing.id));
      }
    });
    el(svg, "text", { x: cx(0), y: cy(0) + slabH(LENGTH) / 2 + 16, class: "dim mid" }, "record");
    el(svg, "text", { x: cx(20), y: cy(0) + slabH(LENGTH) / 2 + 16, class: "dim mid" }, "P, S, neither");

    explain(hotOp);
    side();
  }

  // a made-up three-component record and the three curves of one answer per sample, time running down
  function record(g, hot) {
    el(svg, "rect", { x: g.x, y: g.y, width: g.w, height: g.h, fill: "none", stroke: hot ? "var(--c2)" : "var(--ink)", "stroke-width": hot ? 2 : 1.2 });
    const n = 140, cols = ["var(--c5)", "var(--c6)", "var(--c1)"];
    for (let c = 0; c < 3; c++) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const t = i / n;
        const noise = 0.18 * Math.sin(i * (2.1 + c) + c) * Math.sin(i * 0.9 + 2 * c);
        const p = t > 0.3 ? Math.exp(-(t - 0.3) * 9) * Math.sin(i * 1.7 + c) * (c === 2 ? 1 : 0.5) : 0;
        const s = t > 0.56 ? Math.exp(-(t - 0.56) * 6) * Math.sin(i * 1.1 + c) * (c === 2 ? 0.7 : 1.1) : 0;
        pts.push(`${g.x + 8 + c * 12 + 5 * (noise + 0.9 * p + 0.9 * s)},${g.y + 3 + t * (g.h - 6)}`);
      }
      el(svg, "polyline", { points: pts.join(" "), fill: "none", stroke: cols[c], "stroke-width": 0.9 });
    }
  }
  function curves(g, hot) {
    el(svg, "rect", { x: g.x, y: g.y, width: g.w, height: g.h, fill: "none", stroke: hot ? "var(--c2)" : "var(--ink)", "stroke-width": hot ? 2 : 1.2 });
    const n = 120, specs = [["var(--c2)", 0.3, 0.012], ["var(--c1)", 0.56, 0.02]];
    for (const [col, c0, sd] of specs) {
      const pts = [];
      for (let i = 0; i < n; i++) {
        const t = i / n, p = Math.exp(-((t - c0) ** 2) / (2 * sd * sd * 4));
        pts.push(`${g.x + 4 + 30 * p},${g.y + 3 + t * (g.h - 6)}`);
      }
      el(svg, "polyline", { points: pts.join(" "), fill: "none", stroke: col, "stroke-width": 1.3 });
    }
  }

  function explain(o) {
    const a = slabs[o.from], b = slabs[o.to], ch = x => x.cat ? x.ch / 2 : x.ch;
    $("e-title").textContent = o.title;
    $("e-text").textContent = o.kind === "skip" ? `${ch(a)} channels, ${fmt(a.L)} samples: copied` : `${a.ch} to ${b.ch} channels, ${fmt(a.L)} to ${fmt(b.L)} samples`;
    $("e-code").textContent = "";
    $("e-params").textContent = o.kind === "skip" ? "no learned weights" : `${fmt(o.w)} learned weights`;
  }

  function total() { return Object.values(ops).reduce((a, o) => a + o.w, 0); }
  function side() {
    const t = total();
    $("total").textContent = fmt(t);
    const want = STAGE < 2 ? undefined : (state.skips ? P.params : P.params_no_skips);
    $("check").textContent = want === undefined ? "" : (want === t ? "the model in the notebook has the same number" : `the model has ${fmt(want)}`);
  }

  function select(id) { if (state.sel !== id) { state.sel = id; draw(); } }

  // legend and switch
  (function legend() {
    const root = $("legend");
    const kinds = ["conv", "down", ...(STAGE > 1 ? ["up", "out"] : []), ...(STAGE > 2 ? ["skip"] : [])];
    for (const k of kinds) {
      const v = KINDS[k], row = document.createElement("div");
      row.className = "leg";
      const s = document.createElementNS(ns, "svg");
      s.setAttribute("width", 44); s.setAttribute("height", 16);
      const l = document.createElementNS(ns, "path");
      l.setAttribute("d", arrowPath(2, 8, 42, 8, 6, 14, 11)); l.setAttribute("fill", v.colour);
      l.setAttribute("fill-opacity", v.dash ? 0.35 : 0.8); l.setAttribute("stroke", "var(--ink2)");
      l.setAttribute("stroke-width", 1); l.setAttribute("stroke-linejoin", "round");
      if (v.dash) l.setAttribute("stroke-dasharray", "4 3");
      s.appendChild(l);
      row.appendChild(s);
      const nm = document.createElement("span");
      nm.className = "nm"; nm.innerHTML = `${v.name}<br><span class="hint">${v.note}</span>`;
      row.appendChild(nm);
      const tag = document.createElement("span");
      tag.className = "tag" + (v.isNew ? " new" : ""); tag.textContent = v.tag;
      row.appendChild(tag);
      root.appendChild(row);
    }
  })();
  const seg = $("seg-skips");
  [["on", true], ["off", false]].forEach(([label, v]) => {
    const b = document.createElement("button");
    b.textContent = label; b.dataset.v = v;
    b.onclick = () => { state.skips = v; syncSeg(); draw(); };
    seg.appendChild(b);
  });
  function syncSeg() { seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", (b.dataset.v === "true") === state.skips)); }

  svg.addEventListener("keydown", e => {
    const ids = Object.keys(ops);
    let i = ids.indexOf(state.sel);
    if (e.key === "ArrowRight") i = Math.min(i + 1, ids.length - 1);
    else if (e.key === "ArrowLeft") i = Math.max(i - 1, 0);
    else return;
    e.preventDefault(); state.sel = ids[i]; draw();
  });
  if (STAGE < 3) document.querySelectorAll(".skiprow").forEach(e => e.hidden = true);
  syncSeg();
  draw();
</script>
</body>
</html>
