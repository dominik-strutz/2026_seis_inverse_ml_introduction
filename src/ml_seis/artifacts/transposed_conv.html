<!doctype html>
<!-- Artifact: a 1-D transposed convolution with kernel 5 and stride 5, the step the
     decoder of 2c uses to turn 6 steps into 30 steps. A made-up input of 6 values and a
     filter of 5 weights; every input value writes a copy of the filter scaled by that
     value (h_out(5t+tau) = w_tau h_in(t)) into the output, five samples further on than
     the copy before, so the copies sit side by side and do not overlap. The five weights of
     the filter can be dragged (|w| <= 1) and the output follows. Hover a value
     (or arrow keys): its bar, the five output values it writes and the arithmetic turn
     vermillion. The overlapping case (kernel 7, stride 4) is in strided_conv.html. Same
     operation as nn.ConvTranspose1d(c, c, 5, stride=5). Numbers are made up. Shared
     ml_seis style (src/ml_seis/styles/README.md). Fonts are embedded by
     scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<div id="stage">
<svg id="fig" width="1100" height="405" viewBox="0 0 1100 405" role="img"
     aria-label="A transposed convolution of kernel 5 and stride 5: every input value writes a scaled copy of the filter"></svg>

<script>

  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5; };
  // a made-up spectrogram cell: strong at low frequency, an onset and a decaying coda
  const specValue = (c, r, cols, rows) => {
    const onset = cols * 0.18, env = c < onset ? 0.12 : Math.exp(-(c - onset) / (cols * 0.4));
    return Math.min(0.95, Math.max(0.04, (0.25 + 0.75 * Math.exp(-r / (rows * 0.35))) * env));
  };
  const specBlock = (g, x, y, w, h, cols, rows, noise, seed) => {
    const rnd = rng(seed), cw = w / cols, ch = h / rows;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++)
      el(g, "rect", { x: x + c * cw, y: y + h - (r + 1) * ch, width: cw + 0.3, height: ch + 0.3, fill: "var(--c1)",
        "fill-opacity": Math.min(0.95, Math.max(0.04, specValue(c, r, cols, rows) + noise * rnd())) });
    el(g, "rect", { x, y, width: w, height: h, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
  };

  const X0 = 330, SLOT = 740 / 6, FW = 740 / 30, YI = 118, YO = 332, SC = 40;
  const HIN = [0.8, -0.4, 1.2, 0.6, -0.9, 0.3], W = [0.2, 0.9, 0.6, -0.4, 0.1];
  const fig = $("fig"), g = el(fig, "g", {}), gfilt = el(fig, "g", {}), gout = el(fig, "g", {}), dyn = el(fig, "g", {});
  let sel = 2;
  const fmt = v => (v < 0 ? "−" : "") + Math.abs(v).toFixed(2);
  const math = (parent, x, y, runs, attrs) => {
    const t = el(parent, "text", Object.assign({ class: "m", x, y }, attrs || {}));
    let at = 0;
    runs.forEach(([s, kind]) => {
      const to = kind === "sub" ? 3 : kind === "sup" ? -5 : 0;
      const a = { dy: to - at }; if (kind) a["font-size"] = 9.5;
      el(t, "tspan", a, s); at = to;
    });
    return t;
  };
  const bar = (parent, cx, zero, v, w, sc, cls) => el(parent, "rect", { x: cx - w / 2, y: v >= 0 ? zero - v * sc : zero,
    width: w, height: Math.abs(v) * sc, fill: cls.fill, "fill-opacity": cls.op, stroke: cls.stroke, "stroke-width": 1.4 });
  const BLUE = { fill: "var(--c1)", op: 0.2, stroke: "var(--c1)" }, RED = { fill: "var(--c2)", op: 0.25, stroke: "var(--c2)" };

  // the filter: five weights, each one dragged up or down (|w| <= 1, so that a copy
  // of the filter scaled by an input value never leaves its step)
  el(g, "text", { class: "cap", x: 30, y: 26 }, "FILTER, 5 WEIGHTS");
  el(g, "text", { class: "sub", x: 30, y: 42, style: "text-anchor:start" }, "drag a weight");
  el(g, "line", { x1: 28, x2: 250, y1: 100, y2: 100, stroke: "var(--ink2)" });
  const WX = k => 52 + k * 42, WMAX = 1;
  function drawFilter() {
    gfilt.replaceChildren();
    W.forEach((w, k) => {
      const x = WX(k);
      bar(gfilt, x, 100, w, 28, 50, RED);
      el(gfilt, "circle", { cx: x, cy: 100 - w * 50, r: 4.5, fill: "var(--bg)", stroke: "var(--c2)", "stroke-width": 1.6 });
      el(gfilt, "text", { class: "mono dim", x, y: 168, "text-anchor": "middle" }, fmt(w));
      math(gfilt, x - 5, 188, [["w"], [String(k), "sub"]], { "text-anchor": "middle", "font-size": 14 });
    });
  }
  // input and output rows, each cut into the six steps
  [[YI, "input", "6 values"], [YO, "output", "30 values"]].forEach(([y, a, b]) => {
    el(g, "line", { x1: X0, x2: X0 + 740, y1: y, y2: y, stroke: "var(--ink2)" });
    el(g, "text", { x: X0 - 14, y: y - 2, style: "text-anchor:end" }, a);
    el(g, "text", { class: "sub", x: X0 - 14, y: y + 14, style: "text-anchor:end" }, b);
    for (let t = 0; t < 6; t++) el(g, "rect", { x: X0 + t * SLOT + 2, y: y - 56, width: SLOT - 4, height: 112,
      fill: "none", stroke: "var(--grid)" });
  });
  HIN.forEach((v, t) => bar(g, X0 + (t + 0.5) * SLOT, YI, v, 52, SC, BLUE));
  function drawOutput() {
    gout.replaceChildren();
    for (let f = 0; f < 30; f++) bar(gout, X0 + (f + 0.5) * FW, YO, W[f % 5] * HIN[Math.floor(f / 5)], FW - 6, SC, BLUE);
  }

  function draw() {
    drawFilter(); drawOutput();
    dyn.replaceChildren();
    const v = HIN[sel], xin = X0 + (sel + 0.5) * SLOT;
    el(dyn, "rect", { x: X0 + sel * SLOT + 2, y: YI - 56, width: SLOT - 4, height: 112, fill: "none", stroke: "var(--c2)", "stroke-width": 1.6 });
    el(dyn, "rect", { x: X0 + sel * SLOT + 2, y: YO - 56, width: SLOT - 4, height: 112, fill: "none", stroke: "var(--c2)", "stroke-width": 1.6 });
    el(dyn, "rect", { x: xin - 26, y: v >= 0 ? YI - v * SC : YI, width: 52, height: Math.abs(v) * SC, fill: "var(--bg)" });
    bar(dyn, xin, YI, v, 52, SC, RED);
    el(dyn, "text", { class: "mono sel", x: xin, y: YI - 62, "text-anchor": "middle" }, fmt(v));
    for (let k = 0; k < 5; k++) {
      const f = 5 * sel + k, fx = X0 + (f + 0.5) * FW, o = W[k] * v;
      el(dyn, "line", { x1: xin, y1: YI + 58, x2: fx, y2: YO - 70, stroke: "var(--c2)", "stroke-width": 1 });
      math(dyn, fx - 4, YO - 62, [["w"], [String(k), "sub"]], { "text-anchor": "middle", fill: "var(--c2)", "font-size": 13 });
      el(dyn, "rect", { x: fx - (FW - 6) / 2, y: o >= 0 ? YO - o * SC : YO, width: FW - 6, height: Math.abs(o) * SC, fill: "var(--bg)" });
      bar(dyn, fx, YO, o, FW - 6, SC, RED);
    }
    el(dyn, "text", { class: "sub", x: X0, y: 22, style: "text-anchor:start" }, "hover a value of the input, or use the arrow keys; drag the weights of the filter");
  }
  const svgPoint = e => {
    const pt = fig.createSVGPoint(); pt.x = e.clientX; pt.y = e.clientY;
    return pt.matrixTransform(fig.getScreenCTM().inverse());
  };
  // a weight is grabbed in its column of the filter panel and follows the pointer
  let grab = -1;
  const weightAt = p => {
    if (p.y < 52 || p.y > 150) return -1;
    const k = Math.round((p.x - WX(0)) / 42);
    return k >= 0 && k < 5 && Math.abs(p.x - WX(k)) < 21 ? k : -1;
  };
  const drag = p => {
    W[grab] = Math.round(Math.max(-WMAX, Math.min(WMAX, (100 - p.y) / 50)) * 100) / 100;
    draw();
  };
  fig.addEventListener("pointerdown", e => {
    const k = weightAt(svgPoint(e));
    if (k < 0) return;
    grab = k; fig.setPointerCapture(e.pointerId); drag(svgPoint(e)); e.preventDefault();
  });
  fig.addEventListener("pointerup", () => { grab = -1; });
  fig.addEventListener("pointercancel", () => { grab = -1; });
  fig.addEventListener("pointermove", e => {
    if (grab >= 0) drag(svgPoint(e));
    else fig.style.cursor = weightAt(svgPoint(e)) >= 0 ? "ns-resize" : "default";
  });
  const stepAt = e => {
    if (grab >= 0) return;
    const p = svgPoint(e);
    if (p.y < 50 || p.y > YO + 60) return;
    const t = Math.floor((p.x - X0) / SLOT);
    if (t >= 0 && t < 6 && t !== sel) { sel = t; draw(); }
  };
  fig.addEventListener("pointermove", stepAt); fig.addEventListener("pointerdown", stepAt);
  window.addEventListener("keydown", e => {
    if (e.key === "ArrowLeft" && sel > 0) { sel--; draw(); }
    if (e.key === "ArrowRight" && sel < 5) { sel++; draw(); }
  });
  draw();

</script>
</body>
</html>
