<!-- Artifact: the network of 2b with the label comparison replaced by a decoder. The
     encoder (top row, left to right) is the WaveformCNN of 2b: four convolution blocks,
     mean over time, a linear layer whose four outputs are the latent vector z. The decoder
     (bottom row, right to left) is drawn layer by layer: linear + ReLU, reshape,
     conv, transposed conv, conv, 1x1 conv, giving the rebuilt spectrogram, which is
     compared with the target (log |STFT| of the record). No interaction. Same slab
     drawing as cnn_features.html. Shared ml_seis style (src/ml_seis/styles/README.md).
     Fonts are embedded by scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="1100" height="410" viewBox="0 0 1100 410" role="img"
     aria-label="The autoencoder: encoder, a latent vector of four numbers, decoder, and the loss against a spectrogram"></svg>
</div>

<script>

  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5; };
  // a made-up spectrogram cell: strong at low frequency, an onset and a decaying coda
  const specValue = (c, r, cols, rows) => {
    const onset = cols * 0.18, env = c < onset ? 0.12 : Math.exp(-(c - onset) / (cols * 0.4));
    return Math.min(0.95, Math.max(0.04, (0.25 + 0.75 * Math.exp(-r / (rows * 0.35))) * env));
  };
  const specBlock = (g, x, y, w, h, cols, rows, noise, seed) => {
    const rnd = rng(seed), cw = w / cols, ch = h / rows;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++)
      el(g, "rect", { x: x + c * cw, y: y + h - (r + 1) * ch, width: cw + 0.3, height: ch + 0.3, fill: "var(--c1)",
        "fill-opacity": Math.min(0.95, Math.max(0.04, specValue(c, r, cols, rows) + noise * rnd())) });
    el(g, "rect", { x, y, width: w, height: h, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
  };

  const T = 750, HMAX = 90, X0 = 40, SW = 146, CY1 = 112, CY2 = 300;     // 7 slots of 146 px
  const slabH = L => Math.max(10, HMAX * Math.log(1 + L) / Math.log(1 + T));
  const slabW = ch => 4 + 0.4 * Math.min(ch, 64);
  const half = node => node.kind === "io" ? 9 : node.kind === "dense" ? 8 : node.kind === "img" ? 29 : slabW(node.ch) / 2;
  const cx = s => X0 + (s + 0.5) * SW;
  const GAP = 19;
  // circles of a dense layer; a long one shows two, three dots, two
  const neurons = (x, cy, ch) => (ch <= 6 ? Array.from({ length: ch }, (_, i) => i - (ch - 1) / 2)
    : [-2, -1, 0, 1, 2]).map((k, i, a) => ({ x, y: cy + k * GAP, dots: ch > 6 && k === 0 }));

  const wave = (() => {
    const rnd = rng(11);
    return Array.from({ length: 140 }, (_, t) => { const q = t - 40; return 0.35 * rnd() + (q > 0 ? 1.7 * Math.exp(-q / 30) * Math.sin(q * 0.9) : 0); });
  })();

  // [slot, node] for the two rows; the encoder runs left to right, the decoder back again
  const enc = [
    [1, { name: "waveform", kind: "io", L: T, l2: "1 channel", l3: `${T} samples` }],
    [2, { name: "conv 1", kind: "feat", ch: 8, L: 750, l2: "8 filters", l3: "750 samples" }],
    [3, { name: "conv 2", kind: "feat", ch: 8, L: 187, l2: "8 filters", l3: "187 samples" }],
    [4, { name: "conv 3", kind: "feat", ch: 8, L: 46, l2: "8 filters", l3: "46 samples" }],
    [5, { name: "conv 4", kind: "feat", ch: 8, L: 11, l2: "8 filters", l3: "11 samples" }],
    [6, { name: "latent z", kind: "dense", ch: 4, mark: true, side: true, l2: "4 numbers" }],
  ];
  const dec = [
    [6, { name: "hidden", kind: "dense", ch: 48, l2: "48 numbers" }],
    [5, { name: "steps", kind: "feat", ch: 8, L: 6, l2: "8 channels", l3: "6 steps" }],
    [4, { name: "conv 5", kind: "feat", ch: 8, L: 6, l2: "8 channels", l3: "6 steps" }],
    [3, { name: "steps", kind: "feat", ch: 8, L: 30, l2: "8 channels", l3: "30 steps" }],
    [2, { name: "conv 6", kind: "feat", ch: 8, L: 30, l2: "8 channels", l3: "30 steps" }],
    [1, { name: "rebuilt", kind: "img", l2: "spectrogram", l3: "16 × 30", noise: 0, seed: 3 }],
    [0, { name: "target", kind: "img", l2: "from the record", l3: "16 × 30", noise: 0.22, seed: 5 }],
  ];

  function draw(g, x, cy, node) {
    if (node.kind === "io") {
      const h = slabH(node.L), top = cy - h / 2;
      el(g, "line", { x1: x, x2: x, y1: top, y2: top + h, stroke: "var(--ink2)", "stroke-width": 1 });
      el(g, "polyline", { points: wave.map((v, t) => `${x + 8 * v},${top + t * h / (wave.length - 1)}`).join(" "),
        fill: "none", stroke: "var(--ink)", "stroke-width": 1 });
      el(g, "line", { x1: x - 22, x2: x - 22, y1: top + 6, y2: top + h - 6, stroke: "var(--ink2)" });
      el(g, "polyline", { points: `${x - 25.5},${top + h - 11} ${x - 22},${top + h - 6} ${x - 18.5},${top + h - 11}`,
        fill: "none", stroke: "var(--ink2)" });
      el(g, "text", { class: "dim", x: x - 28, y: cy, "text-anchor": "middle", transform: `rotate(-90 ${x - 28} ${cy})` }, "time");
    } else if (node.kind === "dense") {
      neurons(x, cy, node.ch).forEach(q => q.dots
        ? el(g, "text", { class: "dim", x: q.x, y: q.y + 5, "text-anchor": "middle" }, "⋮")
        : el(g, "circle", { cx: q.x, cy: q.y, r: 7.5, fill: "var(--bg)", stroke: node.mark ? "var(--c2)" : "var(--ink)",
            "stroke-width": node.mark ? 2 : 1.2 }));
    } else if (node.kind === "img") {
      specBlock(g, x - 29, cy - 36, 58, 72, 14, 8, node.noise, node.seed);
    } else {
      const w = slabW(node.ch), h = slabH(node.L);
      el(g, "rect", { x: x - w / 2, y: cy - h / 2, width: w, height: h, rx: 1.5,
        fill: "var(--c1)", "fill-opacity": 0.2, stroke: "var(--c1)", "stroke-width": 1.4 });
    }
  }
  const head = (g, x, y, dir, colour) => el(g, "polyline", { fill: "none", stroke: colour, "stroke-width": 1.2,
    points: `${x - dir * 5},${y - 3.5} ${x},${y} ${x - dir * 5},${y + 3.5}` });
  // a horizontal arrow from node a to node b in one row, the operation written above it
  function arrow(g, ra, a, rb, b, cy, lines, colour, both) {
    const dir = b > a ? 1 : -1, na = ra, nb = rb;
    const x1 = cx(a) + dir * (half(na) + 5), x2 = cx(b) - dir * (half(nb) + 5);
    el(g, "line", { x1, x2, y1: cy, y2: cy, stroke: colour, "stroke-width": 1.2 });
    head(g, x2, cy, dir, colour); if (both) head(g, x1, cy, -dir, colour);
    lines.forEach((s, j) => el(g, "text", { class: "mono " + (colour === "var(--c2)" ? "sel" : "dim"), x: (x1 + x2) / 2,
      y: cy - 7 - 13 * (lines.length - 1 - j), "text-anchor": "middle" }, s));
  }

  const fig = $("fig"), g = el(fig, "g", {});
  const place = (row, cy) => row.forEach(([slot, node]) => {
    draw(g, cx(slot), cy, node);
    const lx = node.side ? cx(slot) + 16 : cx(slot), anchor = node.side ? "start" : "middle", y0 = node.side ? cy - 6 : cy + 62;
    el(g, "text", { class: "name" + (node.mark ? " sel" : ""), x: lx, y: y0, style: `text-anchor:${anchor}` }, node.name);
    if (node.l2) el(g, "text", { class: "sub", x: lx, y: y0 + 16, style: `text-anchor:${anchor}` }, node.l2);
    if (node.l3) el(g, "text", { class: "sub", x: lx, y: y0 + 31, style: `text-anchor:${anchor}` }, node.l3);
  });
  place(enc, CY1); place(dec, CY2);
  const E = Object.fromEntries(enc.map(([s, n]) => [s, n])), D = Object.fromEntries(dec.map(([s, n]) => [s, n]));
  const ink = "var(--ink2)", red = "var(--c2)";

  // the encoder: the network of 2b
  arrow(g, E[1], 1, E[2], 2, CY1, ["conv"], ink);
  [[2, 3], [3, 4], [4, 5]].forEach(([a, b]) => arrow(g, E[a], a, E[b], b, CY1, ["pool ÷4", "conv"], ink));
  neurons(cx(6), CY1, 4).forEach(q => el(g, "line", { x1: cx(5) + half(E[5]) + 3, y1: CY1, x2: cx(6) - 8, y2: q.y,
    stroke: ink, "stroke-width": 0.8, opacity: 0.7 }));
  el(g, "text", { class: "mono dim", x: (cx(5) + cx(6)) / 2, y: CY1 - 55, "text-anchor": "middle" }, "mean, linear");
  // the latent vector, then the decoder back to the left, one layer at a time
  const yTop = CY1 + 44, yBot = CY2 - 52;
  el(g, "line", { x1: cx(6), x2: cx(6), y1: yTop, y2: yBot, stroke: ink, "stroke-width": 1.2 });
  el(g, "polyline", { points: `${cx(6) - 3.5},${yBot - 5} ${cx(6)},${yBot} ${cx(6) + 3.5},${yBot - 5}`, fill: "none", stroke: ink, "stroke-width": 1.2 });
  el(g, "text", { class: "mono dim", x: cx(6) + 10, y: (yTop + yBot) / 2 + 4 }, "linear, ReLU");
  arrow(g, D[6], 6, D[5], 5, CY2, ["reshape"], ink);
  arrow(g, D[5], 5, D[4], 4, CY2, ["conv"], ink);
  arrow(g, D[4], 4, D[3], 3, CY2, ["transposed", "conv, stride 5"], ink);
  arrow(g, D[3], 3, D[2], 2, CY2, ["conv"], ink);
  arrow(g, D[2], 2, D[1], 1, CY2, ["conv 1×1"], ink);
  arrow(g, D[1], 1, D[0], 0, CY2, ["loss"], red, true);
  // the target is computed from the record
  const xs = cx(1) - 44, xt = cx(0);
  el(g, "path", { d: `M${xs},${CY1} H${xt} V${CY2 - 42}`, fill: "none", stroke: ink, "stroke-width": 1.2, "stroke-dasharray": "4 3" });
  el(g, "polyline", { points: `${xt - 3.5},${CY2 - 47} ${xt},${CY2 - 42} ${xt + 3.5},${CY2 - 47}`, fill: "none", stroke: ink, "stroke-width": 1.2 });
  el(g, "text", { class: "mono dim", x: xt + 9, y: (CY1 + CY2) / 2 - 2 }, "log |STFT|");
  el(g, "text", { class: "mono dim", x: xt + 9, y: (CY1 + CY2) / 2 + 12 }, "of the record");
  // what replaces the label of 2b
  el(g, "text", { class: "sel", x: cx(6), y: 13, "text-anchor": "middle" }, "the latent vector:");
  el(g, "text", { class: "sel", x: cx(6), y: 28, "text-anchor": "middle" }, "four numbers per record");
  el(g, "line", { x1: cx(6), x2: cx(6), y1: 36, y2: CY1 - 44, stroke: red, "stroke-width": 1.4 });
  el(g, "polyline", { points: `${cx(6) - 4},${CY1 - 50} ${cx(6)},${CY1 - 43} ${cx(6) + 4},${CY1 - 50}`, fill: "none", stroke: red, "stroke-width": 1.4 });
  // captions
  el(g, "text", { class: "cap", x: cx(1) - 40, y: 24 }, "ENCODER: THE NETWORK OF 2B");
  el(g, "text", { class: "cap", x: cx(1) - 40, y: CY2 - 62 }, "DECODER");

</script>
</body>
</html>
