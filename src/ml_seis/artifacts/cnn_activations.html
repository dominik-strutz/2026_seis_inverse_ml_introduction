<!doctype html>
<!-- Artifact: where the first two convolution blocks of the 2b network react. One test
     record on top, then every filter of block 1 (16) and block 2 (32) as its own row of
     a colour map over time (viridis, one colour scale per block). Two buttons step
     through the records; the title line gives the label and the network's answer.
     Hovering a row outlines it and draws that filter's weights on the left (block 1: a 9-weight
     waveform; block 2: 16 input channels x 9 weights, blue positive, vermillion
     negative).
     window.ARTIFACT {records, rows, cols, samples} comes from the notebook:
     ml_seis.waveform_metrics.activation_records (base64 bytes: record as int8, maps as
     uint8). Sampling rate is 50 Hz (Llaima). No fonts to embed (no maths symbols).
     Shared ml_seis style (src/ml_seis/styles/README.md): Okabe-Ito tokens, DejaVu Sans. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x560">
<title>Where the first blocks react</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 560px;
    transform-origin: 0 0; }
  #heat, #fig { position: absolute; left: 0; top: 0; width: 1100px; height: 560px; }
  #bar { position: absolute; left: 12px; top: 6px; display: flex; gap: 10px;
    align-items: center; }
  button { font: 12px "DejaVu Sans", Arial, sans-serif; color: var(--ink);
    background: transparent; border: 1px solid var(--ink2); border-radius: 4px;
    padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  #read { margin-left: 8px; font-size: 13px; }
  #read .bad { color: var(--c2); }
  #read .dim { color: var(--ink2); }
  svg text { fill: var(--ink); font-size: 12px; }
  svg .dim { fill: var(--ink2); }
  svg .cap { font-size: 11.5px; letter-spacing: 0.08em; font-weight: 700; }
  svg .ax { stroke: var(--ink); stroke-width: 1; fill: none; }
  svg .gr { stroke: var(--grid); stroke-width: 0.6; fill: none; }
  svg .trace { stroke: var(--c1); stroke-width: 0.9; fill: none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="heat" width="2200" height="1120"></canvas>
  <svg id="fig" width="1100" height="560" viewBox="0 0 1100 560" role="img"
       aria-label="Feature maps of the first two blocks, one row per filter"></svg>
  <div id="bar">
    <button id="prev">▲ previous record</button>
    <button id="next">▼ next record</button>
    <span id="read"></span>
  </div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const A = window.ARTIFACT || { records: [], rows: [16, 32], cols: [750, 187], samples: 750 };
  const RATE = 50, T = A.samples, SEC = T / RATE;
  const X0 = 150, W = 920;                 // plot area: left edge, width
  const INPUT = { y: 52, h: 60 };
  const ROW = 8;                           // logical px per filter
  const blocks = A.rows.map((n, b) => ({ n, len: A.cols[b], h: n * ROW }));
  blocks[0].y = 126;
  blocks[1].y = blocks[0].y + blocks[0].h + 14;
  const BOTTOM = blocks[1].y + blocks[1].h;

  // viridis from a few anchors
  const ANCH = [[0, 68, 1, 84], [.125, 72, 40, 120], [.25, 62, 74, 137], [.375, 49, 104, 142],
    [.5, 38, 130, 142], [.625, 31, 158, 137], [.75, 53, 183, 121], [.875, 110, 206, 88],
    [.9375, 180, 222, 44], [1, 253, 231, 37]];
  const LUT = Array.from({ length: 256 }, (_, i) => {
    const t = i / 255;
    let k = 0;
    while (k < ANCH.length - 2 && t > ANCH[k + 1][0]) k++;
    const a = ANCH[k], b = ANCH[k + 1], f = (t - a[0]) / (b[0] - a[0]);
    return [1, 2, 3].map(j => Math.round(a[j] + f * (b[j] - a[j])));
  });

  const bytes = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const el = (tag, attrs, parent) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    (parent || fig).appendChild(e);
    return e;
  };
  const fig = document.getElementById("fig");
  const txt = (x, y, s, cls, anchor) => {
    const t = el("text", { x, y, class: cls || "", "text-anchor": anchor || "start" });
    t.textContent = s;
    return t;
  };

  // ---- static frame: axes, ticks, captions
  const ticks = [];
  for (let s = 0; s <= SEC + 1e-9; s += 2) ticks.push(s);
  const xt = s => X0 + (W * s) / SEC;
  const frame = (y, h, label) => {
    el("line", { x1: X0, x2: X0, y1: y, y2: y + h, class: "ax" });
    el("line", { x1: X0, x2: X0 + W, y1: y + h, y2: y + h, class: "ax" });
    ticks.forEach(s => el("line", { x1: xt(s), x2: xt(s), y1: y + h, y2: y + h - 4, class: "ax" }));
  };
  frame(INPUT.y, INPUT.h);
  el("line", { x1: X0, x2: X0 + W, y1: INPUT.y + INPUT.h / 2, y2: INPUT.y + INPUT.h / 2, class: "gr" });
  txt(12, INPUT.y + INPUT.h / 2 + 4, "INPUT", "cap");
  blocks.forEach((b, k) => {
    frame(b.y, b.h);
    txt(12, b.y + 14, `BLOCK ${k + 1}`, "cap");
    txt(12, b.y + 30, `${b.n} filters, one per row`, "dim");
    if (k === 1) txt(12, b.y + 46, "¼ of the time samples", "dim");
    for (const i of [0, b.n - 1]) {
      const y = b.y + (i + 0.5) * ROW;
      el("line", { x1: X0, x2: X0 + 4, y1: y, y2: y, class: "ax" });
      txt(X0 - 7, y + 4, String(i + 1), "dim", "end");
    }
  });
  ticks.forEach(s => {
    if (s % 4 === 0) txt(xt(s), BOTTOM + 15, String(s), "", "middle");
  });
  txt(X0 + W / 2, BOTTOM + 31, "time (s)", "", "middle");

  // ---- the record on show
  const heat = document.getElementById("heat").getContext("2d");
  const trace = el("polyline", { class: "trace" });
  const read = document.getElementById("read");
  let index = 0;

  function show() {
    const r = A.records[index];
    if (!r) return;
    read.innerHTML = `record ${index + 1} of ${A.records.length} &nbsp; label <b>${r.label}</b>` +
      ` &nbsp; <span class="${r.guess === r.label ? "dim" : "bad"}">network says ` +
      `${r.guess} (${Math.round(100 * r.p)}%)</span>`;
    const x = new Int8Array(bytes(r.x).buffer);
    const mid = INPUT.y + INPUT.h / 2;
    trace.setAttribute("points", Array.from(x, (v, i) =>
      `${(X0 + (W * i) / (T - 1)).toFixed(1)},${(mid - (v / 127) * (INPUT.h / 2 - 3)).toFixed(1)}`
    ).join(" "));

    heat.setTransform(2, 0, 0, 2, 0, 0);
    heat.clearRect(0, 0, 1100, 560);
    heat.imageSmoothingEnabled = false;
    blocks.forEach((b, k) => {
      const m = bytes(r.maps[k]);
      const off = document.createElement("canvas");
      off.width = b.len; off.height = b.n;
      const img = off.getContext("2d").createImageData(b.len, b.n);
      for (let i = 0; i < m.length; i++) {
        const c = LUT[m[i]];
        img.data.set([c[0], c[1], c[2], 255], 4 * i);
      }
      off.getContext("2d").putImageData(img, 0, 0);
      heat.drawImage(off, X0, b.y, W, b.h);
      heat.fillStyle = "rgba(255,255,255,0.16)";           // faint line between the filters
      for (let i = 1; i < b.n; i++) heat.fillRect(X0, b.y + i * ROW - 0.25, W, 0.5);
      heat.fillStyle = "rgba(255,255,255,0.28)";           // faint time lines, to compare blocks
      ticks.forEach(s => { if (s > 0 && s < SEC) heat.fillRect(xt(s) - 0.25, b.y, 0.5, b.h); });
    });
  }

  const step = d => { index = (index + d + A.records.length) % A.records.length; show(); };
  document.getElementById("prev").onclick = () => step(-1);
  document.getElementById("next").onclick = () => step(1);
  show();

  // ---- hover a row: the weights of that filter on the left
  const F = (A.filters || []).map(f => ({ shape: f.shape, w: new Int8Array(bytes(f.w).buffer) }));
  const hov = el("g", {});
  const put = (x, y, s, cls, anchor) => hov.appendChild(txt(x, y, s, cls, anchor));
  function hover(k, i) {
    hov.replaceChildren();
    blocks.forEach((b, kk) => {
      const top = b.y + (kk === 0 ? 58 : 80);
      if (kk !== k || i === null || !F[kk]) {
        put(12, b.y + (kk === 0 ? 70 : 84), "hover a row to see", "dim");
        put(12, b.y + (kk === 0 ? 84 : 98), "the weights of its filter", "dim");
        return;
      }
      const [, nin, K] = F[kk].shape, w = F[kk].w;
      el("rect", { x: X0, y: b.y + i * ROW, width: W, height: ROW, fill: "none",
        stroke: "var(--c2)", "stroke-width": 1.4 }, hov);
      put(12, top - 6, `filter ${i + 1} of ${b.n}`, "");
      if (kk === 0) {                                   // 1 input channel: a short waveform
        const mid = top + 30, x0 = 16, x1 = 126;
        el("line", { x1: x0, x2: x1, y1: mid, y2: mid, class: "gr" }, hov);
        el("line", { x1: x0, x2: x0, y1: top, y2: top + 60, class: "ax" }, hov);
        const pts = Array.from({ length: K }, (_, j) =>
          [x0 + 6 + ((x1 - x0 - 12) * j) / (K - 1), mid - (w[i * K + j] / 127) * 27]);
        el("polyline", { points: pts.map(q => q.join(",")).join(" "), fill: "none",
          style: "stroke:var(--c2);stroke-width:1.4" }, hov);
        pts.forEach(q => el("circle", { cx: q[0], cy: q[1], r: 2.2, style: "fill:var(--c2)" }, hov));
        put(16, top + 76, `${K} weights`, "dim");
      } else {                                          // input channels x weights, as a map
        const cw = 11, ch = 4, x0 = 16;
        for (let c = 0; c < nin; c++) for (let j = 0; j < K; j++) {
          const v = w[(i * nin + c) * K + j] / 127;
          el("rect", { x: x0 + j * cw, y: top + c * ch, width: cw, height: ch,
            style: `fill:var(${v >= 0 ? "--c1" : "--c2"});opacity:${Math.abs(v).toFixed(2)}` }, hov);
        }
        el("line", { x1: x0, x2: x0, y1: top, y2: top + nin * ch, class: "ax" }, hov);
        put(x0, top + nin * ch + 14, `${nin} channels x ${K} weights`, "dim");
      }
    });
  }
  hover(-1, null);
  const stageEl = document.getElementById("stage");
  let last = "";
  stageEl.addEventListener("mousemove", e => {
    const r = stageEl.getBoundingClientRect(), sc = r.width / 1100;
    const x = (e.clientX - r.left) / sc, y = (e.clientY - r.top) / sc;
    let hit = null;
    if (x >= X0 - 24 && x <= X0 + W)
      blocks.forEach((b, k) => {
        if (y >= b.y && y < b.y + b.h) hit = [k, Math.min(b.n - 1, Math.floor((y - b.y) / ROW))];
      });
    const key = hit ? hit.join() : "";
    if (key !== last) { last = key; hit ? hover(hit[0], hit[1]) : hover(-1, null); }
  });
  stageEl.addEventListener("mouseleave", () => { last = ""; hover(-1, null); });
</script>
</body>
</html>
