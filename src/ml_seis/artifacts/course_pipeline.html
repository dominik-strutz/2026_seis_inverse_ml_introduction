<!doctype html>
<!-- Artifact: where the course sits in earthquake monitoring. Continuous records, a picker, an
     association step, a location, a magnitude and a catalogue, left to right. Boxes with a solid
     blue outline are what the course teaches (the part is written under the box); dashed grey boxes are
     not covered. The arc from the picker to the location is the pick error sigma: the spread of the
     picks measured in Part 2d is the sigma of the locator of Part 1. Pure illustration. Shared
     ml_seis style (src/ml_seis/styles/README.md, STYLE.md): Okabe-Ito tokens, DejaVu Sans 13 px.
     Fonts are embedded by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x360">
<title>The course in the monitoring chain</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00; --c3: #009e73;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d; --c3: #3ddc97;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 360px;
    transform-origin: 0 0; }
  svg { position: absolute; left: 0; top: 0; }
  svg text { fill: var(--ink); font-size: 13px; }
  svg .dim { fill: var(--ink2); font-size: 12px; }
  svg .name { font-size: 14px; text-anchor: middle; }
  svg .mid { text-anchor: middle; }
  svg .part { font-size: 12.5px; text-anchor: middle; font-weight: 700; }
  .m, svg .m { font-family: "Latin Modern Roman", "STIXGeneral", "Times New Roman", serif;
    font-style: italic; font-size: 1.2em; }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="1100" height="360" viewBox="0 0 1100 360" role="img"
     aria-label="Records, picker, association, location, catalogue: which part of the course covers which step"></svg>
</div>
<script>
  const ns = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const el = (tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    svg.appendChild(e); return e;
  };
  const W = 176, GAP = 40, X0 = 35, Y = 120, H = 66;
  const STEPS = [
    { name: "records", sub: ["days of three-component", "data from many stations"], part: "Parts 2a to 2c", cover: true,
      note: "filters, classes, latents" },
    { name: "detect and pick", sub: ["P and S probability at every", "sample, then a threshold"], part: "Part 2d", cover: true, hot: true,
      note: "PhaseNet, SeisBench" },
    { name: "associate", sub: ["which picks belong to", "the same earthquake"], part: "not covered", cover: false,
      note: "GaMMA, REAL, PyOcto" },
    { name: "locate", sub: ["arrival times to a location", "and its uncertainty"], part: "Parts 1a to 1c", cover: true,
      note: "gradients, networks, posteriors" },
    { name: "magnitude, catalogue", sub: ["size, relocation,", "statistics"], part: "not covered", cover: false,
      note: "" },
  ];
  STEPS.forEach((s, i) => {
    const x = X0 + i * (W + GAP), cx = x + W / 2;
    el("rect", { x, y: Y, width: W, height: H, rx: 4, fill: "none",
      stroke: s.hot ? "var(--c2)" : s.cover ? "var(--c1)" : "var(--ink2)", "stroke-width": s.hot ? 2.4 : 1.6,
      "stroke-dasharray": s.cover ? "none" : "5 4" });
    el("text", { x: cx, y: Y + 28, class: "name" }, s.name);
    el("text", { x: cx, y: Y + H + 22, class: "dim mid" }, s.sub[0]);
    el("text", { x: cx, y: Y + H + 38, class: "dim mid" }, s.sub[1]);
    el("text", { x: cx, y: Y + H + 70, class: "part", style: `fill:${s.hot ? "var(--c2)" : s.cover ? "var(--c1)" : "var(--ink2)"}` }, s.part);
    if (s.note) el("text", { x: cx, y: Y + H + 88, class: "dim mid" }, s.note);
    if (i < STEPS.length - 1) {
      const a = x + W + 6, b = x + W + GAP - 6, y = Y + H / 2;
      el("path", { d: `M${a},${y}H${b}`, stroke: "var(--ink2)", "stroke-width": 1.4, fill: "none" });
      el("path", { d: `M${b - 7},${y - 4}L${b},${y}L${b - 7},${y + 4}`, stroke: "var(--ink2)", "stroke-width": 1.4, fill: "none" });
    }
  });
  // the pick error sigma: an arc from the picker to the locator
  const x1 = X0 + 1 * (W + GAP) + W / 2, x2 = X0 + 3 * (W + GAP) + W / 2, arcTop = Y - 62;
  el("path", { d: `M${x1},${Y - 6}C${x1},${arcTop} ${x2},${arcTop} ${x2},${Y - 6}`, fill: "none", stroke: "var(--c2)",
    "stroke-width": 1.6, "stroke-dasharray": "2 4" });
  el("path", { d: `M${x2 - 4},${Y - 14}L${x2},${Y - 5}L${x2 + 4},${Y - 14}`, fill: "none", stroke: "var(--c2)", "stroke-width": 1.6 });
  const label = el("text", { x: (x1 + x2) / 2, y: arcTop + 2, class: "mid", style: "fill:var(--c2)" }, "");
  const part = (cls, t) => { const e = document.createElementNS(ns, "tspan"); if (cls) e.setAttribute("class", cls); e.textContent = t; label.appendChild(e); };
  part("m", "σ"); part("", " of the picks is the "); part("m", "σ"); part("", " of the locator");
</script>
