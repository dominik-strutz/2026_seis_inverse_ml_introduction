<!doctype html>
<!-- Artifact: removing the origin time. Slide t0: every arrival time d_i = t0 + F_i + eps_i
     moves up by t0, so does the station mean <d>, and the centred times d~_i = d_i - <d>
     do not move.
     Left: t0 as a vermillion arrow on the time axis, the arrival times (dots), their mean
     (dashed) and the offsets from it as stems. Right: the same offsets on a zero line, fixed.
     Shared ml_seis style: see STYLE.md. Geometry, v, true source and the noise draw match
     the geometry cell in 1_a_locating_with_gradients.py (torch.manual_seed(0)); t0 = 12.3 s
     there, here 0 to 11 s so the picks stay on the 20 s axis. Fonts are embedded by
     scripts/embed_artifact_fonts.py. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Removing the origin time</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00; --c3: #009e73; --edge: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d; --c3: #3ddc97; --edge: #0b0e14;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px;
    transform-origin: 0 0; }
  svg { position: absolute; left: 0; top: 130px; user-select: none; }
  svg text { fill: var(--ink); font-size: 11.5px; }
  svg .lab { font-size: 13px; }
  .m, svg .m { font-family: "Latin Modern Roman", serif; font-style: italic; font-size: 1.2em; }
  math { font-family: "Latin Modern Math", "Cambria Math", math; math-style: normal;
    font-size: 21px; white-space: nowrap; }
  .bv { font-style: normal; font-weight: 700; }
  .cD { color: var(--ink2); } .cT { color: var(--c2); }

  .col { position: absolute; top: 18px; width: 460px; }
  #colA { left: 40px; } #colB { left: 600px; }
  .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink); margin: 0 0 4px 2px; }
  .eq { height: 38px; display: flex; align-items: center; justify-content: center; }

  #ctl { position: absolute; left: 40px; right: 40px; top: 402px; display: flex;
    align-items: center; gap: 16px; color: var(--ink2); font-size: 12px; white-space: nowrap; }
  #ctl .nm { color: var(--ink); font-size: 13px; }
  #ctl .nm .m { font-size: 1.2em; }
  input[type=range] { width: 300px; accent-color: var(--c2); }
  #t0v { color: var(--ink); font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 15px;
    width: 64px; font-variant-numeric: tabular-nums; }
  #ctl .sp { flex: 1; }
  button { font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--ink2); border-radius: 3px; padding: 4px 11px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
  <div class="col" id="colA">

    </div>

<script>
  // Notebook values: true source (55, 45), v = 6 km/s, noise from torch.manual_seed(0).
  const F = [8.5797, 6.3465, 7.1200];
  const EPS = [0.1541, -0.0293, -0.2179];
  const T0_START = 10;                       // axis ends at 20 s, so t0 stays below 11.2 s
  const ns = "http://www.w3.org/2000/svg";
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const $ = id => document.getElementById(id);
  const halo = { "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": 4, "stroke-linejoin": "round" };
  const svg = $("plot");
  const sg = x => (x < 0 ? "−" : "+") + Math.abs(x).toFixed(2);
  const T0SUB = '<tspan class="m">t</tspan><tspan class="m" dy="3" font-size="10">0</tspan>';

  // left panel: time axis 0 to 20 s;  right panel: +-2.5 s around zero
  const A = { x0: 96, x1: 500, top: 8, bot: 232, ymax: 20 };
  const B = { x0: 656, x1: 1060, top: 8, bot: 232, zero: 120, k: 45 };
  const yA = v => A.bot - (A.bot - A.top) * v / A.ymax;
  const yB = v => B.zero - B.k * v;
  const cxA = i => A.x0 + 100 + i * 128, cxB = i => B.x0 + 70 + i * 132;
  const ARROW_X = A.x0 + 30;

  // static furniture: spines with inward ticks, labels
  const fixed = el(svg, "g", {});
  const spine = (g, x1, y1, x2, y2) => el(g, "line", { x1, y1, x2, y2, stroke: "var(--ink2)" });
  spine(fixed, A.x0, A.top, A.x0, A.bot); spine(fixed, A.x0, A.bot, A.x1, A.bot);
  for (let v = 0; v <= 20; v += 5) {
    spine(fixed, A.x0, yA(v), A.x0 + 5, yA(v));
    el(fixed, "text", { x: A.x0 - 8, y: yA(v) + 4, "text-anchor": "end" }, v);
  }
  spine(fixed, B.x0, B.top, B.x0, B.bot); spine(fixed, B.x0, B.zero, B.x1, B.zero);
  for (let v = -2; v <= 2; v++) {
    spine(fixed, B.x0, yB(v), B.x0 + 5, yB(v));
    el(fixed, "text", { x: B.x0 - 8, y: yB(v) + 4, "text-anchor": "end" }, v < 0 ? "−" + -v : v);
  }
  [0, 1, 2].forEach(i => {
    el(fixed, "text", { class: "lab", x: cxA(i), y: A.bot + 20, "text-anchor": "middle" }, i + 1);
    el(fixed, "text", { class: "lab", x: cxB(i), y: A.bot + 20, "text-anchor": "middle" }, i + 1);
  });
  el(fixed, "text", { x: A.x0 - 56, y: A.bot + 20 }, "station");
  el(fixed, "text", { x: B.x0 - 56, y: A.bot + 20 }, "station");
  el(fixed, "text", { transform: `translate(30 ${(A.top + A.bot) / 2}) rotate(-90)`, "text-anchor": "middle" }, "arrival time (s)");
  el(fixed, "text", { transform: `translate(612 ${(A.top + A.bot) / 2}) rotate(-90)`, "text-anchor": "middle" }, "centred arrival time (s)");
  // the subtraction between the two panels
  const arrow = el(fixed, "g", {});
  el(arrow, "line", { x1: 514, x2: 566, y1: B.zero, y2: B.zero, stroke: "var(--ink)", "stroke-width": 1.4 });
  el(arrow, "polygon", { points: `566,${B.zero} 557,${B.zero - 4.5} 557,${B.zero + 4.5}`, fill: "var(--ink)" });
  el(arrow, "text", { x: 540, y: B.zero - 10, "text-anchor": "middle" }).innerHTML = '− <tspan class="m">⟨d⟩</tspan>';

  const dyn = el(svg, "g", {});
  function update() {
    const t0 = parseFloat($("t0").value);
    $("t0v").textContent = t0.toFixed(1) + " s";
    dyn.innerHTML = "";
    const d = F.map((f, i) => t0 + f + EPS[i]);
    const mean = d.reduce((a, b) => a + b) / d.length;
    const dc = d.map(v => v - mean);

    // left: t0 as an arrow from zero up the time axis, the mean, stems, the picks
    if (t0 > 0.3) {
      el(dyn, "line", { x1: ARROW_X, x2: ARROW_X, y1: yA(0), y2: yA(t0) + 7, stroke: "var(--c2)", "stroke-width": 2.4 });
      el(dyn, "polygon", { points: `${ARROW_X},${yA(t0)} ${ARROW_X - 5.5},${yA(t0) + 11} ${ARROW_X + 5.5},${yA(t0) + 11}`, fill: "var(--c2)" });
      const tl = el(dyn, "text", { x: ARROW_X + 11, y: yA(t0 / 2) + 4, "font-size": 13 });
      tl.style.fill = "var(--c2)"; tl.innerHTML = T0SUB;
    }
    el(dyn, "line", { x1: A.x0 + 4, x2: A.x1, y1: yA(mean), y2: yA(mean), stroke: "var(--ink)", "stroke-width": 1.2, "stroke-dasharray": "6 4" });
    d.forEach((v, i) => {
      el(dyn, "line", { x1: cxA(i), x2: cxA(i), y1: yA(mean), y2: yA(v), stroke: "var(--ink2)", "stroke-width": 2.4 });
      el(dyn, "circle", { cx: cxA(i), cy: yA(v), r: 6, fill: "var(--ink2)", stroke: "var(--edge)", "stroke-width": 0.8 });
      el(dyn, "text", Object.assign({ x: cxA(i) + 12, y: yA(v) + (v >= mean ? -7 : 15), "font-size": 11 }, halo), v.toFixed(2));
    });
    el(dyn, "text", Object.assign({ x: A.x1 - 4, y: yA(mean) - 7, "text-anchor": "end", "font-size": 12 }, halo))
      .innerHTML = `<tspan class="m">⟨d⟩</tspan> = ${mean.toFixed(2)} s`;

    // right: the same offsets from the mean, on a zero line; they do not depend on t0
    dc.forEach((v, i) => {
      const y = yB(v), h = Math.abs(yB(v) - yB(0));
      el(dyn, "rect", { x: cxB(i) - 17, y: Math.min(y, B.zero), width: 34, height: Math.max(1, h), fill: "var(--ink2)" });
      el(dyn, "text", { x: cxB(i), y: v >= 0 ? y - 5 : y + 14, "text-anchor": "middle", "font-size": 11 }, sg(v));
    });
    const ind = el(dyn, "text", { x: B.x1 - 2, y: B.top + 8, "text-anchor": "end", "font-size": 12 });
    ind.style.fill = "var(--ink2)";
    ind.innerHTML = 'independent of <tspan class="m">t</tspan><tspan class="m" dy="3" font-size="10">0</tspan>';
  }
  $("t0").addEventListener("input", update);
  $("reset").addEventListener("click", () => { $("t0").value = T0_START; update(); });
  update();

</script>
</body>
</html>
