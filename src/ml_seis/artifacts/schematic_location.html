<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg viewBox="0 0 560 440" role="img" aria-label="Map of three seismic stations and one earthquake source">
  <defs>
    <clipPath id="clip"><rect x="90" y="14" width="380" height="380"/></clipPath>
  </defs>

  <!-- axes: 3.8 px per km, origin at px (90, 394) -->
  <rect x="90" y="14" width="380" height="380" fill="var(--bg)"/>
  <g id="rays" clip-path="url(#clip)"></g>
  <g id="stations"></g>
  <g id="source"></g>
  <rect x="90" y="14" width="380" height="380" fill="none" stroke="var(--ink2)" stroke-width="1"/>
  <g id="ticks" stroke="var(--ink2)"></g>
  <g id="ticklabels"></g>
  <text class="axis" x="280" y="432" text-anchor="middle">East <tspan class="m">x</tspan> (km)</text>
  <text class="axis" transform="translate(34 204) rotate(-90)" text-anchor="middle">North <tspan class="m">y</tspan> (km)</text>
</svg>
</div>

<script>
  // Geometry shared with the notebook (km, local frame ~ Ridgecrest-sized).
  const S = { x: 55, y: 45 };
  const ST = [
    { i: 1, x: 10, y: 20, dy: 28 },
    { i: 2, x: 90, y: 30, dy: 28 },
    { i: 3, x: 40, y: 85, dy: -18 },
  ];
  const ns = "http://www.w3.org/2000/svg";
  const px = x => 90 + 3.8 * x, py = y => 394 - 3.8 * y;
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const $ = id => document.getElementById(id);

  // Ticks point inward on all four sides: major every 20 km, minor every 10 km.
  for (let k = 0; k <= 100; k += 10) {
    const major = k % 20 === 0, len = major ? 6 : 3, w = major ? 0.8 : 0.4;
    const tk = (x1, y1, x2, y2) => el($("ticks"), "line", { x1, y1, x2, y2, "stroke-width": w });
    tk(px(k), py(0), px(k), py(0) - len);
    tk(px(k), py(100), px(k), py(100) + len);
    tk(px(0), py(k), px(0) + len, py(k));
    tk(px(100), py(k), px(100) - len, py(k));
    if (major) {
      el($("ticklabels"), "text", { class: "tick", x: px(k), y: py(0) + 18, "text-anchor": "middle" }, k);
      el($("ticklabels"), "text", { class: "tick", x: px(0) - 8, y: py(k) + 4, "text-anchor": "end" }, k);
    }
  }

  ST.forEach(s => {
    const cx = px(s.x), cy = py(s.y);
    el($("rays"), "line", { x1: px(S.x), y1: py(S.y), x2: cx, y2: cy,
      stroke: "var(--ink2)", "stroke-width": 1.4, "stroke-dasharray": "6 4" });
    el($("stations"), "polygon", { points: `${cx},${cy - 12} ${cx - 11},${cy + 8} ${cx + 11},${cy + 8}`,
      fill: "var(--c1)", stroke: "var(--edge)", "stroke-width": 0.8, "stroke-linejoin": "round" });
    const t = el($("stations"), "text", { class: "lab", x: cx, y: cy + s.dy, "text-anchor": "middle" });
    el(t, "tspan", { class: "m", "font-weight": "400" }, "ξ");               // design xi_i
    el(t, "tspan", { class: "m", dy: 3, "font-size": 10, "font-weight": "400" }, s.i);
  });

  // source star (matplotlib "*" marker proportions)
  const sx = px(S.x), sy = py(S.y), pts = [];
  for (let k = 0; k < 10; k++) {
    const rad = k % 2 ? 6.4 : 16, a = -Math.PI / 2 + k * Math.PI / 5;
    pts.push(`${sx + rad * Math.cos(a)},${sy + rad * Math.sin(a)}`);
  }
  el($("source"), "polygon", { points: pts.join(" "), fill: "var(--c2)", stroke: "var(--edge)",
    "stroke-width": 0.8, "stroke-linejoin": "round" });
  const st = el($("source"), "text", { class: "note", x: sx + 20, y: sy - 12 }, "source ");
  el(st, "tspan", { class: "m", "font-weight": "700" }, "m");                      // model m = (m_x, m_y)
</script>
</body>
