<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<div id="stage"><svg id="fig" width="1100" height="300" viewBox="0 0 1100 300"></svg></div>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const el = (tag, attrs, text, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  };
  let seed = 11;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-12)) * Math.cos(2 * Math.PI * rand());
  const CAP_Y = 26, TOP = 44, BOT = 252;

  // ---- 1. picks: three traces with a pick each
  const L1 = 70, R1 = 290, TM = 8;
  el("text", { x: L1, y: CAP_Y, class: "cap" }, "ARRIVAL TIMES");
  const arr = [2.4, 4.1, 5.6], rowH = (BOT - 18 - TOP) / 3;
  const x1 = t => L1 + (R1 - L1) * t / TM;
  arr.forEach((t0, i) => {
    const yc = TOP + rowH * (i + 0.5), amp = rowH * 0.4;
    let d = "";
    for (let k = 0; k <= 400; k++) {
      const t = TM * k / 400, s = t - t0;
      let v = 0.08 * gauss();
      if (s > 0) v += Math.exp(-s / 0.8) * Math.sin(2 * Math.PI * 2.4 * s) * (1 - Math.exp(-s * 7));
      d += (k ? "L" : "M") + x1(t).toFixed(1) + " " + (yc - amp * v).toFixed(1);
    }
    el("path", { d, fill: "none", stroke: "var(--c1)", "stroke-width": 1.2 });
    el("line", { x1: x1(t0), x2: x1(t0), y1: yc - amp, y2: yc + amp,
      stroke: "var(--c2)", "stroke-width": 1.8 });
    el("text", { x: L1 - 10, y: yc + 4, "text-anchor": "end" }, "station " + (i + 1));
  });
  el("line", { x1: L1, x2: L1, y1: TOP, y2: BOT - 18, stroke: "var(--ink)" });
  el("line", { x1: L1, x2: R1, y1: BOT - 18, y2: BOT - 18, stroke: "var(--ink)" });
  for (let t = 0; t <= TM; t += 2) {
    el("line", { x1: x1(t), x2: x1(t), y1: BOT - 18, y2: BOT - 23, stroke: "var(--ink)" });
    el("text", { x: x1(t), y: BOT - 3, "text-anchor": "middle", class: "tick" }, t);
  }
  el("text", { x: (L1 + R1) / 2, y: BOT + 20, "text-anchor": "middle" }, "time (s)");

  // ---- 2. network: 3 - 6 - 6 - 2, outlined nodes
  const sizes = [3, 6, 6, 2], NL = 400, NR = 690, midY = (TOP + BOT) / 2;
  el("text", { x: NL - 12, y: CAP_Y, class: "cap" }, "NEURAL NETWORK");
  const nx = l => NL + (NR - NL) * l / (sizes.length - 1);
  const ny = (l, j) => midY + (j - (sizes[l] - 1) / 2) * 31;
  for (let l = 0; l < sizes.length - 1; l++)
    for (let a = 0; a < sizes[l]; a++)
      for (let b = 0; b < sizes[l + 1]; b++)
        el("line", { x1: nx(l), y1: ny(l, a), x2: nx(l + 1), y2: ny(l + 1, b),
          stroke: "var(--ink2)", "stroke-width": 0.7, opacity: 0.55 });
  sizes.forEach((n, l) => { for (let j = 0; j < n; j++)
    el("circle", { cx: nx(l), cy: ny(l, j), r: 8.5, fill: "var(--bg)",
      stroke: l === 0 ? "var(--c1)" : l === sizes.length - 1 ? "var(--c2)" : "var(--ink)",
      "stroke-width": 1.5 }); });
  el("text", { x: (NL + NR) / 2, y: BOT + 20, "text-anchor": "middle" }, "learned weights");

  // ---- 3. map: boxed, stations, truth, posterior contours and samples
  const ML = 790, MR = 1050, MT = TOP, MB = BOT;
  el("text", { x: ML, y: CAP_Y, class: "cap" }, "LOCATION AND UNCERTAINTY");
  el("rect", { x: ML, y: MT, width: MR - ML, height: MB - MT, fill: "none", stroke: "var(--ink)" });
  const mx = u => ML + (MR - ML) * u, my = v => MB - (MB - MT) * v;
  for (let u = 0.1; u < 1; u += 0.1) {
    el("line", { x1: mx(u), x2: mx(u), y1: MB, y2: MB - 4, stroke: "var(--ink)" });
    el("line", { x1: mx(u), x2: mx(u), y1: MT, y2: MT + 4, stroke: "var(--ink)" });
  }
  for (let v = 0.1; v < 1; v += 0.1) {
    el("line", { x1: ML, x2: ML + 4, y1: my(v), y2: my(v), stroke: "var(--ink)" });
    el("line", { x1: MR, x2: MR - 4, y1: my(v), y2: my(v), stroke: "var(--ink)" });
  }
  const src = [0.56, 0.5];
  const st = [[0.12, 0.2], [0.18, 0.82], [0.84, 0.3]];
  // banana-ish posterior: samples bent around the source
  const pts = [];
  for (let k = 0; k < 140; k++) {
    const a = gauss() * 0.11, b = gauss() * 0.035;
    pts.push([src[0] + 0.9 * a + 0.4 * b, src[1] + 0.35 * a + 1.0 * b + 0.9 * a * a]);
  }
  pts.forEach(p => el("circle", { cx: mx(p[0]), cy: my(p[1]), r: 2.2, fill: "var(--c2)",
    opacity: 0.45 }));
  [[0.13, 0.05, 0.9], [0.22, 0.085, 0.55]].forEach(e => {
    const n = 60; let d = "";
    for (let k = 0; k <= n; k++) {
      const th = 2 * Math.PI * k / n, a = e[0] * Math.cos(th), b = e[1] * Math.sin(th);
      const u = src[0] + 0.9 * a + 0.4 * b, v = src[1] + 0.35 * a + b + 0.9 * a * a;
      d += (k ? "L" : "M") + mx(u).toFixed(1) + " " + my(v).toFixed(1);
    }
    el("path", { d: d + "Z", fill: "none", stroke: "var(--c2)", "stroke-width": 1.2,
      opacity: e[2] });
  });
  st.forEach((s, i) => {
    const x = mx(s[0]), y = my(s[1]);
    el("path", { d: `M${x} ${y - 7}L${x + 7} ${y + 5}L${x - 7} ${y + 5}Z`, fill: "var(--bg)",
      stroke: "var(--c1)", "stroke-width": 1.5 });
    el("text", { x: x + 11, y: y + 4, class: "tick" }, i + 1);
  });
  const sx = mx(src[0]), sy = my(src[1]);
  el("path", { d: `M${sx - 6} ${sy - 6}L${sx + 6} ${sy + 6}M${sx - 6} ${sy + 6}L${sx + 6} ${sy - 6}`,
    stroke: "var(--ink)", "stroke-width": 2 });
  el("text", { x: (ML + MR) / 2, y: BOT + 20, "text-anchor": "middle" }, "source location (km)");

  // ---- arrows between the panels
  const arrow = (xa, xb) => {
    el("line", { x1: xa, x2: xb, y1: midY, y2: midY, stroke: "var(--ink)", "stroke-width": 1.5 });
    el("path", { d: `M${xb - 8} ${midY - 5}L${xb} ${midY}L${xb - 8} ${midY + 5}`, fill: "none",
      stroke: "var(--ink)", "stroke-width": 1.5 });
  };
  arrow(308, 372);
  arrow(716, 770);

})();
</script>
