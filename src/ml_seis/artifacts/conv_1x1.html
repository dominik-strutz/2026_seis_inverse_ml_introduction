     Middle: the weights W, 16 x 8 (rows are frequencies). Right: the rebuilt spectrogram,
     16 frequencies x 30 time bins, W h + b at every step, which is the network's own output
     (max difference 0.0 against the model). A kernel of 1
     never looks at the neighbouring steps, so the 30 steps stay 30). Hover a step (in
     the input or the output) and a frequency (in W or the output), or use the arrow keys:
     the column of h, the row of W and the output cell turn vermillion, and the sum of 8
     products plus the bias is written out below. Shared ml_seis style

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="1100" height="335" viewBox="0 0 1100 335" role="img"
     aria-label="A convolution of kernel 1: at every step the same linear layer maps 8 channel values to 16 frequencies"></svg>
</div>

<script>

  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const rng = seed => { let s = seed; return () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5; };
  // a made-up spectrogram cell: strong at low frequency, an onset and a decaying coda
  const specValue = (c, r, cols, rows) => {
    const onset = cols * 0.18, env = c < onset ? 0.12 : Math.exp(-(c - onset) / (cols * 0.4));
    return Math.min(0.95, Math.max(0.04, (0.25 + 0.75 * Math.exp(-r / (rows * 0.35))) * env));
  };
  const specBlock = (g, x, y, w, h, cols, rows, noise, seed) => {
    const rnd = rng(seed), cw = w / cols, ch = h / rows;
    for (let c = 0; c < cols; c++) for (let r = 0; r < rows; r++)
      el(g, "rect", { x: x + c * cw, y: y + h - (r + 1) * ch, width: cw + 0.3, height: ch + 0.3, fill: "var(--c1)",
        "fill-opacity": Math.min(0.95, Math.max(0.04, specValue(c, r, cols, rows) + noise * rnd())) });
    el(g, "rect", { x, y, width: w, height: h, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
  };
