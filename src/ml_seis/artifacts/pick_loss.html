<!doctype html>
<!-- Artifact: the loss of a picker at every sample. A made-up excerpt of 10 s with a P pick at 2.5 s
     and an S pick at 6.5 s. Top: the target, a Gaussian of width sigma around each pick (segmented
     buttons: 0.1, 0.2, 0.5 s) and "neither" for the rest, so the three add to one at every sample.
     Middle: the network's answer, which you set: drag the circle at the top of a bump to move it in
     time and change its height, drag the circle on its flank to change its width. Bottom: the loss of
     every sample, l_t = -sum_c y_ct log p_ct, and the mean S over the excerpt. "p = y" puts the answer on the target: the loss is then the entropy
     of the target, the smallest it can be, and not zero. Pure illustration, no CEED data. The targets are
     built as make_pick_targets in ml_seis.waveform_data does. Shared ml_seis style
     (src/ml_seis/styles/README.md, STYLE.md): Okabe-Ito tokens, DejaVu Sans 13 px.
     Fonts are embedded by scripts/embed_artifact_fonts.py. -->

<title>Loss at every sample</title>

  #side { position: absolute; left: 836px; top: 22px; width: 246px; display: flex; flex-direction: column; }

  .seg { display: inline-flex; }
  .seg button, .btn { font: 12px "DejaVu Sans", sans-serif; color: var(--ink); background: transparent;

  .seg button { margin-left: -1px; }
  .seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .btn { border-radius: 3px; }
  .seg button:hover, .btn:hover { border-color: var(--ink); z-index: 1; position: relative; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .eq { text-align: center; margin: 2px 0 10px 0; line-height: 1.9; }
  .read { margin: 0 0 8px 0; color: var(--ink2); line-height: 1.4; }

  .mono { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums;

</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const T = 10, RATE = 100, N = T * RATE;          // excerpt (s), samples per second, samples
  const PICK = { P: 2.5, S: 6.5 };
  const SIGMAS = [0.1, 0.2, 0.5];
  const X0 = 70, X1 = 756, PLOTS = { y: { top: 38, base: 128 }, p: { top: 168, base: 258 }, l: { top: 298, base: 388 } };
  const LMAX = 6;                                    // the loss axis, nats
  const EPS = 1e-6;
  const xt = t => X0 + (t / T) * (X1 - X0);
  const tx = x => ((x - X0) / (X1 - X0)) * T;
  const yv = (plot, v, vmax = 1) => plot.base - v * (plot.base - plot.top) / vmax;
  const svg = $("fig");

  const state = { sigma: 0.2, P: null, S: null };
  const reset = () => {
    state.P = { tau: PICK.P, h: 1, w: state.sigma };
    state.S = { tau: PICK.S, h: 1, w: state.sigma };
  };
  reset();

  // three classes that add to one: P, S, neither (as make_pick_targets: neither is what is left, then normalised)
  function classes(bumpP, bumpS) {
    const n = Math.max(1 - bumpP - bumpS, 0), s = bumpP + bumpS + n;
    return [bumpP / s, bumpS / s, n / s];
  }
  const bump = (t, b) => b.h * Math.exp(-0.5 * ((t - b.tau) / b.w) ** 2);
  const target = t => classes(bump(t, { tau: PICK.P, h: 1, w: state.sigma }), bump(t, { tau: PICK.S, h: 1, w: state.sigma }));
  const answer = t => classes(bump(t, state.P), bump(t, state.S));

  const COL = ["var(--c2)", "var(--c1)", "var(--ink2)"], NAME = ["P", "S", "neither"];
  let loss, floorLoss;
  function compute() {
    loss = new Float64Array(N); floorLoss = 0;
    let sum = 0;
    for (let i = 0; i < N; i++) {
      const t = (i + 0.5) / RATE, y = target(t), p = answer(t);
      let l = 0, h = 0;
      for (let c = 0; c < 3; c++) {
        l -= y[c] * Math.log(Math.max(p[c], EPS));
        h -= y[c] * Math.log(Math.max(y[c], EPS));
      }
      loss[i] = l; sum += l; floorLoss += h;
    }
    return { S: sum / N, floor: floorLoss / N };
  }

  function axes(plot, name, label, vmax, ticks) {
    el(svg, "path", { d: `M${X0 - 4},${plot.top - 6}V${plot.base}H${X1 + 4}`, fill: "none", stroke: "var(--ink2)", "stroke-width": 1 });
    ticks.forEach(v => {
      const y = yv(plot, v, vmax);
      el(svg, "path", { d: `M${X0 - 4},${y}h4`, stroke: "var(--ink2)", "stroke-width": 1 });
      el(svg, "text", { x: X0 - 8, y: y + 4, class: "dim end" }, String(v));
    });
    el(svg, "text", { x: X0, y: plot.top - 14, class: "cap" }, name);
    if (label) {
      const t = el(svg, "text", { x: X1, y: plot.top - 14, class: "dim end" });
      if (label.sym) el(t, "tspan", { class: "m" }, label.sym);
      el(t, "tspan", {}, label.text);
    }
  }
  function line(plot, fn, col, vmax = 1, width = 1.6, dash) {
    const pts = [];
    for (let i = 0; i < N; i += 2) {
      const t = (i + 0.5) / RATE;
      pts.push(`${xt(t).toFixed(1)},${yv(plot, Math.min(fn(t), vmax), vmax).toFixed(1)}`);
    }
    el(svg, "polyline", { points: pts.join(" "), fill: "none", stroke: col, "stroke-width": width,
      "stroke-dasharray": dash || "none", "stroke-linejoin": "round" });
  }

  function draw() {
    const { S, floor } = compute();
    svg.replaceChildren();
    axes(PLOTS.y, "TARGET", { sym: "y", text: `: Gaussians of width σ = ${state.sigma} s around the picks` }, 1, [0, 1]);
    axes(PLOTS.p, "NETWORK ANSWER", { sym: "p", text: ": your setting" }, 1, [0, 1]);
    axes(PLOTS.l, "LOSS OF EACH SAMPLE", { text: loss.some(l => l > LMAX) ? "nats, clipped at 6" : "nats" }, LMAX, [0, 2, 4, 6]);
    // time axis under the loss
    for (let s = 0; s <= T; s += 2) {
      el(svg, "path", { d: `M${xt(s)},${PLOTS.l.base}v4`, stroke: "var(--ink2)", "stroke-width": 1 });
      el(svg, "text", { x: xt(s), y: PLOTS.l.base + 17, class: "dim mid" }, String(s));
    }
    el(svg, "text", { x: (X0 + X1) / 2, y: PLOTS.l.base + 34, class: "dim mid" }, "time (s)");

    // picks as thin dotted lines through all three plots
    for (const [k, t] of Object.entries(PICK)) {
      el(svg, "path", { d: `M${xt(t)},${PLOTS.y.top - 6}V${PLOTS.l.base}`, stroke: k === "P" ? "var(--c2)" : "var(--c1)",
        "stroke-width": 1, "stroke-dasharray": "1 4", opacity: 0.8 });
    }
    for (let c = 0; c < 3; c++) line(PLOTS.y, t => target(t)[c], COL[c], 1, c === 2 ? 1.1 : 1.8);
    for (let c = 0; c < 3; c++) line(PLOTS.p, t => answer(t)[c], COL[c], 1, c === 2 ? 1.1 : 1.8);
    // the class names at the right end of the target
    NAME.forEach((n, c) => el(svg, "text", { x: X1 + 8, y: PLOTS.y.base - [40, 24, 8][c], style: `fill:${COL[c]}`, "font-size": 12 }, n));

    // loss: a filled area, clipped at the top of the axis
    const area = [`${xt(0)},${PLOTS.l.base}`];
    for (let i = 0; i < N; i += 2) area.push(`${xt((i + 0.5) / RATE).toFixed(1)},${yv(PLOTS.l, Math.min(loss[i], LMAX), LMAX).toFixed(1)}`);
    area.push(`${xt(T)},${PLOTS.l.base}`);
    el(svg, "polygon", { points: area.join(" "), fill: "var(--c2)", opacity: 0.35 });
    el(svg, "polyline", { points: area.slice(1, -1).join(" "), fill: "none", stroke: "var(--c2)", "stroke-width": 1.4 });
    el(svg, "path", { d: `M${X0},${yv(PLOTS.l, S, LMAX)}H${X1}`, stroke: "var(--c2)", "stroke-width": 1, "stroke-dasharray": "5 4" });
    el(svg, "text", { x: X1 + 8, y: yv(PLOTS.l, S, LMAX) + 4, style: "fill:var(--c2)", "font-size": 12 }, "mean S");

    // handles
    [["P", state.P, "var(--c2)"], ["S", state.S, "var(--c1)"]].forEach(([k, b, col]) => {
      const top = [xt(b.tau), yv(PLOTS.p, b.h)], flank = [xt(b.tau + b.w), yv(PLOTS.p, b.h * Math.exp(-0.5))];
      el(svg, "path", { d: `M${top[0]},${top[1]}L${flank[0]},${flank[1]}`, stroke: col, "stroke-width": 1, opacity: 0.5 });
      for (const [what, [x, y], r] of [["top", top, 6], ["flank", flank, 4.5]]) {
        el(svg, "circle", { cx: x, cy: y, r, fill: what === "top" ? col : "var(--bg)", stroke: col, "stroke-width": 1.6 });
        const h = el(svg, "circle", { cx: x, cy: y, r: 24, fill: "transparent", class: "grab", "data-k": k, "data-what": what });
        h.addEventListener("pointerdown", ev => { drag = { k, what }; svg.setPointerCapture(ev.pointerId); ev.preventDefault(); });
      }
    });

    side(S, floor);
  }

  function side(S, floor) {
    $("eq").innerHTML = `<math><mi>S</mi><mo>=</mo><mfrac><mn>1</mn><mi>T</mi></mfrac><munder><mo>∑</mo><mi>t</mi></munder>
      <msub><mi>ℓ</mi><mi>t</mi></msub></math><br><math><msub><mi>ℓ</mi><mi>t</mi></msub><mo>=</mo><mo>−</mo>
      <munder><mo>∑</mo><mi>c</mi></munder><msub><mi>y</mi><mrow><mi>c</mi><mo>,</mo><mi>t</mi></mrow></msub>
      <mi>log</mi><mspace width="0.25em"/><msub><mi>p</mi><mrow><mi>c</mi><mo>,</mo><mi>t</mi></mrow></msub></math>`;
    $("S").textContent = S.toFixed(3);
    $("floor").innerHTML = `minimum <span class="mono">${floor.toFixed(3)}</span>`;
  }

  let drag = null;
  svg.addEventListener("pointermove", ev => {
    if (!drag) return;
    const pt = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    const b = state[drag.k], t = Math.max(0.3, Math.min(T - 0.3, tx(pt.x)));
    if (drag.what === "top") {
      b.tau = t;
      b.h = Math.max(0.02, Math.min(1, (PLOTS.p.base - pt.y) / (PLOTS.p.base - PLOTS.p.top)));
    } else {
      b.w = Math.max(0.03, Math.min(1.5, Math.abs(t - b.tau)));
    }
    draw();
  });
  const end = () => { drag = null; };
  svg.addEventListener("pointerup", end);
  svg.addEventListener("pointercancel", end);

  const seg = $("seg-sigma");
  SIGMAS.forEach(s => {
    const b = document.createElement("button");
    b.textContent = s; b.dataset.s = s;
    b.onclick = () => { state.sigma = s; reset(); sync(); };
    seg.appendChild(b);
  });
  $("reset").onclick = () => { reset(); draw(); };
  function sync() {
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.s) === state.sigma));
    draw();
  }
  sync();
</script>
</body>
</html>
