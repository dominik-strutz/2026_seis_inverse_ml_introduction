<!doctype html>
<!-- Artifact: mini-batches. The 1000 training events are shuffled and cut into batches of
     B; every batch is one step of the optimiser, so one epoch is ceil(1000 / B) steps.
     One slider for B, hover a batch to see its step. A small batch gives noisy steps that
     can shake the weights out of a poor local minimum, one big batch follows the exact
     gradient. Events are only drawn, shaded by their index so that the shuffle shows.
     Defaults are those of the locator playground in 1_b_learning_the_inverse_map.py
     (1000 events, B = 64). Shared ml_seis style (src/ml_seis/styles/README.md), Okabe-Ito
     tokens, DejaVu Sans 13 px. Fonts are embedded by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x290">
<title>Mini-batches</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 290px;
    transform-origin: 0 0; }
  svg { display: block; user-select: none; }
  svg text { fill: var(--ink); font-size: 12px; }
  svg .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; }
  svg .dim { fill: var(--ink2); }
  .m { font-family: "Latin Modern Roman", "Times New Roman", serif; font-style: italic;
    font-size: 1.2em; }

  #ctl { position: absolute; left: 20px; top: 14px; display: flex; align-items: center;
    gap: 12px; color: var(--ink2); font-size: 12px; }
  #ctl label { display: flex; align-items: center; gap: 10px; color: var(--ink); font-size: 13px; }
  #seg { display: flex; }
  #seg button { font: 12px "DejaVu Sans Mono", ui-monospace, monospace; color: var(--ink);
    background: transparent; border: 1px solid var(--ink2); margin-left: -1px; padding: 4px 11px;
    min-width: 40px; cursor: pointer; border-radius: 0; font-variant-numeric: tabular-nums; }
  #seg button:first-child { border-radius: 4px 0 0 4px; margin-left: 0; }
  #seg button:last-child { border-radius: 0 4px 4px 0; }
  #seg button:hover { border-color: var(--ink); position: relative; }
  #seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  svg .br { fill: none; stroke: var(--ink2); stroke-width: 1; }
  svg .brE { fill: none; stroke: var(--ink); stroke-width: 1; }

</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<script>
  const $ = id => document.getElementById(id);
  const N = 1000, X0 = 20, W = 1060;
  const OPTIONS = [1, 2, 4, 8, 16, 32, 64, 128, 256, 512, N];
  let B = 64;
  const steps = () => Math.ceil(N / B);
  const gap = () => steps() === 1 ? 0 : Math.min(16, 0.45 * W / steps());
  const cell = () => (W - (steps() - 1) * gap()) / N;
  const xOf = k => X0 + k * cell() + Math.floor(k / B) * gap();

  // a fixed shuffle (seeded), so the picture does not change between visits
  const perm = (() => {
    let seed = 7;
    const r = () => { seed = (seed + 0x6D2B79F5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
    const a = Array.from({ length: N }, (_, i) => i);
    for (let i = N - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  })();

  const shade = i => (0.14 + 0.86 * i / (N - 1)).toFixed(3);
  const rect = (x, y, w, h, i) =>
    `<rect x="${x.toFixed(2)}" y="${y}" width="${w.toFixed(2)}" height="${h}" fill="var(--c1)" fill-opacity="${shade(i)}"/>`;
  const bw = w => Math.max(w - (w > 3 ? 1 : 0), 0.7);

  function draw() {
    let a = "", b = "";
    for (let i = 0; i < N; i++) a += rect(X0 + i * W / N, 72, bw(W / N), 34, i);
    for (let k = 0; k < N; k++) b += rect(xOf(k), 160, bw(cell()), 34, perm[k]);
    $("stripA").innerHTML = a;
    $("stripB").innerHTML = b;
    hover(null);
    document.querySelectorAll("#seg button").forEach(
      e => e.classList.toggle("on", +e.dataset.b === B));
    marks();
  }

  function marks() {
    const n = steps(), y = 204;
    let g = "";
    if (n <= 128)
      for (let b = 0; b < n; b++) {
        const x0 = xOf(b * B), x1 = xOf(Math.min((b + 1) * B, N) - 1) + cell();
        g += `<path class="br" d="M${x0.toFixed(1)} ${y - 4}V${y}H${x1.toFixed(1)}V${y - 4}"/>`;
        if (n <= 16) g += `<text class="dim" x="${((x0 + x1) / 2).toFixed(1)}" y="${y + 14}" ` +
          `text-anchor="middle">step ${b + 1}</text>`;
      }
    const ye = n <= 16 ? 236 : 222;
    g += `<path class="brE" d="M${X0} ${ye - 5}V${ye}H${X0 + W}V${ye - 5}"/>` +
      `<text x="${X0 + W / 2}" y="${ye + 17}" text-anchor="middle">one epoch: ` +
      `all ${N} events seen once, in ${n} ${n === 1 ? "step" : "steps"}</text>`;
    $("marks").innerHTML = g;
  }

  function hover(b) {
    const cur = $("cur");
    if (b === null) { cur.style.display = "none"; $("hov").textContent = ""; return; }
    const first = b * B, size = Math.min(B, N - first);
    cur.style.display = "";
    cur.setAttribute("x", (xOf(first) - 2.5).toFixed(2));
    cur.setAttribute("y", 156);
    cur.setAttribute("width", (size * cell() + 5).toFixed(2));
    cur.setAttribute("height", 42);
    $("hov").textContent = `step ${b + 1} of ${steps()}: ${size} events, one update of the weights`;
  }

  const svg = $("strips");
  $("hit").addEventListener("pointermove", ev => {
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    const b = Math.floor((p.x - X0) / (B * cell() + gap()));
    hover(Math.min(Math.max(b, 0), steps() - 1));
  });
  $("hit").addEventListener("pointerleave", () => hover(null));

  $("seg").innerHTML = OPTIONS.map(o =>
    `<button data-b="${o}">${o === N ? "all" : o}</button>`).join("");
  $("seg").onclick = ev => {
    const b = ev.target.closest("button");
    if (b) { B = +b.dataset.b; draw(); }
  };
  draw();
</script>
</body>
</html>
