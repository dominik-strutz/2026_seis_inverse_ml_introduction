<!doctype html>
<!-- Artifact: the forward model F_i(m; xi) = |m - xi_i| / v and the data d_i = F_i(m) + eps_i
     (no origin time: t0 is removed by centring before it enters). Drag the source on the map,
     read F_i and d_i live. Colours link the equations, the table and the map: blue = model,
     vermillion = noise. Shared ml_seis style (src/ml_seis/styles/README.md): boxed map,
     Okabe-Ito tokens, DejaVu Sans 13 px, Latin Modern maths. Geometry, v, sigma and the initial noise
     draw match the geometry cell in 1_a_locating_with_gradients.py (torch.manual_seed(0),
     sigma * randn). Fonts are embedded by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x440">
<title>Forward model</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00; --edge: #111111;
    
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d; --edge: #0b0e14;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px;
    transform-origin: 0 0; display: flex; }
  svg { display: block; user-select: none; touch-action: none; flex: none; }
  svg text { fill: var(--ink); font-size: 11.5px; }
  svg .axis, svg .note { font-size: 13px; }
  svg .lab { font-size: 13px; }
  .m, svg .m { font-family: "Latin Modern Roman", "STIXGeneral", "Times New Roman", serif;
    font-style: italic; font-size: 1.2em; }
  math { font-family: "Latin Modern Math", "Latin Modern Math", "Cambria Math", math;
    math-style: normal; font-size: 21px; white-space: nowrap; }
  .bv { font-style: normal; font-weight: 700; }
  .cF { color: var(--c1); } .cE { color: var(--c2); }

  #side { flex: 1; min-width: 0; padding: 20px 28px 0 6px; box-sizing: border-box;
    display: flex; flex-direction: column; height: 400px; }
  .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink); margin: 0 0 6px 2px; }
  .eq { padding: 0 4px; height: 58px; display: flex; align-items: center;
    justify-content: center; margin-bottom: 14px; }
  .eq.tall { height: 86px; }
  .eq.two { gap: 28px; }

  table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; flex: none; }
  th { font-weight: 400; color: var(--ink2); text-align: right; padding: 0 12px 10px;
    white-space: nowrap; vertical-align: bottom; }
  th math { font-size: 19px; } th .u { display: block; font-size: 11px; margin-top: 1px; }
  td { text-align: right; padding: 0 12px; height: 34px; font-size: 15px;
    font-family: "DejaVu Sans Mono", ui-monospace, monospace; }
  td:first-child, th:first-child { text-align: left; padding-left: 8px; }
  td:first-child { font-family: "Latin Modern Roman", "Times New Roman", serif;
    font-size: 17px; color: var(--ink2); }
  td.F { color: var(--c1); } td.e { color: var(--c2); }
  td.d { font-weight: 700; }
  /* internal spines only: between columns and rows, no outer frame */
  th, td { border-right: 1px solid var(--ink2); border-bottom: 1px solid var(--ink2); }
  th:last-child, td:last-child { border-right: none; }
  tbody tr:last-child td { border-bottom: none; }

  #foot { margin-top: auto; padding-bottom: 2px; display: flex; align-items: center; gap: 16px;
    color: var(--ink2); font-size: 12px; }
  #foot .sp { flex: 1; }
  .chip { color: var(--ink); }
  button { font: inherit; font-size: 12px; color: var(--ink); background: transparent;
    border: 1px solid var(--ink2); border-radius: 3px; padding: 4px 11px; cursor: pointer; }
  button:hover { border-color: var(--ink); }
  #src { cursor: grab; } #src:active { cursor: grabbing; }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>
</head>
<body>
<div id="stage">
<svg id="map" width="500" height="440" viewBox="0 0 500 440" role="img"
     aria-label="Map of three stations and a draggable source">
  <!-- axes: 3.6 px per km, origin at px (80, 380) -->
  <defs><clipPath id="clip"><rect x="80" y="20" width="360" height="360"/></clipPath></defs>
  <rect x="80" y="20" width="360" height="360" fill="var(--bg)"/>
  <g id="rays" clip-path="url(#clip)"></g>
  <g id="stations"></g>
  <g id="src"></g>
  <rect x="80" y="20" width="360" height="360" fill="none" stroke="var(--ink2)" stroke-width="1"/>
  <g id="ticks" stroke="var(--ink2)"></g>
  <g id="ticklabels"></g>
  <text class="axis" x="260" y="424" text-anchor="middle">East <tspan class="m">x</tspan> (km)</text>
  <text class="axis" transform="translate(26 200) rotate(-90)" text-anchor="middle">North <tspan class="m">y</tspan> (km)</text>
</svg>

<div id="side">
  <div class="cap">Forward function</div>
  <div class="eq tall">
    <math><msub class="cF"><mi>F</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi class="bv">m</mi><mo>;</mo><mi class="bv">ξ</mi><mo stretchy="false">)</mo>
      <mo>=</mo><mfrac><mrow><mo>‖</mo><mi class="bv">m</mi><mo>−</mo><msub><mi class="bv">ξ</mi><mi>i</mi></msub><mo>‖</mo></mrow><mi>v</mi></mfrac>
      <mo>=</mo><mfrac><msqrt><mrow><msup><mrow><mo stretchy="false">(</mo><msub><mi>m</mi><mi>x</mi></msub><mo>−</mo><msub><mi>ξ</mi><mrow><mi>i</mi><mo>,</mo><mi>x</mi></mrow></msub><mo stretchy="false">)</mo></mrow><mn>2</mn></msup>
      <mo>+</mo><msup><mrow><mo stretchy="false">(</mo><msub><mi>m</mi><mi>y</mi></msub><mo>−</mo><msub><mi>ξ</mi><mrow><mi>i</mi><mo>,</mo><mi>y</mi></mrow></msub><mo stretchy="false">)</mo></mrow><mn>2</mn></msup></mrow></msqrt><mi>v</mi></mfrac></math>
  </div>

  <div class="cap">Data</div>
  <div class="eq two">
    <math><msub><mi>d</mi><mi>i</mi></msub><mo>=</mo><msub class="cF"><mi>F</mi><mi>i</mi></msub><mo stretchy="false">(</mo><mi class="bv">m</mi><mo stretchy="false">)</mo><mo>+</mo><msub class="cE"><mi>ε</mi><mi>i</mi></msub></math>
    <math><mi class="bv cE">ε</mi><mo>∼</mo><mi>𝒩</mi><mo stretchy="false">(</mo><mn class="bv">0</mn><mo>,</mo><msub><mi class="bv">C</mi><mi>D</mi></msub><mo stretchy="false">)</mo></math>
    <math><msub><mi class="bv">C</mi><mi>D</mi></msub><mo>=</mo><msup><mi>σ</mi><mn>2</mn></msup><mi class="bv">I</mi></math>
  </div>

  <table>
    <thead><tr>
      <th>station <span class="m">i</span></th>
      <th><math><msub><mi>Δ</mi><mi>i</mi></msub></math><span class="u">distance (km)</span></th>
      <th><math><msub class="cF"><mi>F</mi><mi>i</mi></msub><mo>=</mo><msub><mi>Δ</mi><mi>i</mi></msub><mo>/</mo><mi>v</mi></math><span class="u">travel time (s)</span></th>
      <th><math><msub class="cE"><mi>ε</mi><mi>i</mi></msub></math><span class="u">pick error (s)</span></th>
      <th class="d"><math><msub><mi>d</mi><mi>i</mi></msub></math><span class="u">arrival time (s)</span></th>
    </tr></thead>
    <tbody id="rows"></tbody>
  </table>

  <div id="foot">
    <span class="chip"><span class="m">v</span> = 6 km/s &nbsp;·&nbsp; <span class="m">σ</span> = 0.1 s</span>
    <span>drag the star to move the source</span>
    <span class="sp"></span>
    <button id="redraw">draw new noise</button>
  </div>
</div>
</div>

<script>
  // Geometry shared with the notebook (km, local frame ~ Ridgecrest-sized).
  const V = 6, SIGMA = 0.1;
  const ST = [
    { i: 1, x: 10, y: 20, dy: 28 },
    { i: 2, x: 90, y: 30, dy: 28 },
    { i: 3, x: 40, y: 85, dy: -18 },
  ];
  let m = { x: 55, y: 45 };
  let eps = [0.1541, -0.0293, -0.2179];     // notebook draw: torch.manual_seed(0)
  const ns = "http://www.w3.org/2000/svg";
  const px = x => 80 + 3.6 * x, py = y => 380 - 3.6 * y;
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const $ = id => document.getElementById(id);
  const halo = { "paint-order": "stroke", stroke: "var(--bg)", "stroke-width": 4, "stroke-linejoin": "round" };

  // Ticks point inward on all four sides: major every 20 km, minor every 10 km.
  for (let k = 0; k <= 100; k += 10) {
    const major = k % 20 === 0, len = major ? 6 : 3, w = major ? 0.8 : 0.4;
    const tk = (x1, y1, x2, y2) => el($("ticks"), "line", { x1, y1, x2, y2, "stroke-width": w });
    tk(px(k), py(0), px(k), py(0) - len);
    tk(px(k), py(100), px(k), py(100) + len);
    tk(px(0), py(k), px(0) + len, py(k));
    tk(px(100), py(k), px(100) - len, py(k));
    if (major) {
      el($("ticklabels"), "text", { x: px(k), y: py(0) + 18, "text-anchor": "middle" }, k);
      el($("ticklabels"), "text", { x: px(0) - 8, y: py(k) + 4, "text-anchor": "end" }, k);
    }
  }

  ST.forEach(s => {
    const cx = px(s.x), cy = py(s.y);
    el($("stations"), "polygon", { points: `${cx},${cy - 12} ${cx - 11},${cy + 8} ${cx + 11},${cy + 8}`,
      fill: "var(--c1)", stroke: "var(--edge)", "stroke-width": 0.8, "stroke-linejoin": "round" });
    const t = el($("stations"), "text", Object.assign({ class: "lab", x: cx, y: cy + s.dy, "text-anchor": "middle" }, halo));
    el(t, "tspan", { class: "m" }, "ξ");
    el(t, "tspan", { class: "m", dy: 3, "font-size": 10 }, s.i);
  });

  // one ray per station, with its travel time written along it
  const rayLines = ST.map(() => el($("rays"), "line", { stroke: "var(--ink2)", "stroke-width": 1.4,
    "stroke-dasharray": "6 4" }));
  const rayLabels = ST.map(s => {
    const t = el($("rays"), "text", Object.assign({ "text-anchor": "middle", "font-size": 12 }, halo));
    el(t, "tspan", { class: "m", fill: "var(--c1)" }, "F");
    el(t, "tspan", { class: "m", dy: 3, "font-size": 9 }, s.i);
    return el(t, "tspan", { dy: -3 }, "");
  });

  // source star (matplotlib "*" marker proportions), drawn at the origin and translated
  const pts = [];
  for (let k = 0; k < 10; k++) {
    const rad = k % 2 ? 6.4 : 16, a = -Math.PI / 2 + k * Math.PI / 5;
    pts.push(`${rad * Math.cos(a)},${rad * Math.sin(a)}`);
  }
  el($("src"), "circle", { r: 24, fill: "transparent" });                      // generous grab area
  el($("src"), "polygon", { points: pts.join(" "), fill: "var(--c2)", stroke: "var(--edge)",
    "stroke-width": 0.8, "stroke-linejoin": "round" });
  const srcLab = el($("src"), "text", Object.assign({ class: "note", x: 20, y: -12 }, halo), "source ");
  el(srcLab, "tspan", { class: "m", "font-weight": "700" }, "m");

  const f2 = x => x.toFixed(2), sgn = x => (x < 0 ? "−" : "+") + Math.abs(x).toFixed(2);
  function update() {
    $("src").setAttribute("transform", `translate(${px(m.x)} ${py(m.y)})`);
    let rows = "";
    ST.forEach((s, k) => {
      const D = Math.hypot(m.x - s.x, m.y - s.y), F = D / V, d = F + eps[k];
      const x1 = px(m.x), y1 = py(m.y), x2 = px(s.x), y2 = py(s.y);
      const ln = rayLines[k];
      ln.setAttribute("x1", x1); ln.setAttribute("y1", y1); ln.setAttribute("x2", x2); ln.setAttribute("y2", y2);
      // label centred on the ray, rotated along it, never upside down, lifted off the line
      let a = Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI;
      if (a > 90 || a < -90) a += 180;
      rayLabels[k].parentNode.setAttribute("transform",
        `translate(${(x1 + x2) / 2} ${(y1 + y2) / 2}) rotate(${a}) translate(0 -8)`);
      rayLabels[k].textContent = ` = ${f2(F)} s`;
      rows += `<tr><td>${s.i}</td><td>${D.toFixed(1)}</td><td class="F">${f2(F)}</td>` +
              `<td class="e">${sgn(eps[k])}</td><td class="d">${f2(d)}</td></tr>`;
    });
    $("rows").innerHTML = rows;
  }

  // drag the source: pointer position -> km through the svg's own transform (stage is scaled)
  const svg = $("map");
  function move(ev) {
    const p = new DOMPoint(ev.clientX, ev.clientY).matrixTransform(svg.getScreenCTM().inverse());
    m = { x: Math.min(100, Math.max(0, (p.x - 80) / 3.6)), y: Math.min(100, Math.max(0, (380 - p.y) / 3.6)) };
    update();
  }
  $("src").addEventListener("pointerdown", ev => {
    $("src").setPointerCapture(ev.pointerId); move(ev);
    const up = () => { $("src").removeEventListener("pointermove", move); $("src").removeEventListener("pointerup", up); };
    $("src").addEventListener("pointermove", move); $("src").addEventListener("pointerup", up);
  });

  // Box-Muller draw of N(0, sigma^2)
  $("redraw").addEventListener("click", () => {
    eps = ST.map(() => SIGMA * Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random()));
    update();
  });

  update();
</script>
</body>
</html>
