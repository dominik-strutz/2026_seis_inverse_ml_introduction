<!doctype html>
<!-- Artifact: max-pooling of a feature map. A toy feature map of 24 units (after the filter and
     the ReLU) is cut into groups of p neighbours and only the largest value of each group is
     kept, so the map gets p times shorter and each remaining unit stands for p input units.
     Hover a group (or press left and right): its units are shaded, the winner turns
     vermillion and moves to the shortened map below. Same operation as nn.MaxPool1d(p) in
     WaveformCNN in 2_a_filters_on_waveforms.py. The numbers are made up. Shared ml_seis
     style (src/ml_seis/styles/README.md, STYLE.md): Okabe-Ito tokens, DejaVu Sans 13 px,
     Latin Modern maths. Fonts are embedded by scripts/embed_artifact_fonts.py. -->

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x440">
<title>Max-pooling</title>
<style>

    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;

  }
  @media (prefers-color-scheme: dark) {

    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px;
    transform-origin: 0 0; }

  svg text { fill: var(--ink); font-size: 12px; }

  svg .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; }
  svg .mid { text-anchor: middle; }

  math { font-family: "Latin Modern Math", "Cambria Math", math; math-style: normal;
    font-size: 20px; white-space: nowrap; }

  #side { position: absolute; left: 826px; top: 26px; width: 250px; display: flex;
    flex-direction: column; }
  .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink); margin: 0 0 10px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 22px; }
  .seg { display: inline-flex; }
  .seg button { font: 12px "DejaVu Sans", sans-serif; color: var(--ink); background: transparent;

  .seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button:hover { border-color: var(--ink); z-index: 1; position: relative; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .eq { text-align: center; margin: 0 0 24px 0; }
  .read { margin: 0 0 12px 0; color: var(--ink2); line-height: 1.45; }
  .read b { color: var(--ink); font-weight: 400; font-family: "DejaVu Sans Mono", ui-monospace, monospace;

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>
</head>
<body>
<div id="stage">
<svg id="fig" width="810" height="440" viewBox="0 0 810 440" role="img" tabindex="0"
     aria-label="A feature map before and after max-pooling"></svg>
<div id="side">
  <div class="cap">Max-pooling</div>
  <div class="row"><span>window <span class="m">p</span></span><span class="seg" id="seg-p"></span></div>
  <div class="eq" id="eq"></div>
  <p class="read" id="r1"></p>
  <p class="read" id="r2"></p>
</div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const N = 24, PITCH = 30, X0 = 52, BAR = 22;            // units, column pitch, left edge, bar width
  const A = { top: 52, base: 168 }, B = { top: 252, base: 368 };   // the two plots: top and zero line
  const SIZES = [2, 3, 4, 6];
  const fmap = Array.from({ length: N }, (_, i) => {       // a made-up feature map after ReLU
    const bump = (c, w, a) => a * Math.exp(-(((i - c) / w) ** 2));
    const wob = 0.12 * Math.abs(Math.sin(i * 2.3 + 0.7)) + 0.06 * Math.abs(Math.sin(i * 5.1));
    return Math.max(0, bump(5.5, 1.8, 0.95) + bump(15, 2.6, 0.62) + bump(20.5, 1.2, 0.34) + wob - 0.05);
  });
  const state = { p: 4, g: 1 };
  const svg = $("fig");

  const ymap = (plot, v) => plot.base - v * (plot.base - plot.top) / 1.05;
  function draw() {
    const { p } = state, G = N / p;
    state.g = Math.min(state.g, G - 1);
    const g = state.g;
    svg.replaceChildren();
    const wins = Array.from({ length: G }, (_, j) => {
      const idx = Array.from({ length: p }, (_, k) => j * p + k);
      return idx.reduce((best, i) => (fmap[i] > fmap[best] ? i : best), idx[0]);
    });
    const xc = i => X0 + (i + 0.5) * PITCH;

    // captions and axes
    el(svg, "text", { x: X0, y: 28, class: "cap" }, "BEFORE POOLING");
    el(svg, "text", { x: X0 + N * PITCH, y: 28, class: "dim end" }, `${N} units`);
    el(svg, "text", { x: X0, y: 228, class: "cap" }, "AFTER POOLING");
    el(svg, "text", { x: X0 + N * PITCH, y: 228, class: "dim end" }, `${G} units`);
    for (const plot of [A, B]) {
      const l = X0 - 4, r = X0 + N * PITCH + 4;
      el(svg, "path", { d: `M${l},${plot.top - 6}V${plot.base}H${r}`, fill: "none",
        stroke: "var(--ink2)", "stroke-width": 1 });
      el(svg, "path", { d: `M${l},${plot.top}h4`, stroke: "var(--ink2)", "stroke-width": 1 });
      el(svg, "text", { x: l - 6, y: plot.top + 4, class: "dim end" }, "1");
      el(svg, "text", { x: l - 6, y: plot.base + 4, class: "dim end" }, "0");
    }
    el(svg, "text", { x: X0 + N * PITCH / 2, y: 196, class: "dim mid" }, "time (units of the feature map)");
    el(svg, "text", { x: X0 + N * PITCH / 2, y: 396, class: "dim mid" }, "time (one unit = " + p + " units above)");

    // the chosen group: shaded in the top plot, a band down to the bottom plot
    const gx0 = X0 + g * p * PITCH, gw = p * PITCH;
    el(svg, "rect", { x: gx0, y: A.top - 6, width: gw, height: A.base - A.top + 6, fill: "var(--c1)",
      opacity: 0.13 });
    el(svg, "rect", { x: gx0, y: B.top - 6, width: gw, height: B.base - B.top + 6, fill: "var(--c1)",
      opacity: 0.13 });
    const wx = xc(wins[g]), ox = gx0 + gw / 2;
    el(svg, "path", { d: `M${wx},${A.base + 8}L${ox},${B.top - 8}`,
      fill: "none", stroke: "var(--c2)", "stroke-width": 1, "stroke-dasharray": "3 3" });

    // before: every unit; each group's winner is solid, the rest outlined
    fmap.forEach((v, i) => {
      const j = Math.floor(i / p), won = wins[j] === i, hot = j === g;
      const y = ymap(A, v);
      el(svg, "rect", { x: xc(i) - BAR / 2, y, width: BAR, height: Math.max(A.base - y, 1),
        fill: won ? (hot ? "var(--c2)" : "var(--c1)") : "none",
        stroke: won ? (hot ? "var(--c2)" : "var(--c1)") : (hot ? "var(--c2)" : "var(--c1)"),
        "stroke-width": 1, opacity: won || hot ? 1 : 0.55 });
    });
    // group boundaries, as ticks under the axis
    for (let j = 0; j <= G; j++) {
      const x = X0 + j * p * PITCH;
      el(svg, "path", { d: `M${x},${A.base}v5M${x},${B.base}v5`, stroke: "var(--ink2)", "stroke-width": 1 });
    }
    // after: the winners, each as wide as its group
    wins.forEach((i, j) => {
      const hot = j === g, y = ymap(B, fmap[i]), w = p * PITCH - 8;
      el(svg, "rect", { x: X0 + j * p * PITCH + 4, y, width: w, height: Math.max(B.base - y, 1),
        fill: hot ? "var(--c2)" : "var(--c1)", opacity: hot ? 1 : 0.85 });
    });
    // hit areas: a whole group column in either plot
    for (let j = 0; j < G; j++) {
      const r = el(svg, "rect", { x: X0 + j * p * PITCH, y: 36, width: p * PITCH, height: 340,
        fill: "transparent", style: "cursor:pointer" });
      const pick = () => { if (state.g !== j) { state.g = j; draw(); } };
      r.addEventListener("pointerenter", pick);
      r.addEventListener("pointerdown", pick);
    }

    // side panel
    $("eq").innerHTML = `<math><msub><mrow><msup><mi>h</mi><mo>′</mo></msup></mrow><mi>j</mi></msub><mo>=</mo>
      <munder><mi>max</mi><mrow><mi>i</mi><mo>∈</mo><mtext>group </mtext><mi>j</mi></mrow></munder>
      <msub><mi>h</mi><mi>i</mi></msub></math>`;
    $("r1").innerHTML = `Each group of <b>${p}</b> neighbours keeps its largest value:
      <b>${N}</b> units become <b>${G}</b>.`;
    $("r2").innerHTML = `A filter of length 3 on the short map spans <b>${3 * p}</b> units of the long one.`;
  }

  const seg = $("seg-p");
  SIZES.forEach(p => {
    const b = document.createElement("button");
    b.textContent = p; b.dataset.p = p;
    b.onclick = () => { state.p = p; state.g = Math.min(state.g, N / p - 1); sync(); };
    seg.appendChild(b);
  });
  function sync() {
    seg.querySelectorAll("button").forEach(b => b.classList.toggle("on", Number(b.dataset.p) === state.p));
    draw();
  }
  svg.addEventListener("keydown", e => {
    const G = N / state.p;
    if (e.key === "ArrowRight") state.g = Math.min(state.g + 1, G - 1);
    else if (e.key === "ArrowLeft") state.g = Math.max(state.g - 1, 0);
    else return;
    e.preventDefault(); draw();
  });
  sync();
</script>
</body>
</html>
