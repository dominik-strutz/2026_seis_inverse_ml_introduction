<!doctype html>
<!-- Artifact: how far one unit of a one-dimensional CNN can see (its receptive field). A toy
     record of 64 samples goes through up to four conv blocks (filter length K, same
     padding) with a max-pool of window p between them and an average over time at the end,
     the same pattern as WaveformCNN in lecture_02_learning_from_waveforms.py. Layers run
     left to right, time runs down. One box is one unit: the answer of one filter at one
     moment. The big number above each stack is its number of channels (filters); the stack
     of sheets grows with it. Hover a unit (or step with the arrow keys: left and right
     change the layer, up and down the unit): the units it depends on are shaded in every
     layer to its left and the cone is drawn as two rays. A layer adds (window - 1) x spacing to what its
     units see, the recurrence of ml_seis.waveform_metrics.receptive_field. Shared ml_seis style
     (src/ml_seis/styles/README.md): Okabe-Ito tokens, DejaVu Sans 13 px, Latin Modern
     maths. Fonts are embedded by scripts/embed_artifact_fonts.py. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="artifact-size" content="1100x480">
<title>Receptive field of a CNN</title>
<style>
  :root {
    --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --grid: #d9dde4;
    --c1: #0072b2; --c2: #d55e00; --c3: #009e73; --edge: #111111;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --grid: #364052;
      --c1: #56b4e9; --c2: #ff8a4d; --c3: #3ddc97; --edge: #0b0e14;
    }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 480px;
    transform-origin: 0 0; }
  #fig { position: absolute; left: 0; top: 0; user-select: none; touch-action: none; }
  svg text { fill: var(--ink); font-size: 12px; }
  svg .lab { text-anchor: middle; }
  svg .chan { font-family: "DejaVu Sans Mono", ui-monospace, monospace; font-size: 22px;
    text-anchor: middle; font-variant-numeric: tabular-nums; }
  svg .dim { fill: var(--ink2); }
  svg .axis { font-size: 13px; }
  .m, svg .m { font-family: "Latin Modern Roman", "STIXGeneral", "Times New Roman", serif;
    font-style: italic; font-size: 1.2em; }
  .c1 { color: var(--c1); } .c2 { color: var(--c2); }

  #side { position: absolute; left: 810px; top: 26px; width: 270px; height: 430px;
    display: flex; flex-direction: column; }
  .cap { font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    color: var(--ink); margin: 0 0 8px 0; }
  .row { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .seg { display: inline-flex; }
  .seg button { font: 12px "DejaVu Sans", sans-serif; color: var(--ink); background: transparent;
    border: 1px solid var(--ink2); padding: 3px 10px; margin-left: -1px; cursor: pointer; }
  .seg button:first-child { margin-left: 0; border-radius: 3px 0 0 3px; }
  .seg button:last-child { border-radius: 0 3px 3px 0; }
  .seg button:hover { border-color: var(--ink); z-index: 1; position: relative; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .block { margin-bottom: 20px; }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="800" height="480" viewBox="0 0 800 480" role="img" tabindex="0"
     aria-label="Stacked convolution and pooling layers with the receptive field of a unit"></svg>

<div id="side">
  <div class="cap">Network</div>
  <div class="block" style="margin-bottom:14px">
    <div class="row"><span>filter length <span class="m">K</span></span><span class="seg" id="seg-k"></span></div>
    <div class="row"><span>max-pool window <span class="m">p</span></span><span class="seg" id="seg-p"></span></div>
    <div class="row"><span>conv blocks</span><span class="seg" id="seg-b"></span></div>
  </div>
</div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const plural = (n, w) => `${n} ${w}${n === 1 ? "" : "s"}`;
  const P = window.ARTIFACT || {};
  const RATE = P.rate || 50;     // Hz
  const N = 64;                  // samples of the toy record
  const BASE = P.base || 16;     // filters of block 1, doubled twice, then kept
  const XL = 112, PX = 80, CELL = 24;          // left edge of column 0, column pitch, box width
  const Y0 = 70, H = 336, U = H / N;           // time runs down: top of the record, its height, px per sample
  // receptive field after `blocks` conv blocks of length k with max-pool window p between them
  function fieldOf(k, p, blocks) {
    let R = 1, step = 1;
    for (let b = 1; b <= blocks; b++) {
      R += (k - 1) * step;
      if (b < blocks && p > 1) { R += (p - 1) * step; step *= p; }
    }
    return R;
  }

  // the real network: from layer_spec in the notebook, else K = 9, p = 4, 4 blocks
  const OURS = (() => {
    const L = P.layers;
    if (L) {
      const convs = L.filter(l => l.kind === "conv"), pools = L.filter(l => l.kind === "pool");
      return { k: convs[0].kernel, p: pools.length ? pools[0].kernel : 1, blocks: convs.length,
        field: convs[convs.length - 1].field, record: P.record_samples || L[0].length };
    }
    return { k: 9, p: 4, blocks: 4, field: fieldOf(9, 4, 4), record: P.record_samples || 3008 };
  })();
  const options = (base, extra) => Array.from(new Set([...base, extra])).sort((a, b) => a - b);

  // start as simple as possible: one convolution, one pooling, and look at the pooled unit
  const state = { k: 3, p: 2, blocks: 1, pick: null, name: "max-pool 1", cx: N / 2 };

  // layers from the input upwards; `step` = input samples between neighbouring units
  function build({ k, p, blocks }) {
    const layers = [{ kind: "input", name: "input", L: N, step: 1, R: 1, filters: 1 }];
    let L = N, step = 1, R = 1, filters = 1;
    for (let b = 1; b <= blocks; b++) {
      filters = BASE * Math.min(4, 2 ** (b - 1));
      const conv = { kind: "conv", name: `conv ${b}`, L, step, stepIn: step, Rin: R, win: k, filters };
      R += (k - 1) * step;
      layers.push({ ...conv, R });
      // pool between blocks; a single block also gets one, to show what pooling does alone
      if ((b < blocks || blocks === 1) && p > 1) {
        const pool = { kind: "pool", name: `max-pool ${b}`, stepIn: step, Rin: R, win: p, filters };
        R += (p - 1) * step; step *= p; L = Math.floor(L / p);
        layers.push({ ...pool, L, step, R });
      }
    }
    layers.push({ kind: "avg", name: "average over time", L: 1, step: N, R: N, filters, win: L });
    return layers;
  }

  // the interval of units of layer i-1 that unit [a, b] of layer i depends on
  function below(layers, i, a, b) {
    const lay = layers[i], prev = layers[i - 1];
    if (lay.kind === "conv") {
      const h = (lay.win - 1) / 2;
      return [Math.max(0, a - h), Math.min(prev.L - 1, b + h)];
    }
    if (lay.kind === "pool") return [a * lay.win, Math.min(prev.L - 1, b * lay.win + lay.win - 1)];
    return [0, prev.L - 1];
  }
  function cone(layers, i, j) {
    const out = new Array(layers.length).fill(null);
    let iv = [j, j];
    out[i] = iv;
    for (let l = i; l >= 1; l--) { iv = below(layers, l, iv[0], iv[1]); out[l - 1] = iv; }
    return out;
  }

  const colX = i => XL + i * PX;                    // left edge of column i
  // pooling is drawn narrower and in green: it keeps and drops, it has no filters
  const boxW = lay => lay.kind === "pool" ? 14 : CELL;
  const left = (l, i) => colX(i) + (CELL - boxW(l)) / 2, right = (l, i) => left(l, i) + boxW(l);
  const tone = lay => lay.kind === "pool" ? "var(--c3)" : "var(--ink2)";
  const yOf = (lay, u) => Y0 + u * lay.step * U;     // top edge of unit u of a layer
  // a made-up record: noise, then a P-like onset with a decaying oscillation
  function trace() {
    let s = 7; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5;
    return Array.from({ length: N }, (_, t) => {
      const q = t - 24;
      return 0.5 * rnd() + (q > 0 ? 3.2 * Math.exp(-q / 14) * Math.sin(q * 1.05) : 0);
    });
  }
  const TRACE = trace();

  let layers = build(state);
  const cols = [];               // [layer] -> the channel number and the name of the column
  const cells = [];              // [layer][unit] -> rect
  const fig = $("fig");
  let rays = null;

  function draw() {
    fig.innerHTML = "";
    cells.length = 0; cols.length = 0;
    layers = build(state);
    const g = el(fig, "g", {});
    const key = el(g, "text", { class: "dim", x: XL, y: 16 });
    [["selected unit", "var(--c2)"], [" and ", ""], ["the input it depends on", "var(--c1)"]].forEach(([s, c]) => {
      el(key, "tspan", c ? { style: `fill: ${c}` } : {}, s);
    });
    el(g, "text", { class: "dim", x: 8, y: 42 }, "filters");
    layers.forEach((lay, i) => {
      const x = left(lay, i), bw = boxW(lay), w = lay.step * U, len = lay.L * w;
      if (lay.kind !== "input") {      // a deck: one sheet per 8 filters, only their visible edges are drawn
        const sheets = lay.filters / 8, dx = 2.5, dy = 2;
        for (let k = sheets; k >= 1; k--)
          el(g, "path", { d: `M${x + dx * k},${Y0 - dy * k + len} V${Y0 - dy * k} H${x + bw + dx * k} V${Y0 + len - dy * k}`,
            fill: "none", stroke: tone(lay), "stroke-width": 1, opacity: 0.7 });
        el(g, "text", { class: "dim lab", x: x + CELL / 2 + dx * sheets / 2, y: Y0 + H + 40 },
          `${lay.filters} filters`);
      }
      const row = [];
      for (let j = 0; j < lay.L; j++)
        row.push(el(g, "rect", { x: x, y: Y0 + j * w + 0.75, width: bw, height: w - 1.5, rx: 1.5,
          fill: "none", stroke: tone(lay), "stroke-width": 1, "pointer-events": "none" }));
      cells.push(row);
      const cx = x + CELL / 2;
      const ch = el(g, "text", { class: "chan", x: cx, y: 42 }, lay.filters);
      const nm = el(g, "text", { class: "lab", x: cx, y: Y0 + H + 24 },
        lay.kind === "avg" ? "average" : lay.name);
      cols.push([ch, nm]);
      if (lay.kind === "pool") nm.setAttribute("data-pool", "1");
    });
    // the record drawn over the input column
    const cx0 = colX(0) + CELL / 2;
    const pts = TRACE.map((v, t) => `${cx0 + 3.4 * v},${Y0 + (t + 0.5) * U}`).join(" ");
    el(g, "polyline", { points: pts, fill: "none", stroke: "var(--ink)", "stroke-width": 1,
      "pointer-events": "none" });
    // time axis left of the input: inward ticks every 8 samples, labels every 16
    const xa = XL - 22;
    el(g, "line", { x1: xa, x2: xa, y1: Y0, y2: Y0 + H, stroke: "var(--ink2)" });
    for (let t = 0; t <= N; t += 8) {
      const major = t % 16 === 0, yy = Y0 + t * U;
      el(g, "line", { x1: xa, x2: xa + (major ? 6 : 3), y1: yy, y2: yy, stroke: "var(--ink2)" });
      if (major) el(g, "text", { class: "dim", x: xa - 6, y: yy + 4, "text-anchor": "end" }, t);
    }
    el(g, "text", { class: "axis", x: 40, y: Y0 + H / 2, "text-anchor": "middle",
      transform: `rotate(-90 40 ${Y0 + H / 2})` },
      `input sample (${N} = ${(N / RATE).toFixed(1)} s)`);
    el(g, "text", { class: "dim", x: XL, y: 466 }, "hover a box or press the arrow keys");
    rays = el(g, "g", { "pointer-events": "none" });
    const keep = layers.findIndex(l => l.name === state.name);
    const i = keep >= 0 ? keep : 1;
    highlight(i, unitOfCentre(i, state.cx), true);
  }

  const unitOfCentre = (i, cx) => {
    const lay = layers[i];
    return lay.kind === "avg" ? 0 : Math.min(lay.L - 1, Math.max(0, Math.floor(cx / lay.step)));
  };

  // the cone of the selected unit: two rays along the edges of the shaded windows
  function drawRays(iv, i) {
    rays.innerHTML = "";
    [0, 1].forEach(side => {
      const edge = l => side === 0 ? yOf(layers[l], iv[l][0]) : yOf(layers[l], iv[l][1] + 1);
      let d = `M${left(layers[i], i)},${edge(i)}`;
      for (let l = i - 1; l >= 0; l--) d += ` L${right(layers[l], l)},${edge(l)} H${left(layers[l], l)}`;
      el(rays, "path", { d, fill: "none", stroke: "var(--c1)", "stroke-width": 1.1 });
    });
  }

  function highlight(i, j, keepCx) {
    const lay = layers[i];
    state.pick = [i, j]; state.name = lay.name;
    if (!keepCx) state.cx = lay.kind === "avg" ? N / 2 : (j + 0.5) * lay.step;
    const iv = cone(layers, i, j);
    cells.forEach((row, l) => row.forEach((r, u) => {
      const inside = iv[l] && u >= iv[l][0] && u <= iv[l][1];
      const sel = l === i && u === j;
      r.setAttribute("fill", sel ? "var(--c2)" : inside ? "var(--c1)" : "none");
      r.setAttribute("fill-opacity", sel ? 1 : 0.28);
      r.setAttribute("stroke", sel ? "var(--c2)" : inside ? "var(--c1)" : tone(layers[l]));
    }));
    drawRays(iv, i);
    cols.forEach((c, l) => c.forEach(t => t.setAttribute("style", l === i ? "fill: var(--c2)"
      : t.dataset.pool ? "fill: var(--c3)" : "")));
  }

  function seg(id, values, key, labels) {
    const box = $(id); box.innerHTML = "";
    values.forEach((v, i) => {
      const b = document.createElement("button");
      b.textContent = labels ? labels[i] : v; b.className = state[key] === v ? "on" : "";
      b.onclick = () => { state[key] = v; seg(id, values, key, labels); draw(); };
      box.appendChild(b);
    });
  }
  const K_OPTIONS = options([3, 5, 9], OURS.k), P_OPTIONS = options([1, 2, 3, 4], OURS.p);
  const B_OPTIONS = options([1, 2, 3, 4], OURS.blocks);
  function controls() {
    seg("seg-k", K_OPTIONS, "k");
    seg("seg-p", P_OPTIONS, "p", P_OPTIONS.map(v => v === 1 ? "none" : v));
    seg("seg-b", B_OPTIONS, "blocks");
  }
  // hover and keys: the pointer picks a unit from the whole column band, not from the thin box
  function unitAt(e) {
    const m = fig.getScreenCTM(); if (!m) return null;
    const pt = new DOMPoint(e.clientX, e.clientY).matrixTransform(m.inverse());
    const i = Math.round((pt.x - XL - CELL / 2) / PX);
    if (i < 0 || i >= layers.length || Math.abs(pt.x - (colX(i) + CELL / 2)) > PX / 2 - 4) return null;
    const lay = layers[i];
    if (pt.y > Y0 + H + 6) return [i, unitOfCentre(i, state.cx), true];        // the column name
    if (pt.y < Y0) return null;
    const j = lay.kind === "avg" ? 0 : Math.floor((pt.y - Y0) / (lay.step * U));
    return j >= 0 && j < lay.L ? [i, j, false] : null;
  }
  const same = (u) => u[0] === state.pick[0] && u[1] === state.pick[1];
  fig.addEventListener("pointermove", e => { const u = unitAt(e); if (u && !same(u)) highlight(u[0], u[1], u[2]); });
  fig.addEventListener("pointerdown", e => {
    fig.focus({ preventScroll: true });
    const u = unitAt(e); if (u) highlight(u[0], u[1], u[2]);
  });
  fig.style.cursor = "pointer";
  function climb(d) {
    const i = Math.min(layers.length - 1, Math.max(0, state.pick[0] + d));
    highlight(i, unitOfCentre(i, state.cx), true);
  }
  function slide(d) {
    const [i, j] = state.pick, lay = layers[i];
    highlight(i, Math.min(lay.L - 1, Math.max(0, j + d)), false);
  }
  document.addEventListener("keydown", e => {
    const f = { ArrowRight: () => climb(1), ArrowLeft: () => climb(-1),
      ArrowUp: () => slide(-1), ArrowDown: () => slide(1) }[e.key];
    if (f) { e.preventDefault(); f(); }
  });

  controls(); draw();
</script>
</body>
</html>
