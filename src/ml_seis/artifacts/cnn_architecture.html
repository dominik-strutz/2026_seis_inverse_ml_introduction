<!doctype html>
<!-- Artifact: the whole WaveformCNN of lecture_02_learning_from_waveforms.py drawn as slabs
     (height = samples in time, width = number of filters), from the waveform to the logits
     and the probabilities, with a plain-language explanation of every step above the slabs
     and a parameter table on the right. Hover or click a slab (or a table row) to select a
     step; the explanation gives what the step does, its parameters and the PyTorch
     line. The controls are the notebook's own: filters in block 1 (base), filter length
     (kernel) and the number of logits. window.ARTIFACT {layers, base, kernel, n_out, params,
     rate, record_samples} comes from the notebook: layers from
     ml_seis.waveform_metrics.layer_spec (so blocks, pooling and lengths are the model's),
     params from PyTorch for the check against the table. Without them the figure draws the
     default WaveformCNN. The decoder, skip connections and per-sample output of the
     autoencoder and U-Net live in unet_architecture.html. Shared ml_seis style
     (src/ml_seis/styles/README.md): Okabe-Ito tokens, DejaVu Sans 13 px. Fonts are
     embedded by scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="800" height="480" viewBox="0 0 800 480" role="img"
     aria-label="The WaveformCNN as a row of slabs from waveform to answer"></svg>

<div id="side">
  <div class="cap">Settings</div>
  <div class="row"><span>filters in block 1</span><span class="seg" id="seg-base"></span></div>
  <div class="row"><span>filter length <span class="m">K</span></span><span class="seg" id="seg-kernel"></span></div>
  <div class="row"><span>outputs</span><span class="seg" id="seg-out"></span></div>

  <div class="cap" style="margin-top:22px">Parameters</div>
  <table id="tab"></table>
  <div id="check"></div>
</div>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const fmt = n => n.toLocaleString("en-US");
  const P = window.ARTIFACT || {};
  const RATE = P.rate || 50;
  const T = P.record_samples || 3008;                // samples of a Llaima record

  // the model's layers, from layer_spec in the notebook; else the default WaveformCNN
  function defaultSpec() {
    const spec = []; let L = T;
    [1, 2, 4, 4].forEach((m, i) => {
      if (i) { L = Math.floor(L / 4); spec.push({ kind: "pool", kernel: 4, filters: 16 * [1, 2, 4, 4][i - 1], length: L }); }
      spec.push({ kind: "conv", kernel: 9, filters: 16 * m, length: L });
    });
    spec.push({ kind: "avg", filters: 64, length: 1 });
    return spec;
  }
  const SPEC = P.layers || defaultSpec();
  const BLOCKS = [];                                  // one per conv: its pool before it, filter ratio, length
  let pending = null;
  SPEC.forEach(l => {
    if (l.kind === "pool") pending = l;
    else if (l.kind === "conv") {
      BLOCKS.push({ pool: pending, mult: l.filters / SPEC[0].filters, L: l.length });
      pending = null;
    }
  });
  const state = { base: P.base || SPEC[0].filters, kernel: P.kernel || SPEC[0].kernel, n: P.n_out || 4, sel: 0 };
  const CLASSES = ["LP", "TR", "VT", "TC"];
  const CY = 215, HMAX = 190, X0 = 30, XW = 760;

  const slabH = L => Math.max(10, Math.sqrt(L / T) * HMAX);
  const slabW = ch => 4 + 0.4 * Math.min(ch, 64);
  const convParams = (cin, cout, k) => cin * cout * k + cout + 2 * cout;   // weights, bias, BatchNorm scale and shift
  const half = node => node.kind === "io" ? 9 : node.kind === "out" || node.kind === "dense" ? 8 : slabW(node.ch) / 2;
  // the neurons drawn for a layer of `ch` numbers: at most 6, with dots between when some are left out
  const NEU = 6, GAP = 19;
  const neurons = (cx, ch) => {
    const shown = Math.min(ch, NEU), dots = ch > NEU, total = (shown - 1) * GAP + (dots ? GAP : 0);
    return Array.from({ length: shown }, (_, i) => ({ x: cx,
      y: CY - total / 2 + i * GAP + (dots && i >= shown / 2 ? GAP : 0) })).concat(dots
      ? [{ x: cx, y: CY, dots: true }] : []);
  };

  // nodes left to right: tensors; ops[i] are the operations from node i to node i+1
  function nodes() {
    const { base: b, n } = state;
    const list = [{ name: "waveform", ch: 1, L: T, kind: "io", l2: "1 channel", l3: `${T} samples` }];
    const ops = [];
    BLOCKS.forEach((bl, i) => {
      const ch = b * bl.mult;
      list.push({ name: `conv ${i + 1}`, ch, L: bl.L, kind: "feat", l2: `${ch} filters`, l3: `${bl.L} samples` });
      ops.push(bl.pool ? [`pool ÷${bl.pool.kernel}`, "conv"] : ["conv"]);
    });
    const ch = list[list.length - 1].ch;
    list.push({ name: "features", ch, L: 1, kind: "dense", l2: `${ch} values`, l3: "" });
    list.push({ name: "logits", ch: n, L: 1, kind: "out", l2: n === 1 ? "1 logit" : `${n} logits`, l3: "" });
    list.push({ name: n === 1 ? "probability" : "probabilities", ch: n, L: 1, kind: "out",
      l2: n === 1 ? "volcano-related" : "sum to 1", l3: "" });
    ops.push(["mean"], ["linear"], [n === 1 ? "sigmoid" : "softmax"]);
    return { nodes: list, ops };
  }

  function params() {
    const { base: b, kernel: k, n } = state;
    const rows = []; let cin = 1;
    BLOCKS.forEach((bl, i) => {
      const cout = b * bl.mult;
      rows.push({ name: `conv ${i + 1}`, cin, cout, p: convParams(cin, cout, k), node: i + 1 });
      cin = cout;
    });
    rows.push({ name: "linear", cin, cout: n, p: cin * n + n, node: BLOCKS.length + 2 });
    return rows;
  }

  const wave = (() => {                                // a made-up record: noise, then an onset and a coda
    let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5;
    return Array.from({ length: 140 }, (_, t) => { const q = t - 40; return 0.35 * rnd() + (q > 0 ? 1.7 * Math.exp(-q / 30) * Math.sin(q * 0.9) : 0); });
  })();

  function slab(g, cx, node, on) {
    const stroke = on ? "var(--c2)" : "var(--c1)";
    if (node.kind === "io") {                          // the record itself, time running down
      const h = slabH(node.L), top = CY - h / 2;
      el(g, "line", { x1: cx, x2: cx, y1: top, y2: top + h, stroke: on ? "var(--c2)" : "var(--ink2)", "stroke-width": 1 });
      el(g, "polyline", { points: wave.map((v, t) => `${cx + 8 * v},${top + t * h / (wave.length - 1)}`).join(" "),
        fill: "none", stroke: on ? "var(--c2)" : "var(--ink)", "stroke-width": 1 });
      el(g, "line", { x1: cx - 22, x2: cx - 22, y1: top + 6, y2: top + h - 6, stroke: "var(--ink2)" });
      el(g, "polyline", { points: `${cx - 25.5},${top + h - 11} ${cx - 22},${top + h - 6} ${cx - 18.5},${top + h - 11}`,
        fill: "none", stroke: "var(--ink2)" });
      el(g, "text", { class: "dim", x: cx - 28, y: CY, "text-anchor": "middle", transform: `rotate(-90 ${cx - 28} ${CY})` }, "time");
      return;
    }
    if (node.kind === "out" || node.kind === "dense") {   // neurons: one circle per number
      const col = on ? "var(--c2)" : "var(--ink)";
      neurons(cx, node.ch).forEach(q => q.dots
        ? el(g, "text", { class: "dim", x: q.x, y: q.y + 5, "text-anchor": "middle" }, "⋮")
        : el(g, "circle", { cx: q.x, cy: q.y, r: 7.5, fill: "var(--bg)", stroke: col, "stroke-width": on ? 1.8 : 1.2 }));
      if (state.n === 4 && node.name === "probabilities")
        CLASSES.forEach((c, i) => el(g, "text", { class: "dim", x: cx + 14, y: neurons(cx, 4)[i].y + 4,
          "font-size": 10.5 }, c));
      return;
    }
    const w = slabW(node.ch), h = slabH(node.L);
    el(g, "rect", { x: cx - w / 2, y: CY - h / 2, width: w, height: h, rx: 1.5,
      fill: stroke, "fill-opacity": on ? 0.3 : 0.2, stroke, "stroke-width": on ? 2 : 1.4 });
  }

  function draw() {
    const fig = $("fig"); fig.innerHTML = "";
    const { nodes: list, ops } = nodes();
    const n = list.length, sw = XW / n;
    const cx = i => X0 + (i + 0.5) * sw;
    const g = el(fig, "g", {});
    list.forEach((node, i) => {
      const on = i === state.sel;
      slab(g, cx(i), node, on);
      el(g, "text", { class: "name" + (on ? " sel" : ""), x: cx(i), y: 340 }, node.name);
      if (node.l2) el(g, "text", { class: "sub", x: cx(i), y: 356 }, node.l2);
      if (node.l3) el(g, "text", { class: "sub", x: cx(i), y: 371 }, node.l3);
    });
    // one arrow per step, the operations above it
    ops.forEach((op, i) => {
      if (op[0] === "linear") {                       // every feature to every logit: one line per weight
        const xa = cx(i) + 8, xb = cx(i + 1) - 8, col = i + 1 === state.sel ? "var(--c2)" : "var(--ink2)";
        neurons(cx(i), list[i].ch).filter(q => !q.dots).forEach(a =>
          neurons(cx(i + 1), list[i + 1].ch).forEach(b => el(g, "line", { x1: xa, y1: a.y, x2: xb, y2: b.y,
            stroke: col, "stroke-width": 0.8, opacity: 0.7 })));
        el(g, "text", { class: "mono dim" + (i + 1 === state.sel ? " sel" : ""), x: (xa + xb) / 2, y: CY - 78,
          "text-anchor": "middle" }, "linear");
        ["every feature feeds", "every logit"].forEach((t, j) => el(g, "text", { class: "sub", x: (xa + xb) / 2,
          y: CY + 82 + 14 * j }, t));
        return;
      }
      const x1 = cx(i) + half(list[i]) + 5, x2 = cx(i + 1) - half(list[i + 1]) - 5;
      const col = i + 1 === state.sel ? "var(--c2)" : "var(--ink2)";
      el(g, "line", { x1, x2, y1: CY, y2: CY, stroke: col, "stroke-width": 1.2 });
      el(g, "polyline", { points: `${x2 - 5},${CY - 3.5} ${x2},${CY} ${x2 - 5},${CY + 3.5}`, fill: "none",
        stroke: col, "stroke-width": 1.2 });
      op.forEach((s, j) => el(g, "text", { class: "mono dim" + (i + 1 === state.sel ? " sel" : ""),
        x: (x1 + x2) / 2, y: CY - 7 - 13 * (op.length - 1 - j), "text-anchor": "middle" }, s));
    });
    // brackets
    const bracket = (a, b, label, y0) => {
      const xa = X0 + a * sw + 12, xb = X0 + (b + 1) * sw - 12;
      el(g, "path", { d: `M${xa},${y0 - 6} V${y0} H${xb} V${y0 - 6}`, fill: "none", stroke: "var(--ink2)" });
      el(g, "text", { x: (xa + xb) / 2, y: y0 + 18, "text-anchor": "middle" }, label);
    };
    bracket(1, BLOCKS.length, "convolution blocks: find patterns", 400);
    bracket(BLOCKS.length + 1, n - 1, "head: turn them into an answer", 400);
    // hover and click targets: one column per slab
    list.forEach((node, i) => {
      const r = el(g, "rect", { class: "hit", x: cx(i) - sw / 2, y: 100, width: sw, height: 290 });
      r.onpointerenter = r.onpointerdown = () => select(i);
    });
    table();
  }

  function table() {
    const rows = params(), total = rows.reduce((a, r) => a + r.p, 0);
    $("tab").innerHTML = `<tr><th>layer</th><th>filters</th><th class="n">parameters</th></tr>` +
      rows.map(r => `<tr data-node="${r.node}" class="${r.node === state.sel ? "on" : ""}"><td>${r.name}</td>`
        + `<td>${r.cin} → ${r.cout}</td><td class="n">${fmt(r.p)}</td></tr>`).join("") +
      `<tr class="total"><td>total</td><td></td><td class="n">${fmt(total)}</td></tr>`;
    $("tab").querySelectorAll("tr[data-node]").forEach(tr => { tr.onpointerenter = tr.onclick = () => select(+tr.dataset.node); });
    const same = P.params && state.base === P.base && state.kernel === P.kernel && state.n === P.n_out;
    $("check").textContent = same
      ? (total === P.params ? "matches PyTorch’s count in the notebook" : `PyTorch counts ${fmt(P.params)}`)
      : "";
  }

  function select(i) { if (i !== state.sel) { state.sel = i; draw(); } }

  function seg(id, values, key, labels) {
    const box = $(id); box.innerHTML = "";
    values.forEach((v, i) => {
      const b = document.createElement("button");
      b.textContent = labels ? labels[i] : v; b.className = state[key] === v ? "on" : "";
      b.onclick = () => { state[key] = v; seg(id, values, key, labels); draw(); };
      box.appendChild(b);
    });
  }
  const options = (base, extra) => Array.from(new Set([...base, extra])).sort((a, b) => a - b);
  seg("seg-base", options([8, 16, 32], state.base), "base");
  seg("seg-kernel", options([3, 5, 9, 15, 25], state.kernel), "kernel");
  seg("seg-out", [1, 4], "n", ["1 logit", "4 logits"]);
  draw();
</script>
</body>
