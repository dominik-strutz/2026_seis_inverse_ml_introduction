<!doctype html>
<!-- Artifact: the backward step of the elementary operations used in backpropagation.
     General, not tied to the toy location problem. One operation f_k per cell: the forward
     function and its backward step, gradient in = gradient arriving x local derivative,
     linear operations first. u = z_{k-1} and z = z_k of the chain-rule figure.
     Shared ml_seis style (Okabe-Ito tokens, DejaVu Sans, Latin Modern, MathML).
     Blue = forward function, vermillion = local derivative (backward pass), as in
     computational_chain.html. Static, no external requests. -->

<title>Local derivatives</title>
<style>
  :root { --bg: #ffffff; --ink: #111111; --ink2: #5c6370; --c1: #0072b2; --c2: #d55e00; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #1b212c; --ink: #e6e9ef; --ink2: #a0a9b8; --c1: #56b4e9; --c2: #ff8a4d; }
  }
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: transparent;
    color: var(--ink); font: 13px/1.3 "DejaVu Sans", "Helvetica Neue", Arial, sans-serif; }
  #stage { position: absolute; left: 0; top: 0; width: 1100px; height: 440px; transform-origin: 0 0; }
  math { font-family: "Latin Modern Math", "Cambria Math", math; math-style: normal;
    white-space: nowrap; font-size: 20px; }
  #rule { margin: 14px 20px 2px; display: flex; justify-content: center; }
  #rule math { font-size: 24px; }
  .key { text-align: center; margin: 6px 20px 0; color: var(--ink2); font-size: 12px; }
  .key .f { color: var(--c1); } .key .b { color: var(--c2); }
  .grp { margin: 16px 20px 0; font-size: 11.5px; font-weight: 700; letter-spacing: .07em;
    text-transform: uppercase; }
  .blk { display: grid; grid-template-columns: repeat(5, 1fr); gap: 0 10px; margin: 0 20px; }
  .op { position: relative; display: flex; flex-direction: column; align-items: center;
    margin-top: 12px; padding: 12px 4px 6px; border: 1px solid var(--ink2); border-radius: 4px; }
  .op .nm { position: absolute; top: -7px; left: 10px; padding: 0 6px; background: var(--bg);
    font-size: 11.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
    line-height: 14px; }
  .fw { height: 48px; } .bw { min-height: 46px; flex-direction: column; gap: 0; }
  .fw, .bw { display: flex; gap: 10px; align-items: center; justify-content: center; }
  .fw math { color: var(--c1); } .ld { color: var(--c2); }
</style>

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>
</head>
<body>
<div id="stage">
<div id="rule">
  <math><mrow style="color: var(--c1)"><mi>z</mi><mo>=</mo><msub><mi>f</mi><mi>k</mi></msub><mo stretchy="false">(</mo><mi>u</mi><mo stretchy="false">)</mo></mrow>
  <mspace width="3em"></mspace>
  <msub><mi>g</mi><mi>u</mi></msub><mo>=</mo>
  <msub><mi>g</mi><mi>z</mi></msub><mo lspace="0.25em" rspace="0.25em">·</mo>
  <mrow class="ld"><mfrac><mrow><mo>∂</mo><mi>z</mi></mrow><mrow><mo>∂</mo><mi>u</mi></mrow></mfrac></mrow></math>
</div>
<div class="key"><span class="f">forward function</span> &nbsp;·&nbsp; <span class="b">local derivative</span>, the slope of the operation at its input &nbsp;·&nbsp; g is the gradient of S with respect to the value in its subscript</div>
<div class="grp">Linear: the local derivative is a constant</div><div class="blk" id="lin"></div>
<div class="grp">Nonlinear: the local derivative depends on the input</div><div class="blk" id="non"></div>
<script>
  // ---------- tiny MathML helpers ----------
  const mi = t => `<mi>${t}</mi>`, mo = t => `<mo>${t}</mo>`, mn = t => `<mn>${t}</mn>`;
  const row = (...a) => `<mrow>${a.join("")}</mrow>`;
  const sub = (a, b) => `<msub>${a}${b}</msub>`;
  const fr = (a, b) => `<mfrac>${a}${b}</mfrac>`;
  const M = (...a) => `<math>${a.join("")}</math>`;
  const eq = mo("="), minus = mo("−"), plus = mo("+");
  const d = (y, x) => fr(row(mo("∂"), y), row(mo("∂"), x));
  const z = mi("z"), u = mi("u"), w = mi("w"), c = mi("c");
  const sumI = `<munder>${mo("∑")}${mi("i")}</munder>`, ui = sub(mi("u"), mi("i"));
  // gradient of S with respect to a value, then "g_in = arriving gradient x local derivative"
  const g = t => `<msub><mi>g</mi>${t}</msub>`;
  const dot = `<mo lspace="0.25em" rspace="0.25em">·</mo>`;
  const back = (x, local) => M(g(x), eq, g(z), dot, `<mrow class="ld">${local}</mrow>`);

  const OPS = [
    { id: "lin", name: "subtract", fwd: M(z, eq, u, minus, w), bwd: [back(u, mn(1)), back(w, row(minus, mn(1)))] },
    { id: "lin", name: "add", fwd: M(z, eq, u, plus, w), bwd: [back(u, mn(1)), back(w, mn(1))] },
    { id: "lin", name: "scale by constant", fwd: M(z, eq, c, u), bwd: [back(u, c)] },
    { id: "lin", name: "mean over N values", fwd: M(z, eq, fr(mn(1), mi("N")), sumI, ui),
      bwd: [M(g(ui), eq, g(z), dot, `<mrow class="ld">${fr(mn(1), mi("N"))}</mrow>`)] },
    { id: "lin", name: "sum over i", fwd: M(z, eq, sumI, ui), bwd: [M(g(ui), eq, g(z), dot, `<mrow class="ld">${mn(1)}</mrow>`)] },
    { id: "non", name: "square", fwd: M(z, eq, `<msup>${u}${mn(2)}</msup>`),
      bwd: [back(u, row(mn(2), u))] },
    { id: "non", name: "square root", fwd: M(z, eq, `<msqrt>${u}</msqrt>`),
      bwd: [back(u, fr(mn(1), row(mn(2), z)))] },
  ];
  OPS.forEach(op => {
    const cell = document.createElement("div"); cell.className = "op";
    cell.innerHTML = `<div class="nm">${op.name}</div><div class="fw">${op.fwd}</div>`
      + `<div class="bw">${op.bwd.join("")}</div>`;
    document.getElementById(op.id).appendChild(cell);
  });

</script>
</div>
</body>
