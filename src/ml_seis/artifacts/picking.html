<!doctype html>
<!--
  Artifact: picking an arrival time, interactive.
  Adapted from the archived l01_picking.html (.agents/archive/2026-10-13_xy_horizontal_draft)
  and restyled 2026-10-14 like a matplotlib figure (no spines, light grid, Okabe-Ito colours,
  same face value as schematic_location.html): one SVG on a fixed 1100 x 336 canvas that scales
  as a unit, so type sizes keep their proportions at any slide width.

  One station is shown at a time (selector A/B/C); all three keep their own traces, picks and
  error statistics. Model: true arrival = t0 + d / v with t0 = 12.3 s, v = 6 km/s and the
  notebook's distances (A 51.48, B 38.08, C 42.72 km); there is no pick until the user clicks or
  runs the auto-picker (an animation at 10 picks/s, 5 s for 50). A pick belongs to the waveform it was made on:
  clicking or dragging moves it (the histogram entry moves with it), and the "New waveform" button
  draws fresh noise with no pick (the old pick stays counted). Waveforms are synthetic ground velocity in um/s (peak P amplitude 0.8-1.0 um/s). Noise
  is band-limited and has the same RMS (slider) at every station, so SNR falls with distance.

  The auto-picker is an AIC change-point picker (Maeda, 1985) whose window ends 0.5 s after the
  maximum of the 0.2 s moving mean-square, then refined twice in a +-0.2 s window and shifted half a
  sample earlier (the AIC split is the first signal sample). The onset is emergent, so the raw pick is
  late by ~4-9 ms (median, growing with noise); a noise-dependent shift of 0.004 + 0.05 * RMS s
  (RMS capped at 0.1) removes it, so the median error is ~0 and the histogram is centred. The scatter is ~0.01 s until SNR drops below ~4 and
  then collapses, so the slider stops at 0.20 um/s. Calibrated in numpy. The lecture's
  sigma = 0.1 s is wider than the picker's own scatter and is drawn as a band.

  Your picks are counted in the same bins as the auto-picks (stacked on top, in the pick colour).
  The x-range and bin width of panel (b) follow the expected scatter at the station's SNR
  (empirical 90th percentile of |error| ~ 0.02 s * exp(0.69 * (10 - SNR))), and widen to hold the
  user's own clicks, so the distribution always fills the panel. Gaussians are fitted (sample mean
  and standard deviation, scaled to counts per bin) to the auto-picks (n >= 2) and to the user's
  picks (n >= 3).
-->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

  aria-label="A synthetic seismogram with the picked arrival time and the distribution of pick errors at one station">
  <g id="dyn"></g>
  <text id="status" class="sm" x="620" y="18" text-anchor="end"></text>
  <line id="hv" class="hv" visibility="hidden"/>

<script>
// ------------------------------------------------------------------ model
const DT = 0.005, T0 = 17.5, T1 = 22.5, N = Math.round((T1 - T0) / DT);
const T_ORIGIN = 12.3, V = 6;                              // s, km/s, as in the notebook
const ST = [                                               // d in km from the notebook geometry
  { n: "1", d: 51.4782, amp: 0.8 },
  { n: "2", d: 38.0789, amp: 1.0 },
  { n: "3", d: 42.7200, amp: 0.9 },
];
ST.forEach(s => { s.ttrue = T_ORIGIN + s.d / V; });
let seed = 20261014;
function rand() {                                          // mulberry32
  seed = (seed + 0x6D2B79F5) | 0;
  let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
  t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
  return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
}
function gauss() { return Math.sqrt(-2 * Math.log(rand() + 1e-12)) * Math.cos(2 * Math.PI * rand()); }

function signal(st) {                                      // emergent onset plus decaying coda, um/s
  const s = new Float64Array(N);
  for (let i = 0; i < N; i++) {
    const t = T0 + i * DT - st.ttrue;
    if (t <= 0) continue;
    s[i] = st.amp * (30 * t * Math.exp(-t / 0.07) * Math.sin(2 * Math.PI * 8 * t)
      + 0.35 * Math.exp(-t / 0.9) * Math.sin(2 * Math.PI * 5.3 * t + 1.3) * (1 - Math.exp(-t / 0.05)));
  }
  return s;
}
function withNoise(S, level) {                             // band-limited noise with RMS = level
  const w = new Float64Array(N + 8), out = new Float64Array(N);
  for (let i = 0; i < w.length; i++) w[i] = gauss();
  for (let i = 0; i < N; i++) {
    let a = 0; for (let j = 0; j < 8; j++) a += w[i + j];
    out[i] = S[i] + level * a / Math.sqrt(8);
  }
  return out;
}
function aicPick(x, level) {                                // AIC change-point picker, O(N)
  const w = 40, c1 = new Float64Array(N + 1), c2 = new Float64Array(N + 1);
  for (let i = 0; i < N; i++) { c1[i + 1] = c1[i] + x[i]; c2[i + 1] = c2[i] + x[i] * x[i]; }
  const aic = (lo, hi) => {                                // best split of x[lo:hi] into noise | signal
    let best = lo + 5, bestAic = Infinity;
    for (let k = lo + 5; k < hi - 5; k++) {
      const n1 = k - lo, n2 = hi - k;
      const v1 = (c2[k] - c2[lo]) / n1 - ((c1[k] - c1[lo]) / n1) ** 2 + 1e-12;
      const v2 = (c2[hi] - c2[k]) / n2 - ((c1[hi] - c1[k]) / n2) ** 2 + 1e-12;
      const a = n1 * Math.log(v1) + (n2 - 1) * Math.log(v2);
      if (a < bestAic) { bestAic = a; best = k; }
    }
    return best;
  };
  let imax = w, emax = -1;                                 // max of the 0.2 s moving mean-square
  for (let i = w; i < N; i++) { const e = (c2[i + 1] - c2[i + 1 - w]) / w; if (e > emax) { emax = e; imax = i; } }
  let k = aic(0, Math.min(imax + 100, N));                 // first pass: window ends 0.5 s after the maximum
  for (let it = 0; it < 2; it++) k = aic(Math.max(0, k - 40), Math.min(N, k + 40));   // refine in +-0.2 s
  const late = 0.004 + 0.05 * Math.min(level, 0.1);        // AIC lags the emergent onset; calibrated so the median error is ~0
  return T0 + (k - 0.5) * DT - late;                       // k is the first signal sample: onset lies half a sample earlier
}

// ------------------------------------------------------------------ state
const $ = id => document.getElementById(id);
const clean = ST.map(signal);
const peak = clean.map(S => S.reduce((a, v) => Math.max(a, Math.abs(v)), 0));
let traces = [], picks = [null, null, null], lastErr = [null, null, null], cur = 1;   // station shown: B
let pickSrc = [null, null, null], clickIdx = [null, null, null];   // who made the pick on the shown waveform
let autoErr = [[], [], []], clickErr = [[], [], []];
const level = () => parseFloat($("noise").value);
const newTrace = i => { traces[i] = withNoise(clean[i], level()); };

// ---------------------------------------------------------------- layout
const L = { x0: 78, x1: 620 }, R = { x0: 722, x1: 990 };
const TOP = 62, ROW_H = 230, BOT = TOP + ROW_H, YLIM = 1.25, SIGMA_LECTURE = 0.1;
const XL = t => L.x0 + (t - T0) / (T1 - T0) * (L.x1 - L.x0);
const tOf = x => T0 + (x - L.x0) / (L.x1 - L.x0) * (T1 - T0);
const YL = v => TOP + ROW_H / 2 - v / YLIM * ROW_H / 2;

// x-range / bin width of panel (b): wide enough for the expected scatter at this SNR and for the clicks
const TIERS = [
  { h: 0.05, bin: 0.005, step: 0.025 }, { h: 0.1, bin: 0.005, step: 0.05 }, { h: 0.2, bin: 0.01, step: 0.1 },
  { h: 0.3, bin: 0.015, step: 0.1 }, { h: 0.5, bin: 0.025, step: 0.25 },
];
function histCfg(i) {
  const snr = peak[i] / level();
  let need = 0.9 * 0.05 * Math.exp(0.69 * (10 - snr));
  for (const e of clickErr[i]) need = Math.max(need, 1.1 * Math.abs(e));
  return TIERS.find(t => t.h >= need) || TIERS[TIERS.length - 1];
}

const mctx = document.createElement("canvas").getContext("2d");
const tw = (s, px, wt = 400) => { mctx.font = `${wt} ${px}px "DejaVu Sans", Arial, sans-serif`; return mctx.measureText(s).width; };
const fmt = v => { const a = Math.abs(v) < 1e-9 ? 0 : v; return (a < 0 ? "−" : "") + String(parseFloat(Math.abs(a).toFixed(3))); };
const sgn = (v, d) => (v < 0 && Math.abs(v) >= 0.5 * 10 ** -d ? "−" : "+") + Math.abs(v).toFixed(d);
const sub = (b, s, rest = "") =>                           // t_A with a real subscript
  `<tspan class="m">${b}</tspan><tspan class="sb" dy="3">${s}</tspan><tspan dy="-3">${rest}</tspan>`;
const T = (x, y, html, cls = "", anchor = "start", rot = 0, style = "") =>
  `<text x="${x}" y="${y}" class="${cls}" text-anchor="${anchor}"${style ? ` style="${style}"` : ""}${rot ? ` transform="rotate(${rot} ${x} ${y})"` : ""}>${html}</text>`;
const ln = (x1, y1, x2, y2, cls) => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" class="${cls}"/>`;
const r1 = v => v.toFixed(1);

function legend(items, x, y) {                             // inline legend above an axes
  let o = "";
  for (const it of items) {
    if (it.kind === "patch") { o += `<rect x="${x}" y="${y - 8}" width="18" height="9" fill="${it.fill}"/>`; o += T(x + 24, y, it.label, "sm"); x += 24 + tw(it.text, 11) + 16; }
    else if (it.kind === "note") { o += T(x, y, it.label, "sm"); x += tw(it.text, 11) + 16; }
    else { o += `<line x1="${x}" y1="${y - 4}" x2="${x + 18}" y2="${y - 4}" class="${it.cls}"/>`; o += T(x + 24, y, it.label, "sm"); x += 24 + tw(it.text, 11) + 16; }
  }
  return o;
}

// ------------------------------------------------------------- panel (a)
function drawLeft() {
  const st = ST[cur], showTrue = $("showTrue").checked, centre = $("centre").checked, sn = level();
  const snr = peak[cur] / sn, pk = picks[cur], all = picks.every(p => p !== null);
  const mean = all ? picks.reduce((a, b) => a + b, 0) / 3 : null, X = pk === null ? null : XL(pk), centreOn = centre && all;
  let o = `<defs><clipPath id="c0"><rect x="${L.x0}" y="${TOP}" width="${L.x1 - L.x0}" height="${ROW_H}"/></clipPath></defs>`;
  o += T(L.x0, 18, `<tspan font-weight="700">(a)</tspan> Station ${st.n}<tspan class="sm">  ${st.d.toFixed(1)} km · SNR ${snr.toFixed(snr < 10 ? 1 : 0)}</tspan>`, "lab");
  const items = [{ kind: "line", cls: "pk", label: "pick", text: "pick" }];
  const missing = ST.filter((_, j) => picks[j] === null).map(q => q.n).join(", ");
  if (showTrue) items.push({ kind: "line", cls: "tr", label: "true arrival", text: "true arrival" });
  if (centreOn) items.push({ kind: "line", cls: "mn", label: `<tspan class="m">t̄</tspan> mean of the 3 picks`, text: "t̄ mean of the 3 picks" });
  else if (centre) items.push({ kind: "note", label: `centring needs a pick at every station (missing ${missing})`, text: `centring needs a pick at every station (missing ${missing})` });
  items.push({ kind: "patch", fill: "var(--band)", label: "±1 RMS noise", text: "±1 RMS noise" });
  o += legend(items, L.x0, 40);

  o += ln(L.x0, TOP, L.x0, BOT, "sp") + ln(L.x0, BOT, L.x1, BOT, "sp");     // y and x spines
  for (let k = 18; k <= 22; k++) o += ln(XL(k), BOT, XL(k), BOT - 5, "sp");
  for (const v of [-1, -0.5, 0, 0.5, 1]) {
    o += ln(L.x0, YL(v), L.x0 + 5, YL(v), "sp");
    o += T(L.x0 - 8, YL(v) + 4, fmt(v), "", "end");
  }
  o += `<rect x="${L.x0}" y="${YL(sn)}" width="${L.x1 - L.x0}" height="${YL(-sn) - YL(sn)}" class="nb"/>`;
  let d = "";
  for (let j = 0; j < N; j++) d += (j ? "L" : "M") + r1(XL(T0 + j * DT)) + " " + r1(YL(traces[cur][j]));
  o += `<path d="${d}" class="tc" clip-path="url(#c0)"/>`;
  if (showTrue) o += ln(XL(st.ttrue), TOP, XL(st.ttrue), BOT, "tr");
  if (pk !== null) {
    o += ln(X, TOP, X, BOT, "pk");
    const txt = `t${st.n} = ${pk.toFixed(2)} s`, w = tw(txt, 12) + 4;
    let right = X + 6 + w < L.x1 - 2;
    if (centreOn) { const xm = XL(mean); if (right && xm > X + 4 && xm < X + 6 + w) right = false; }
    o += T(right ? X + 6 : X - 6, TOP + 16, sub("t", st.n, ` = ${pk.toFixed(2)} s`), "halo", right ? "start" : "end", 0, "fill:var(--pick)");
  }

  if (centreOn) {
    const xm = XL(mean), c = picks[cur] - mean, ya = BOT - 28, dir = c >= 0 ? 1 : -1;
    o += ln(xm, TOP, xm, BOT, "mn");
    o += T(xm, TOP - 5, `<tspan class="m">t̄</tspan> = ${mean.toFixed(2)} s`, "halo", "middle", 0, "fill:var(--mean)");
    o += `<line x1="${xm}" y1="${ya}" x2="${X}" y2="${ya}" class="mn" style="stroke-dasharray:none"/>`;
    o += `<polygon points="${X},${ya} ${X - dir * 7},${ya - 3.5} ${X - dir * 7},${ya + 3.5}" fill="var(--mean)"/>`;
    const lt = `${c >= 0 ? "+" : "−"}${Math.abs(c).toFixed(2)} s`, lw = tw(`t̃${st.n} = ${lt}`, 12) + 4;
    let lx = X + dir * 9, anchor = dir > 0 ? "start" : "end";
    const far = lx + (dir > 0 ? lw : -lw);
    if (far > L.x1 - 2 || far < L.x0 + 2) { lx = X - dir * 9; anchor = dir > 0 ? "end" : "start"; }
    o += T(lx, ya + 4, `<tspan class="m">t̃</tspan><tspan class="sb" dy="3">${st.n}</tspan><tspan dy="-3"> = ${lt}</tspan>`, "halo", anchor, 0, "fill:var(--mean)");
    ST.forEach((s, j) => {                                 // the other two picks that enter the mean
      if (j === cur) return;
      const xo = XL(picks[j]);
      o += `<polygon points="${xo - 4},${TOP + 2} ${xo + 4},${TOP + 2} ${xo},${TOP + 9}" fill="var(--ink2)"/>`;
      o += T(xo, TOP + 22, s.n, "sm halo", "middle");
    });
  }

  for (let k = 18; k <= 22; k++) o += T(XL(k), BOT + 16, String(k), "", "middle");
  o += T((L.x0 + L.x1) / 2, BOT + 35, "Time (s)", "lab", "middle");
  o += T(L.x0, BOT + 35, `← origin time <tspan class="m">t</tspan><tspan class="sb" dy="3">0</tspan><tspan dy="-3"> is earlier, not observed</tspan>`, "sm");
  o += T(18, TOP + ROW_H / 2, "Ground velocity (µm/s)", "lab", "middle", -90);
  return o;
}

// ------------------------------------------------------------- panel (b)
const niceStep = m => { for (const s of [1, 2, 5, 10, 20, 25, 50, 100, 200, 500, 1000]) if (m / s <= 5) return s; return 1000; };
const mean_ = a => a.reduce((p, q) => p + q, 0) / a.length;
const sd_ = a => Math.sqrt(a.reduce((p, q) => p + (q - mean_(a)) ** 2, 0) / (a.length - 1));

function drawRight() {
  const st = ST[cur], showTrue = $("showTrue").checked, cfg = histCfg(cur), { h, bin, step } = cfg;
  const nb = Math.round(2 * h / bin), XR = e => R.x0 + (e + h) / (2 * h) * (R.x1 - R.x0);
  const a = autoErr[cur], c = clickErr[cur], ca = new Array(nb).fill(0), cc = new Array(nb).fill(0);
  const over = [0, 0];
  const binInto = (errs, counts) => {
    for (const e of errs) { const b = Math.floor((e + h) / bin + 1e-9); if (b >= 0 && b < nb) counts[b]++; else over[e < 0 ? 0 : 1]++; }
  };
  binInto(a, ca); binInto(c, cc);
  const fitOf = (all, nmin) => {                           // Gaussian density x n x bin, fitted to the picks inside the window
    const errs = all.filter(e => Math.abs(e) <= h);        // so its area matches the bars (out-of-range picks are the arrows)
    if (errs.length < nmin) return null;
    const mu = mean_(errs), sd = Math.max(Math.sqrt(mean_(errs.map(e => (e - mu) ** 2))), bin / 4);   // ML sd
    return { mu, sd, k: errs.length * bin / (sd * Math.sqrt(2 * Math.PI)) };
  };
  const fa = fitOf(a, 2), fp = fitOf(c, 3);
  const barMax = Math.max(5, ...ca.map((n, b) => n + cc[b]));
  const cmax = Math.max(barMax, ...[fa, fp].map(f => f ? Math.min(f.k, 1.3 * barMax) : 0));
  const ys = niceStep(cmax), ymax = Math.ceil(cmax * 1.08 / ys) * ys;
  const YR = v => BOT - v / ymax * ROW_H;
  const lectureInside = SIGMA_LECTURE < h - 1e-9;

  let o = `<defs><clipPath id="c1"><rect x="${R.x0}" y="${TOP}" width="${R.x1 - R.x0}" height="${ROW_H}"/></clipPath></defs>`;
  o += T(R.x0, 18, `<tspan font-weight="700">(b)</tspan> Pick error at station ${st.n}`, "lab");
  const items = [];
  if (lectureInside) items.push({ kind: "patch", fill: "var(--band)", label: `lecture noise ±${SIGMA_LECTURE} s`, text: `lecture noise ±${SIGMA_LECTURE} s` });
  if (fa || fp) items.push({ kind: "line", cls: "fa", label: "Gaussian fit (picks in range)", text: "Gaussian fit (picks in range)" });
  o += legend(items, R.x0, 40);

  if (lectureInside) o += `<rect x="${XR(-SIGMA_LECTURE)}" y="${TOP}" width="${XR(SIGMA_LECTURE) - XR(-SIGMA_LECTURE)}" height="${ROW_H}" class="nb"/>`;
  o += ln(R.x0, TOP, R.x0, BOT, "sp") + ln(R.x0, BOT, R.x1, BOT, "sp");     // y and x spines
  for (let v = -h; v <= h + 1e-9; v += step) o += ln(XR(v), BOT, XR(v), BOT - 5, "sp");
  for (let v = 0; v <= ymax + 1e-9; v += ys) { o += ln(R.x0, YR(v), R.x0 + 5, YR(v), "sp"); o += T(R.x0 - 8, YR(v) + 4, String(v), "", "end"); }
  const barW = XR(-h + bin) - XR(-h);                      // auto-picks at the bottom, your clicks stacked on top
  ca.forEach((n, b) => {
    const x = XR(-h + b * bin), m = cc[b];
    if (n) o += `<rect x="${x.toFixed(2)}" y="${YR(n).toFixed(2)}" width="${barW.toFixed(2)}" height="${(BOT - YR(n)).toFixed(2)}" fill="var(--auto)" stroke="var(--bg)" stroke-width=".6"/>`;
    if (m) o += `<rect x="${x.toFixed(2)}" y="${YR(n + m).toFixed(2)}" width="${barW.toFixed(2)}" height="${(YR(n) - YR(n + m)).toFixed(2)}" fill="var(--pick)" stroke="var(--bg)" stroke-width=".6"/>`;
  });
  const curve = (f, color) => {                            // fitted Gaussian over the bars, clipped to the panel
    if (!f) return "";
    let d = "";
    for (let j = 0; j <= 200; j++) {
      const e = -h + 2 * h * j / 200, y = f.k * Math.exp(-0.5 * ((e - f.mu) / f.sd) ** 2);
      d += (j ? "L" : "M") + r1(XR(e)) + " " + r1(YR(y));
    }
    return `<path d="${d}" class="fitbg" clip-path="url(#c1)"/><path d="${d}" class="fit" style="stroke:${color}" clip-path="url(#c1)"/>`;
  };
  o += curve(fp, "var(--fit-p)") + curve(fa, "var(--fit-a)");
  o += ln(XR(0), TOP, XR(0), BOT, showTrue ? "tr" : "gr");
  const le = lastErr[cur];                                 // error of the pick now drawn in (a)
  if (le !== null && Math.abs(le) <= h) o += `<polygon points="${XR(le) - 5},${TOP - 10} ${XR(le) + 5},${TOP - 10} ${XR(le)},${TOP - 1}" fill="var(--pick)"/>`;
  if (over[0]) o += T(R.x0 + 4, BOT - 6, `← ${over[0]}`, "sm halo");
  if (over[1]) o += T(R.x1 - 4, BOT - 6, `${over[1]} →`, "sm halo", "end");

  for (let v = -h; v <= h + 1e-9; v += step) o += T(XR(v), BOT + 16, fmt(v), "", "middle");
  o += T((R.x0 + R.x1) / 2, BOT + 35, `Pick error <tspan class="m">t</tspan><tspan class="sb" dy="3">pick</tspan><tspan dy="-3"> − </tspan><tspan class="m">t</tspan><tspan class="sb" dy="3">true</tspan><tspan dy="-3"> (s)</tspan>`, "lab", "middle");
  o += T(R.x0 - 44, TOP + ROW_H / 2, `Picks per ${+(bin * 1000).toFixed(1)} ms bin`, "lab", "middle", -90);

  let y = TOP + 10;                                        // statistics column
  const line = (html, color) => { o += `<text x="${R.x1 + 14}" y="${y}" class="sm" style="fill:${color}">${html}</text>`; y += 13; };
  if (a.length) {
    line("auto-picker", "var(--auto)"); line(`n = ${a.length}`, "var(--ink2)");
    if (a.length > 1) {
      line(`<tspan class="m">μ</tspan> = ${sgn(mean_(a), 2)} s`, "var(--ink2)");
      line(`<tspan class="m">σ</tspan> = ${sd_(a).toFixed(2)} s`, "var(--ink2)");
    }
    y += 6;
  }
  if (c.length) {
    line("your picks", "var(--pick)"); line(`n = ${c.length}`, "var(--ink2)");
    if (c.length > 1) {
      line(`<tspan class="m">μ</tspan> = ${sgn(mean_(c), 2)} s`, "var(--ink2)");
      line(`<tspan class="m">σ</tspan> = ${sd_(c).toFixed(2)} s`, "var(--ink2)");
    }
  }
  return o;
}

function draw() {
  $("dyn").innerHTML = drawLeft() + drawRight();
  document.querySelectorAll("#stn button").forEach(b => b.classList.toggle("on", +b.dataset.i === cur));
}

// -------------------------------------------------------------- controls
const status = $("status"), HINT = "";
const AUTO_N = 50, AUTO_MS = 100;                          // 50 picks in 5 s (10 per second)
let anim = null, animDone = 0;
const idle = () => anim ? `auto-picker ${animDone}/${AUTO_N}` : HINT;
function stopAnim() {
  if (anim) { clearInterval(anim); anim = null; }
  $("auto").textContent = `Auto-pick ×${AUTO_N}`; status.textContent = HINT;
}
function svgPoint(ev) {
  const p = $("fig").createSVGPoint(); p.x = ev.clientX; p.y = ev.clientY;
  return p.matrixTransform($("fig").getScreenCTM().inverse());
}
const inTrace = p => p.x >= L.x0 && p.x <= L.x1 && p.y >= TOP && p.y <= BOT;
let dragging = false, lastDown = -Infinity;
const DBL_MS = 350;
function setClick(i, t) {                                  // one pick per waveform: a later click replaces it
  const e = t - ST[i].ttrue;
  if (pickSrc[i] === "click") clickErr[i][clickIdx[i]] = e;
  else { clickErr[i].push(e); clickIdx[i] = clickErr[i].length - 1; pickSrc[i] = "click"; }
  picks[i] = t; lastErr[i] = e;
}
$("fig").addEventListener("mousedown", ev => {
  const p = svgPoint(ev);
  if (!inTrace(p)) return;
  stopAnim(); setClick(cur, tOf(p.x));
  if (ev.timeStamp - lastDown < DBL_MS) {                  // fast double click: keep this pick, next waveform
    lastDown = -Infinity; dragging = false; draw(); nextWaveform(); return;
  }
  lastDown = ev.timeStamp; dragging = true; draw();
});
window.addEventListener("mouseup", () => { dragging = false; });
$("fig").addEventListener("mousemove", ev => {
  const p = svgPoint(ev), hv = $("hv");
  if (dragging) { setClick(cur, tOf(Math.min(L.x1, Math.max(L.x0, p.x)))); draw(); }
  if (!inTrace(p)) { hv.setAttribute("visibility", "hidden"); status.textContent = idle(); return; }
  hv.setAttribute("x1", p.x); hv.setAttribute("x2", p.x); hv.setAttribute("y1", TOP); hv.setAttribute("y2", BOT);
  hv.setAttribute("visibility", "visible");
  if (!anim) status.textContent = `station ${ST[cur].n} · t = ${tOf(p.x).toFixed(2)} s`;
});
$("fig").addEventListener("mouseleave", () => { $("hv").setAttribute("visibility", "hidden"); status.textContent = idle(); });
$("new").onclick = nextWaveform;
function nextWaveform() {                                  // fresh noise, no pick; the old pick stays counted
  stopAnim(); newTrace(cur); picks[cur] = null; lastErr[cur] = null; pickSrc[cur] = null; clickIdx[cur] = null; draw();
  status.textContent = HINT;
}
$("auto").onclick = () => {                                // step through fresh noisy traces, pick each, add to (b)
  if (anim) { stopAnim(); return; }
  animDone = 0; $("auto").textContent = "Stop";
  anim = setInterval(() => {
    const i = cur;
    newTrace(i);
    const t = aicPick(traces[i], level());
    picks[i] = t; lastErr[i] = t - ST[i].ttrue; autoErr[i].push(lastErr[i]); pickSrc[i] = "auto"; clickIdx[i] = null;
    animDone++; status.textContent = idle(); draw();
    if (animDone >= AUTO_N) stopAnim();
  }, AUTO_MS);
};
function resetPicks() { stopAnim(); autoErr = [[], [], []]; clickErr = [[], [], []]; picks = [null, null, null]; lastErr = [null, null, null]; pickSrc = [null, null, null]; clickIdx = [null, null, null]; draw(); }
$("reset").onclick = resetPicks;
$("noise").oninput = () => {
  $("noiseVal").textContent = level().toFixed(2) + " µm/s";
  ST.forEach((_, i) => newTrace(i)); resetPicks();
};
document.querySelectorAll("#stn button").forEach(b => { b.onclick = () => { stopAnim(); cur = +b.dataset.i; draw(); }; });
$("showTrue").onchange = draw; $("centre").onchange = draw;
$("noiseVal").textContent = level().toFixed(2) + " µm/s"; status.textContent = HINT;
ST.forEach((_, i) => newTrace(i)); draw();
</script>
</body>
</html>
