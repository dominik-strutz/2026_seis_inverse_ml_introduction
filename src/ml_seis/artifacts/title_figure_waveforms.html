<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<div id="stage"><svg id="fig" width="1100" height="300" viewBox="0 0 1100 300"></svg></div>
<script>
(function () {
  const NS = "http://www.w3.org/2000/svg";
  const svg = document.getElementById("fig");
  const el = (tag, attrs, text, parent) => {
    const e = document.createElementNS(NS, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text) e.textContent = text;
    (parent || svg).appendChild(e);
    return e;
  };
  let seed = 7;
  const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
  const gauss = () => Math.sqrt(-2 * Math.log(rand() + 1e-12)) * Math.cos(2 * Math.PI * rand());
  const CAP_Y = 26, TOP = 44, BOT = 252, midY = (TOP + BOT) / 2;

  // ---- 1. a seismogram with a sliding filter window
  const L1 = 70, R1 = 290, TM = 15, AX = BOT - 18;
  el("text", { x: L1, y: CAP_Y, class: "cap" }, "SEISMOGRAM");
  const x1 = t => L1 + (R1 - L1) * t / TM;
  const yc = (TOP + AX) / 2, amp = (AX - TOP) * 0.42, onset = 3.2;
  let d = "", smooth = 0; const vs = [];
  for (let k = 0; k <= 600; k++) {
    const t = TM * k / 600, s = t - onset;
    smooth = 0.7 * smooth + 0.3 * gauss();
    let v = 0.07 * gauss();
    if (s > 0) v += (0.65 * Math.exp(-s / 3.2) * Math.sin(2 * Math.PI * 1.1 * s)
      + 0.35 * Math.exp(-s / 1.6) * smooth * 2) * (1 - Math.exp(-s * 5));
    vs.push(v);
    d += (k ? "L" : "M") + x1(t).toFixed(1) + " " + (yc - amp * v).toFixed(1);
  }
  const wa = 6.6, wb = 8.4;
  el("rect", { x: x1(wa), y: TOP + 10, width: x1(wb) - x1(wa), height: AX - TOP - 10,
    fill: "none", stroke: "var(--c2)", "stroke-width": 1.6 });
  el("text", { x: (x1(wa) + x1(wb)) / 2, y: TOP + 4, "text-anchor": "middle",
    class: "tick" }, "filter");
  el("path", { d, fill: "none", stroke: "var(--c1)", "stroke-width": 1.2 });
  el("line", { x1: L1, x2: L1, y1: TOP, y2: AX, stroke: "var(--ink)" });
  el("line", { x1: L1, x2: R1, y1: AX, y2: AX, stroke: "var(--ink)" });
  for (let t = 0; t <= TM; t += 5) {
    el("line", { x1: x1(t), x2: x1(t), y1: AX, y2: AX - 5, stroke: "var(--ink)" });
    el("text", { x: x1(t), y: BOT - 3, "text-anchor": "middle", class: "tick" }, t);
  }
  el("text", { x: (L1 + R1) / 2, y: BOT + 20, "text-anchor": "middle" }, "time (s)");

  // ---- 2. convolutional network: slabs (time x filters), a stack of sheets behind each
  const NL = 372, NR = 700;
  el("text", { x: NL - 12, y: CAP_Y, class: "cap" }, "CONVOLUTIONAL NETWORK");
  const slabs = [[96, 46, 1], [66, 86, 4], [44, 126, 6], [26, 166, 8]];  // width, height, rows
  const gap = (NR - NL - slabs.reduce((a, s) => a + s[0], 0)) / (slabs.length - 1);
  let x = NL, prevR = null;
  const OFF = 6;
  slabs.forEach((sl, i) => {
    const [w, h, rows] = sl, y0 = midY - h / 2 + 4;
    // two L-shaped outlines offset up and to the right
    (i ? [2, 1] : []).forEach(j => {
      const o = OFF * j;
      el("path", { d: `M${x + o} ${y0 + h - o}V${y0 - o}H${x + w + o}`, fill: "none",
        stroke: "var(--ink2)", "stroke-width": 1, opacity: 0.45 + 0.15 * (2 - j) });
    });
    el("rect", { x, y: y0, width: w, height: h, fill: "var(--bg)", stroke: "var(--ink)",
      "stroke-width": 1.5 });
    // feature maps: a few thin traces, shortened by pooling, clipped to the slab
    const n = rows;
    if (i === 0) {  // the input: the seismogram itself
      let q = "";
      vs.forEach((v, k) => {
        q += (k ? "L" : "M") + (x + 4 + (w - 8) * k / (vs.length - 1)).toFixed(1) + " "
          + (y0 + h / 2 - h * 0.34 * v).toFixed(1);
      });
      el("path", { d: q, fill: "none", stroke: "var(--c1)", "stroke-width": 1, opacity: 0.85 });
    }
    for (let r = 0; r < (i ? n : 0); r++) {
      const yy = y0 + h * (r + 0.5) / n, a = Math.min(h / n * 0.4, 9);
      let p = "";
      for (let k = 0; k <= 40; k++) {
        const u = k / 40, t = onset / TM;
        const env = u > t * 0.9 ? Math.exp(-(u - t * 0.9) * (2 + r * 0.4)) : 0.1;
        const v = env * Math.sin(2 * Math.PI * (2.2 + 0.7 * r) * u + 1.3 * r) * (1 - 0.3 * i * 0);
        p += (k ? "L" : "M") + (x + 4 + (w - 8) * u).toFixed(1) + " " + (yy - a * v).toFixed(1);
      }
      el("path", { d: p, fill: "none", stroke: "var(--c1)", "stroke-width": 1, opacity: 0.85 });
    }
    if (prevR !== null) {
      const ya = midY + 4, xa = prevR + 4, xb = x - 4;
      el("line", { x1: xa, x2: xb, y1: ya, y2: ya, stroke: "var(--ink)", "stroke-width": 1.2 });
      el("path", { d: `M${xb - 6} ${ya - 4}L${xb} ${ya}L${xb - 6} ${ya + 4}`, fill: "none",
        stroke: "var(--ink)", "stroke-width": 1.2 });
    }
    prevR = x + w + OFF * 2;
    x += w + gap;
  });
  el("text", { x: (NL + NR) / 2, y: BOT + 20, "text-anchor": "middle" }, "learned filters");

  // ---- 3. class probabilities: four bars, the winner in vermillion
  const PL = 852, PR = 1050, classes = ["LP", "TR", "VT", "TC"], prob = [0.78, 0.14, 0.06, 0.02];
  el("text", { x: PL - 40, y: CAP_Y, class: "cap" }, "CLASS PROBABILITY");
  const px = p => PL + (PR - PL) * p, bandH = (AX - TOP) / 4;
  prob.forEach((p, i) => {
    const y0 = TOP + bandH * i + bandH * 0.2, h = bandH * 0.6;
    el("rect", { x: PL, y: y0, width: px(p) - PL, height: h,
      fill: i === 0 ? "var(--c2)" : "var(--ink2)", opacity: i === 0 ? 1 : 0.55 });
    el("text", { x: PL - 8, y: y0 + h / 2 + 4, "text-anchor": "end" }, classes[i]);
    el("text", { x: px(p) + 6, y: y0 + h / 2 + 4, class: "tick" }, p.toFixed(2));
  });
  el("line", { x1: PL, x2: PL, y1: TOP, y2: AX, stroke: "var(--ink)" });
  el("line", { x1: PL, x2: PR, y1: AX, y2: AX, stroke: "var(--ink)" });
  [0, 0.5, 1].forEach(p => {
    el("line", { x1: px(p), x2: px(p), y1: AX, y2: AX - 5, stroke: "var(--ink)" });
    el("text", { x: px(p), y: BOT - 3, "text-anchor": "middle", class: "tick" },
      p === 0 ? "0" : p === 1 ? "1" : "0.5");
  });
  el("text", { x: (PL + PR) / 2, y: BOT + 20, "text-anchor": "middle" }, "softmax output");

  // ---- arrows between the panels
  const arrow = (xa, xb) => {
    el("line", { x1: xa, x2: xb, y1: midY, y2: midY, stroke: "var(--ink)", "stroke-width": 1.5 });
    el("path", { d: `M${xb - 8} ${midY - 5}L${xb} ${midY}L${xb - 8} ${midY + 5}`, fill: "none",
      stroke: "var(--ink)", "stroke-width": 1.5 });
  };
  arrow(304, 352);
  arrow(722, 786);
})();
</script>
