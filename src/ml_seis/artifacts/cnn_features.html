<!doctype html>
<!-- Artifact: where the numbers of "the network's own coordinates" come from. The
     WaveformCNN of 2a drawn short, from the waveform through the four convolution blocks
     to the features after the average over time, then the logits and the
     probabilities. The features (the input of the last layer) are marked in vermillion:
     they are what 2b extracts and projects onto two directions. No interaction.
     window.ARTIFACT {layers, record_samples, n_out} comes from the notebook: layers from
     ml_seis.waveform_metrics.layer_spec; without it the figure draws the default
     WaveformCNN. Same slab drawing as cnn_architecture.html. Shared ml_seis style
     (src/ml_seis/styles/README.md): Okabe-Ito tokens, DejaVu Sans 13 px. Fonts are
     embedded by scripts/embed_artifact_fonts.py. -->

<script id="ml-seis-symbols">
(() => {
  const it = c => {
    const k = c.codePointAt(0);
    if (k >= 65 && k <= 90) return String.fromCodePoint(0x1D434 + k - 65);
    if (k >= 97 && k <= 122)
      return k === 104 ? "\u210E" : String.fromCodePoint(0x1D44E + k - 97);
    if (k >= 0x391 && k <= 0x3A9) return String.fromCodePoint(0x1D6E2 + k - 0x391);
    if (k >= 0x3B1 && k <= 0x3C9) return String.fromCodePoint(0x1D6FC + k - 0x3B1);
    return c;
  };
  const fix = n => {
    const p = n.parentElement;
    if (!p || !p.closest(".m, .sym")) return;
    const u = Array.from(n.nodeValue, it).join("");
    if (u !== n.nodeValue) n.nodeValue = u;
  };
  const walk = root => {
    if (root.nodeType === 3) return fix(root);
    const w = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    for (let n = w.nextNode(); n; n = w.nextNode()) fix(n);
  };
  new MutationObserver(ms => ms.forEach(m => {
    if (m.type === "characterData") fix(m.target); else m.addedNodes.forEach(walk);
  })).observe(document, { childList: true, subtree: true, characterData: true });
  document.addEventListener("DOMContentLoaded", () => walk(document.body));
})();
</script>

<body>
<div id="stage">
<svg id="fig" width="1100" height="310" viewBox="0 0 1100 310" role="img"
     aria-label="The WaveformCNN from the waveform to the answer, with the features marked"></svg>
</div>

<script>
  const ns = "http://www.w3.org/2000/svg";
  const $ = id => document.getElementById(id);
  const el = (parent, tag, attrs, text) => {
    const e = document.createElementNS(ns, tag);
    for (const k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    parent.appendChild(e); return e;
  };
  const P = window.ARTIFACT || {};
  const T = P.record_samples || 750;
  const N_OUT = P.n_out || 4;

  // the model's layers, from layer_spec in the notebook; else the default WaveformCNN
  function defaultSpec() {
    const spec = []; let L = T;
    [1, 2, 4, 4].forEach((m, i) => {
      if (i) { L = Math.floor(L / 4); spec.push({ kind: "pool", kernel: 4, filters: 16 * [1, 2, 4, 4][i - 1], length: L }); }
      spec.push({ kind: "conv", kernel: 9, filters: 16 * m, length: L });
    });
    spec.push({ kind: "avg", filters: 64, length: 1 });
    return spec;
  }
  const SPEC = P.layers || defaultSpec();
  const BLOCKS = []; let pending = null;              // one per conv: its pool before it
  SPEC.forEach(l => {
    if (l.kind === "pool") pending = l;
    else if (l.kind === "conv") { BLOCKS.push({ pool: pending, ch: l.filters, L: l.length }); pending = null; }
  });
  const FEATURES = BLOCKS[BLOCKS.length - 1].ch;
  const CLASSES = ["LP", "TR", "VT", "TC"];
  const CY = 118, HMAX = 120, X0 = 40, XW = 1020;

  const slabH = L => Math.max(10, Math.sqrt(L / T) * HMAX);
  const slabW = ch => 4 + 0.4 * Math.min(ch, 64);
  const half = node => node.kind === "io" ? 9 : node.kind === "out" || node.kind === "dense" ? 8 : slabW(node.ch) / 2;
  const NEU = 6, GAP = 19;                            // at most 6 neurons, dots when some are left out
  const neurons = (cx, ch) => {
    const shown = Math.min(ch, NEU), dots = ch > NEU, total = (shown - 1) * GAP + (dots ? GAP : 0);
    return Array.from({ length: shown }, (_, i) => ({ x: cx,
      y: CY - total / 2 + i * GAP + (dots && i >= shown / 2 ? GAP : 0) })).concat(dots
      ? [{ x: cx, y: CY, dots: true }] : []);
  };

  const wave = (() => {                                // a made-up record: noise, then an onset and a coda
    let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647 - 0.5;
    return Array.from({ length: 140 }, (_, t) => { const q = t - 40; return 0.35 * rnd() + (q > 0 ? 1.7 * Math.exp(-q / 30) * Math.sin(q * 0.9) : 0); });
  })();

  const nodes = [{ name: "waveform", ch: 1, L: T, kind: "io", l2: "1 channel", l3: `${T} samples` }];
  const ops = [];
  BLOCKS.forEach((bl, i) => {
    nodes.push({ name: `conv ${i + 1}`, ch: bl.ch, L: bl.L, kind: "feat", l2: `${bl.ch} filters`, l3: `${bl.L} samples` });
    ops.push(bl.pool ? [`pool ÷${bl.pool.kernel}`, "conv"] : ["conv"]);
  });
  nodes.push({ name: "features", ch: FEATURES, L: 1, kind: "dense", l2: `${FEATURES} values`, l3: "", mark: true });
  nodes.push({ name: "logits", ch: N_OUT, L: 1, kind: "out", l2: N_OUT === 1 ? "1 logit" : `${N_OUT} logits`, l3: "" });
  nodes.push({ name: N_OUT === 1 ? "probability" : "probabilities", ch: N_OUT, L: 1, kind: "out",
    l2: N_OUT === 1 ? "volcano-related" : "sum to 1", l3: "" });
  ops.push(["mean"], ["linear"], [N_OUT === 1 ? "sigmoid" : "softmax"]);

  function slab(g, cx, node) {
    const on = !!node.mark;
    if (node.kind === "io") {                          // the record itself, time running down
      const h = slabH(node.L), top = CY - h / 2;
      el(g, "line", { x1: cx, x2: cx, y1: top, y2: top + h, stroke: "var(--ink2)", "stroke-width": 1 });
      el(g, "polyline", { points: wave.map((v, t) => `${cx + 8 * v},${top + t * h / (wave.length - 1)}`).join(" "),
        fill: "none", stroke: "var(--ink)", "stroke-width": 1 });
      el(g, "line", { x1: cx - 22, x2: cx - 22, y1: top + 6, y2: top + h - 6, stroke: "var(--ink2)" });
      el(g, "polyline", { points: `${cx - 25.5},${top + h - 11} ${cx - 22},${top + h - 6} ${cx - 18.5},${top + h - 11}`,
        fill: "none", stroke: "var(--ink2)" });
      el(g, "text", { class: "dim", x: cx - 28, y: CY, "text-anchor": "middle", transform: `rotate(-90 ${cx - 28} ${CY})` }, "time");
      return;
    }
    if (node.kind === "out" || node.kind === "dense") {   // neurons: one circle per number
      const col = on ? "var(--c2)" : "var(--ink)";
      neurons(cx, node.ch).forEach(q => q.dots
        ? el(g, "text", { class: on ? "sel" : "dim", x: q.x, y: q.y + 5, "text-anchor": "middle" }, "⋮")
        : el(g, "circle", { cx: q.x, cy: q.y, r: 7.5, fill: "var(--bg)", stroke: col, "stroke-width": on ? 2 : 1.2 }));
      if (N_OUT === 4 && node.name === "probabilities")
        CLASSES.forEach((c, i) => el(g, "text", { class: "dim", x: cx + 14, y: neurons(cx, 4)[i].y + 4, "font-size": 10.5 }, c));
      return;
    }
    const w = slabW(node.ch), h = slabH(node.L);
    el(g, "rect", { x: cx - w / 2, y: CY - h / 2, width: w, height: h, rx: 1.5,
      fill: "var(--c1)", "fill-opacity": 0.2, stroke: "var(--c1)", "stroke-width": 1.4 });
  }

  const fig = $("fig"), n = nodes.length, sw = XW / n, cx = i => X0 + (i + 0.5) * sw;
  const g = el(fig, "g", {});
  nodes.forEach((node, i) => {
    slab(g, cx(i), node);
    el(g, "text", { class: "name" + (node.mark ? " sel" : ""), x: cx(i), y: 205 }, node.name);
    if (node.l2) el(g, "text", { class: "sub", x: cx(i), y: 221 }, node.l2);
    if (node.l3) el(g, "text", { class: "sub", x: cx(i), y: 236 }, node.l3);
  });
  // one arrow per step, the operation above it
  ops.forEach((op, i) => {
    if (op[0] === "linear") {                         // every feature to every logit: one line per weight
      const xa = cx(i) + 8, xb = cx(i + 1) - 8;
      neurons(cx(i), nodes[i].ch).filter(q => !q.dots).forEach(a =>
        neurons(cx(i + 1), nodes[i + 1].ch).forEach(b => el(g, "line", { x1: xa, y1: a.y, x2: xb, y2: b.y,
          stroke: "var(--ink2)", "stroke-width": 0.8, opacity: 0.7 })));
      el(g, "text", { class: "mono dim", x: (xa + xb) / 2, y: CY - 74, "text-anchor": "middle" }, "linear");
      return;
    }
    const x1 = cx(i) + half(nodes[i]) + 5, x2 = cx(i + 1) - half(nodes[i + 1]) - 5;
    el(g, "line", { x1, x2, y1: CY, y2: CY, stroke: "var(--ink2)", "stroke-width": 1.2 });
    el(g, "polyline", { points: `${x2 - 5},${CY - 3.5} ${x2},${CY} ${x2 - 5},${CY + 3.5}`, fill: "none",
      stroke: "var(--ink2)", "stroke-width": 1.2 });
    op.forEach((s, j) => el(g, "text", { class: "mono dim", x: (x1 + x2) / 2,
      y: CY - 7 - 13 * (op.length - 1 - j), "text-anchor": "middle" }, s));
  });
  // what we extract: the features, the input of the last layer
  const f = nodes.findIndex(q => q.mark), yTop = neurons(cx(f), FEATURES)[0].y - 12;
  el(g, "text", { class: "sel", x: cx(f), y: 20, "text-anchor": "middle" }, `extracted: ${FEATURES} numbers per record`);
  el(g, "line", { x1: cx(f), x2: cx(f), y1: 28, y2: yTop - 4, stroke: "var(--c2)", "stroke-width": 1.4 });
  el(g, "polyline", { points: `${cx(f) - 4},${yTop - 10} ${cx(f)},${yTop - 3} ${cx(f) + 4},${yTop - 10}`, fill: "none",
    stroke: "var(--c2)", "stroke-width": 1.4 });
  // brackets
  const bracket = (a, b, label, y0) => {
    const xa = X0 + a * sw + 12, xb = X0 + (b + 1) * sw - 12;
    el(g, "path", { d: `M${xa},${y0 - 6} V${y0} H${xb} V${y0 - 6}`, fill: "none", stroke: "var(--ink2)" });
    el(g, "text", { x: (xa + xb) / 2, y: y0 + 18, "text-anchor": "middle" }, label);
  };
  bracket(1, BLOCKS.length, "convolution blocks: find patterns", 268);
  bracket(BLOCKS.length + 1, n - 1, "head: turn them into an answer", 268);
</script>
</body>
