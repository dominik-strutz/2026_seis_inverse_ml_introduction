[project]
name = "ml-seis"
version = "0.1.0"
description = "Two-lecture short course on machine learning and inversion for seismologists (marimo notebooks, PyTorch)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "dominik-strutz", email = "dominikstrutz5@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "anywidget>=0.9",
    "h5py>=3.11",
    "marimo>=0.25.2",
    "matplotlib>=3.9",
    "numpy>=2",
    "scikit-fmm>=2024.5",
    "torch>=2.5",
]

[dependency-groups]
dev = [
    "pre-commit>=4",
    "pytest>=8",
    "ruff>=0.8",
]
# Instructor-only: builds the precomputed data products in data/ and the map figure
# (`uv run --group build python scripts/...`). Students never need these.
build = [
    "cartopy>=0.24",
    "numpy>=2",
    "scipy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ml_seis"]

# CPU-only PyTorch: small install, works everywhere. GPU users can drop this
# section (or override the index) and run `uv sync` again.
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.ruff]
line-length = 88
extend-exclude = [".agents", ".claude", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

